name: "What Ships Inside the logosctl Binary"
output: logosctl-modules-bundle.md
release: ""

intro: |
  `logosctl` is not just a client — it ships a small set of **bundled modules**
  that make it self-sufficient. They live next to the binary and are added to
  the daemon's module search path automatically, as read-only "embedded"
  directories sitting alongside the writable one in your session dir.

  They arrive in two directories, which is worth explaining because it looks
  odd at first:

  | Directory | Contents |
  |---|---|
  | `<bin>/../modules` | `capability_module` — bundled by **both** binaries this repo ships |
  | `<bin>/../modules-pkg` | `package_manager`, `package_downloader` — `logosctl` only |

  `logoscore` scans `modules/` and its doc-tests assert exactly what is in
  there, so the package modules go in a directory of their own rather than
  changing what `logoscore` sees. The daemon adds both paths, so the split is
  invisible in use — `module ls` shows all three.

  Three modules are bundled:

  | Module | Why it ships |
  |---|---|
  | `capability_module` | The auth handshake every client performs before its first RPC. Without it, nothing connects. |
  | `package_manager` | Installs and uninstalls packages, and owns the dependency graph. |
  | `package_downloader` | Owns the catalogs: search, dependency resolution, downloads. |

  This is the same trio [`logos-basecamp`](https://github.com/logos-co/logos-basecamp)
  bundles, so the CLI and the desktop app drive an identical module surface — the
  CLI is not a reduced-capability sibling.

  This doc-test builds **this** commit and asserts all three are present.

what_you_learn:
  - Which modules ship inside the logosctl binary, and why each one is there
  - Where bundled modules live on disk relative to the binary
  - How the embedded module directory relates to your session's writable one

prerequisites:
  - |
    **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:

    ```bash
    mkdir -p ~/.config/nix
    echo 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf
    ```

    Verify: `nix flake --help >/dev/null 2>&1 && echo "Flakes enabled"`

sections:
  - title: "Build logosctl"
    step: true
    # nix only exists on the build machine. Everything below drives the binary
    # this section produces, so it runs anywhere -- including a real Windows
    # runner, which is the point of marking this one.
    platform: [linux, macos]
    text: |
      Build the CLI from this commit. The build bundles each module into an
      `.lgx` package and installs it into the output's `modules/` directory, so
      what you get is exactly what a released binary would ship.
    steps:
      - title: "Build the CLI"
        run: 'nix build "github:logos-co/logos-logoscore-cli{release}#ctl" -o ctl'
        code_block: "nix build 'github:logos-co/logos-logoscore-cli#ctl'"
        check_file: "ctl/bin/logosctl{exe}"

  - title: "Confirm the bundled modules"
    step: true
    text: |
      All three modules must be present. `capability_module` is load-bearing for
      *any* client command; the two package modules are what let `logosctl`
      install and manage packages on its own rather than shelling out to
      separate tools.
    steps:
      - title: "List the bundled modules"
        run: "ls ctl/modules ctl/modules-pkg"
        code_block: "ls ctl/modules ctl/modules-pkg"
        expect_contains:
          - "capability_module"
          - "package_manager"
          - "package_downloader"

      - title: "Each module is a real installed package"
        text: |
          The bundler runs the package manager at build time, so every entry is
          a proper installed package — a `manifest.json`, a `variant` marker,
          and the plugin binary — not a loose library dropped in a folder.
        run: "ls ctl/modules-pkg/package_manager"
        code_block: "ls ctl/modules-pkg/package_manager"
        expect_contains:
          - "manifest.json"

  - title: "The daemon picks them up automatically"
    step: true
    text: |
      Start a daemon with no module configuration at all. It still finds all
      three, because both bundled directories are always on the search path
      alongside your session's writable `modules/` directory.
    steps:
      - title: "Start the daemon"
        run: |
          ./ctl/bin/logosctl{exe} --config-dir ./session -D > daemon.log 2>&1 &
          # Capture, then test -- NOT `status --json | grep -q`. grep -q exits on
          # its first match, the producer takes SIGPIPE (141), and under
          # `set -o pipefail` the pipeline reports 141 rather than 0, so the
          # `&& break` never fires and the wait runs all 60 iterations before
          # giving up on a daemon that came up immediately.
          for _ in $(seq 1 60); do
            st=$(./ctl/bin/logosctl{exe} --config-dir ./session status --json 2>/dev/null || true)
            case "$st" in *'"running"'*) break ;; esac
            sleep 1
          done
        code_block: "logosctl --config-dir ./session -D &"

      - title: "The bundled modules are discoverable"
        run: "./ctl/bin/logosctl{exe} --config-dir ./session module ls"
        code_block: "logosctl module ls"
        expect_contains:
          - "capability_module"
          - "package_manager"
          - "package_downloader"

      - title: "Stop the daemon"
        run: "./ctl/bin/logosctl{exe} --config-dir ./session stop"
        code_block: "logosctl daemon stop"

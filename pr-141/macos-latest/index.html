e": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 3.14 Stop the daemon\n\nShut down the daemon cleanly:\n\n```bash\nlogosctl daemon stop\n```\n\nThe daemon removes its state file and exits. You can also stop it with\n`Ctrl+C` if running in the foreground, or by sending `SIGTERM` to the\ndaemon PID shown in `logosctl daemon status`."}, {"execs": [{"cmd": "sleep 2", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 2\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session daemon status || true", "exit_code": 0, "kind": "run", "note": "expected '\"status\":\"not_running\"' not found in output", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 3.15 Confirm the daemon has stopped\n\nA final `status` confirms the shutdown. With no daemon running, the\nclient reports `not_running` instead of connecting (and exits non-zero,\nso we add `|| true` to let the doc-test assert on the output):\n\n```bash\nlogosctl daemon status\n```"}, {"execs": [{"cmd": "mkdir -p ./crashcfg/modules && cp -RL ./session/modules/. ./crashcfg/modules/\n./logos/bin/logosctl --config-dir ./crashcfg -D > crash.log 2>&1 &\nsleep 5\ndpid=$(./logos/bin/logosctl --config-dir ./crashcfg status --json | python3 -c \"import json,sys;print(json.load(sys.stdin)['daemon']['pid'])\")\nworker=\"\"\nfor h in $(pgrep -f logos_host); do\n  [ \"$(ps -o ppid= -p \"$h\" | tr -d ' ')\" = \"$dpid\" ] && { worker=\"$h\"; break; }\ndone\necho \"daemon=$dpid worker=$worker\"\nkill -9 \"$dpid\"\nresult=LEAKED\nfor i in $(seq 1 10); do\n  kill -0 \"$worker\" 2>/dev/null || { result=WORKER_CLEANED_UP; break; }\n  sleep 1\ndone\necho \"RESULT=$result\"\n", "exit_code": 0, "kind": "run", "note": "expected 'WORKER_CLEANED_UP' not found in output", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 4: ./logos/bin/logosctl: No such file or directory\nTraceback (most recent call last):\n  File \"<string>\", line 1, in <module>\n    import json,sys;print(json.load(sys.stdin)['daemon']['pid'])\n                          ~~~~~~~~~^^^^^^^^^^^\n  File \"/opt/homebrew/Cellar/python@3.14/3.14.7/Frameworks/Python.framework/Versions/3.14/lib/python3.14/json/__init__.py\", line 298, in load\n    return loads(fp.read(),\n        cls=cls, object_hook=object_hook,\n        parse_float=parse_float, parse_int=parse_int,\n        parse_constant=parse_constant, object_pairs_hook=object_pairs_hook, **kw)\n  File \"/opt/homebrew/Cellar/python@3.14/3.14.7/Frameworks/Python.framework/Versions/3.14/lib/python3.14/json/__init__.py\", line 352, in loads\n    return _default_decoder.decode(s)\n           ~~~~~~~~~~~~~~~~~~~~~~~^^^\n  File \"/opt/homebrew/Cellar/python@3.14/3.14.7/Frameworks/Python.framework/Versions/3.14/lib/python3.14/json/decoder.py\", line 345, in decode\n    obj, end = self.raw_decode(s, idx=_w(s, 0).end())\n               ~~~~~~~~~~~~~~~^^^^^^^^^^^^^^^^^^^^^^^\n  File \"/opt/homebrew/Cellar/python@3.14/3.14.7/Frameworks/Python.framework/Versions/3.14/lib/python3.14/json/decoder.py\", line 363, in raw_decode\n    raise JSONDecodeError(\"Expecting value\", s, err.value) from None\njson.decoder.JSONDecodeError: Expecting value: line 1 column 1 (char 0)\ndaemon= worker=\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 10: kill: `': not a pid or valid job spec\nRESULT=LEAKED\n", "status": "fail"}], "md": "### 3.16 A worker is not orphaned if the daemon crashes\n\nThe flip side of detaching workers into their own process group: a\nmodule subprocess must not be left **running** if the daemon dies\n*without* cleaning it up. We start a throwaway daemon, **hard-kill** it\n(`SIGKILL`, so no graceful teardown runs), and confirm its module\nsubprocess exits on its own \u2014 via `PR_SET_PDEATHSIG` on Linux and a\n`getppid` watchdog on other platforms. (Graceful shutdown, above, still\nreaps workers per-PID; this covers the crash path.)\n\n```bash\n# hard-kill the daemon; its module subprocess must exit on its own\nlogosctl daemon start --detach        # (throwaway session)\nkill -9 \"$(logosctl daemon status --json | jq .daemon.pid)\"\n```"}]}, {"meta": {"name": "Installing a Local .lgx with logosctl", "platform": "Darwin (ext=dylib)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Installing a Local .lgx with logosctl\n\n[`logosctl-packages`](logosctl-packages.md) installs from the public\ncatalog. This one never touches it.\n\nA `.lgx` you already have \u2014 one you just built, one a colleague sent you,\none pulled from a private release \u2014 installs straight from disk. The catalog\nis never consulted, no key has to be trusted, and nothing is fetched: the\nfile on disk *is* the package, and the daemon reads it where it lies.\n\nThat makes this the doc-test to read if you are developing a module, because\nthe local file is the only thing you have. It is also fully hermetic, so it\nruns offline once the two builds are done.\n\nThree spellings do the same thing:\n\n| Command | When |\n|---|---|\n| `logosctl install ./mod.lgx` | A path. Anything ending in `.lgx` is read as a file. |\n| `logosctl install --file ./mod.lgx` | The same, said explicitly. |\n| `logosctl install --dir ./drop` | Every `.lgx` in a directory, in one operation. |\n\nThe rules from the catalog doc-test still hold here \u2014 **installing does not\nload**, and the daemon does not need restarting afterwards.\n\n**What you'll build:** A logosctl session with a locally built .lgx installed from disk, loaded, and called \u2014 without consulting a catalog or the network.\n\n**What you'll learn:**\n\n- How to install a `.lgx` that is already on disk, by path, by `--file`, and by `--dir`\n- Why an argument ending in `.lgx` is read as a path rather than a catalog name\n- How to inspect a `.lgx` before installing it\n- Why catalog names and local files cannot be combined in one command\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`"}, {"execs": [], "md": "## Step 1: Build logosctl and a package to install\n\nTwo builds. The first is the CLI; the second is a real module packaged\nas a `.lgx` \u2014 `test_basic_module`, which exposes an `echo` method the\nlast step calls to prove the installed files actually run.\n\nThis uses the **dev** build (`#ctl`) rather than the portable bundle,\nbecause a nix-built `.lgx` carries a `-dev` variant. A portable\n`logosctl` looks for the unsuffixed variant and would correctly refuse\nthis package \u2014 that mismatch is the variant contract working, not a\nfailure. The\n[catalog doc-test](logosctl-packages.md) is the other way round: released\npackages are portable, so it builds the portable bundle."}, {"execs": [{"cmd": "nix build \"github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560#ctl\" -o ctl", "exit_code": 1, "kind": "run", "note": "exit code 1", "output": "error:\n       \u2026 while updating the lock file of flake 'github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560?narHash=sha256-j%2BJYGfj9HGAvkA3ZPR41V9TIyCN0zYmszA51%2BtjMYME%3D'\n\n       error: cannot write modified lock file of flake 'github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560' (use '--no-write-lock-file' to ignore)\n", "status": "fail"}], "md": "### 1.1 Build the CLI\n\n```bash\nnix build 'github:logos-co/logos-logoscore-cli#ctl' -o ctl\n```"}, {"execs": [{"cmd": "SYS=$(nix eval --impure --raw --expr builtins.currentSystem)\nnix build \"github:logos-co/logos-test-modules#modules.$SYS.test_basic_module.lgx\" -o test-lgx\n# Copy it out of the read-only store so the rest of the doc-test can\n# treat it like any other file sitting in a directory.\ncp test-lgx/*.lgx ./test_basic_module.lgx\nchmod +w ./test_basic_module.lgx\nls -l ./test_basic_module.lgx\n", "exit_code": 0, "kind": "run", "note": "", "output": "these 2 paths will be fetched (0.0 KiB download, 3.3 MiB unpacked):\n  /nix/store/v65i4jnyf06pz96x8kgjn37z0ggfvp2x-logos-test_basic_module-module-lib-1.0.0\n  /nix/store/q9i45ms8myw72w05l4wkaq397nrkfh89-logos-test_basic_module-module-lib-lgx-1.0.0\ncopying path '/nix/store/v65i4jnyf06pz96x8kgjn37z0ggfvp2x-logos-test_basic_module-module-lib-1.0.0' from 'https://cache.nix.logos.co/ci'...\ncopying path '/nix/store/q9i45ms8myw72w05l4wkaq397nrkfh89-logos-test_basic_module-module-lib-lgx-1.0.0' from 'https://cache.nix.logos.co/ci'...\n-rw-r--r--  1 runner  wheel  773727 Sep 22 12:25 ./test_basic_module.lgx\n", "status": "pass"}], "md": "### 1.2 Build a module as a .lgx\n\nThe `.lgx` lives under a per-system attribute, so the current system\nis resolved first. From inside a module's own clone this is just\n`nix build '.#lgx'` \u2014 which is what you would actually run while\ndeveloping one.\n\n```bash\n# In a module's own checkout:\nnix build '.#lgx' -o test-lgx\ncp test-lgx/*.lgx ./test_basic_module.lgx\n```"}, {"execs": [], "md": "## Step 2: Start a session\n\nA session is one directory holding config, installed packages and\nper-module state. Note what is *not* done here: no `catalog add`, no\n`catalog refresh`, no keys added. A local install needs none of it \u2014\nthe default catalog stays exactly as it was, unread."}, {"execs": [{"cmd": "./ctl/bin/logosctl --config-dir ./session daemon start --detach", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./ctl/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 2.1 Start the daemon\n\n`--detach` returns only once the daemon is accepting commands, so\nthe next command cannot race the boot.\n\n```bash\nlogosctl --config-dir ./session daemon start --detach\n```"}, {"execs": [{"cmd": "./ctl/bin/logosctl --human --config-dir ./session package ls", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./ctl/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 2.2 Nothing is installed yet\n\nThe two `embedded` entries are the package modules that ship inside\nthe binary. Anything this doc-test installs shows up alongside them\nas `user`.\n\n```bash\nlogosctl package ls\n```"}, {"execs": [], "md": "## Step 3: Look before you install\n\n`package show` takes a path as readily as a name, so a `.lgx` can be\ninspected before anything is written to the session. This is the step\nworth taking with a file you did not build yourself: it reports the\nsignature status, and whether some version of it is already installed."}, {"execs": [{"cmd": "./ctl/bin/logosctl --human --config-dir ./session package show ./test_basic_module.lgx", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./ctl/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 3.1 Inspect the file\n\n```bash\nlogosctl package show ./test_basic_module.lgx\n```"}, {"execs": [{"cmd": "./ctl/bin/logosctl --human --config-dir ./session package install ./test_basic_module.lgx --dry-run", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./ctl/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 3.2 Preview the install\n\n`--dry-run` plans the operation and stops. The package is read off\ndisk to do it, which is why the plan can name a version for\nsomething no catalog has ever heard of.\n\n```bash\nlogosctl package install ./test_basic_module.lgx --dry-run\n```"}, {"execs": [], "md": "## Step 4: Install it\n\nThe path is a positional argument \u2014 `install` reads anything ending in\n`.lgx` as a file, because a catalog name cannot carry that suffix. Being\nexplicit with `--file` does exactly the same thing.\n\n`-y` is required in a script: a mutating command with no `-y` and no\nterminal to prompt on is refused rather than assumed-yes."}, {"execs": [{"cmd": "./ctl/bin/logosctl --human --config-dir ./session install ./test_basic_module.lgx -y", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./ctl/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 4.1 Install from the local file\n\n```bash\nlogosctl install ./test_basic_module.lgx -y\n```"}, {"execs": [{"cmd": "./ctl/bin/logosctl --human --config-dir ./session package ls", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./ctl/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 4.2 It is installed into the session\n\nIts source is `user` \u2014 it lives in the session's writable `modules/`\ndirectory, unlike the `embedded` package modules that ship inside\nthe binary.\n\n```bash\nlogosctl package ls\n```"}, {"execs": [], "md": "## Step 5: It really runs\n\nInstalling put files on disk and stopped there. Loading is the separate,\nexplicit act \u2014 and calling a method is what proves the installed copy is\na working module rather than a well-formed archive."}, {"execs": [{"cmd": "./ctl/bin/logosctl --human --config-dir ./session module load test_basic_module", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./ctl/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 5.1 Load the module\n\n```bash\nlogosctl module load test_basic_module\n```"}, {"execs": [{"cmd": "./ctl/bin/logosctl --human --config-dir ./session call test_basic_module echo hello", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./ctl/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 5.2 Call a method on it\n\n```bash\nlogosctl call test_basic_module echo hello\n```"}, {"execs": [], "md": "## Step 6: A directory of packages\n\n`--dir` takes every `.lgx` in a directory as one operation \u2014 the shape\nyou want when a build drops several packages side by side.\n\nRe-running it over a package that is already installed is a\n**reinstall**, and because `test_basic_module` is loaded right now, the\nplan says so: it has to be stopped and restarted around the file\nreplacement."}, {"execs": [{"cmd": "mkdir -p drop\ncp ./test_basic_module.lgx drop/\nls drop\n", "exit_code": 0, "kind": "run", "note": "", "output": "test_basic_module.lgx\n", "status": "pass"}], "md": "### 6.1 Drop the package in a directory\n\n```bash\ncp ./test_basic_module.lgx drop/\n```"}, {"execs": [{"cmd": "./ctl/bin/logosctl --human --config-dir ./session package install --dir ./drop --dry-run", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./ctl/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 6.2 Plan an install from the directory\n\n```bash\nlogosctl package install --dir ./drop --dry-run\n```"}, {"execs": [], "md": "## Step 7: What is refused, and why\n\nTwo refusals are worth seeing, because both replaced a silent wrong\nanswer.\n\nA local file and a catalog name resolve by completely different rules \u2014\none is read off disk, the other is looked up and downloaded \u2014 and the\ndaemon plans one way or the other. A request carrying both used to\ninstall the files and quietly drop the names. It is now refused, so\n\"install these four things\" never means \"install two of them\".\n\nA path that does not exist is reported as a missing file. Before, it\nfell through to the catalog resolver and came back as `no candidate\nmatches './typo.lgx'`, which reads like the package was rejected rather\nthan never found."}, {"execs": [{"cmd": "out=$(./ctl/bin/logosctl --human --config-dir ./session \\\n        package install some_catalog_package ./test_basic_module.lgx -y 2>&1) && {\n  echo \"UNEXPECTED: mixing was accepted\"; exit 1; }\necho \"$out\"\n", "exit_code": 0, "kind": "run", "note": "expected 'Cannot mix catalog packages with local .lgx files' not found in output", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 2: ./ctl/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 7.1 Mixing a name and a file is refused\n\n```bash\nlogosctl package install some_catalog_package ./test_basic_module.lgx -y\n```"}, {"execs": [{"cmd": "out=$(./ctl/bin/logosctl --human --config-dir ./session \\\n        package install ./typo.lgx -y 2>&1) && {\n  echo \"UNEXPECTED: a missing file was accepted\"; exit 1; }\necho \"$out\"\n", "exit_code": 0, "kind": "run", "note": "expected 'No such .lgx file: ./typo.lgx' not found in output", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 2: ./ctl/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 7.2 A missing file is reported as a missing file\n\n```bash\nlogosctl package install ./typo.lgx -y\n```"}, {"execs": [], "md": "## Step 8: Clean up\n\n`remove` takes the package **name**, not the file it came from \u2014 once\ninstalled, the `.lgx` has done its job and the session tracks the\npackage by name like any other. It stops the module first, since its\nfiles are about to disappear."}, {"execs": [{"cmd": "./ctl/bin/logosctl --human --config-dir ./session package remove test_basic_module -y", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./ctl/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 8.1 Remove the package\n\n```bash\nlogosctl package remove test_basic_module -y\n```"}, {"execs": [{"cmd": "./ctl/bin/logosctl --config-dir ./session daemon stop", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./ctl/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 8.2 Stop the daemon\n\n```bash\nlogosctl daemon stop\n```"}]}, {"meta": {"name": "What Ships Inside the logosctl Binary", "platform": "Darwin (ext=dylib)", "release": "(none)"}, "rows": [{"execs": [], "md": "# What Ships Inside the logosctl Binary\n\n`logosctl` is not just a client \u2014 it ships a small set of **bundled modules**\nthat make it self-sufficient. They live next to the binary and are added to\nthe daemon's module search path automatically, as read-only \"embedded\"\ndirectories sitting alongside the writable one in your session dir.\n\nThey arrive in two directories, which is worth explaining because it looks\nodd at first:\n\n| Directory | Contents |\n|---|---|\n| `<bin>/../modules` | `capability_module`, `modules_state` \u2014 bundled by **both** binaries this repo ships |\n| `<bin>/../modules-pkg` | `package_manager`, `package_downloader` \u2014 `logosctl` only |\n\n`logoscore` scans `modules/`, so the package modules go in a directory of\ntheir own rather than widening what `logoscore` sees by default. The daemon\nadds both paths, so the split is invisible in use \u2014 `module ls` shows them all.\n\nThese assertions check that the modules that matter are PRESENT, not that the\nset is exactly this. Pinning an exact list would break this file for every\nfuture bundled module, for no reason.\n\nFour modules are bundled:\n\n| Module | Why it ships |\n|---|---|\n| `capability_module` | The auth handshake every client performs before its first RPC. Without it, nothing connects. |\n| `modules_state` | The module lifecycle registry. liblogos feeds it load/unload/crash as sequenced facts, so consumers stop polling. Optional: absent, the feed never arms. |\n| `package_manager` | Installs and uninstalls packages, and owns the dependency graph. |\n| `package_downloader` | Owns the catalogs: search, dependency resolution, downloads. |\n\nThis is the same set [`logos-basecamp`](https://github.com/logos-co/logos-basecamp)\nbundles, so the CLI and the desktop app drive an identical module surface \u2014 the\nCLI is not a reduced-capability sibling.\n\nThis doc-test builds **this** commit and asserts each of them is present.\n\n**What you'll learn:**\n\n- Which modules ship inside the logosctl binary, and why each one is there\n- Where bundled modules live on disk relative to the binary\n- How the embedded module directory relates to your session's writable one\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`"}, {"execs": [], "md": "## Step 1: Build logosctl\n\nBuild the CLI from this commit. The build bundles each module into an\n`.lgx` package and installs it into the output's `modules/` directory, so\nwhat you get is exactly what a released binary would ship."}, {"execs": [{"cmd": "nix build \"github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560#ctl\" -o ctl", "exit_code": 1, "kind": "run", "note": "exit code 1", "output": "error:\n       \u2026 while updating the lock file of flake 'github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560?narHash=sha256-j%2BJYGfj9HGAvkA3ZPR41V9TIyCN0zYmszA51%2BtjMYME%3D'\n\n       error: cannot write modified lock file of flake 'github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560' (use '--no-write-lock-file' to ignore)\n", "status": "fail"}], "md": "### 1.1 Build the CLI\n\n```bash\nnix build 'github:logos-co/logos-logoscore-cli#ctl'\n```"}, {"execs": [], "md": "## Step 2: Confirm the bundled modules\n\nEach must be present. `capability_module` is load-bearing for\n*any* client command; the two package modules are what let `logosctl`\ninstall and manage packages on its own rather than shelling out to\nseparate tools."}, {"execs": [{"cmd": "ls ctl/modules ctl/modules-pkg", "exit_code": 1, "kind": "run", "note": "exit code 1", "output": "ls: ctl/modules: No such file or directory\nls: ctl/modules-pkg: No such file or directory\n", "status": "fail"}], "md": "### 2.1 List the bundled modules\n\n```bash\nls ctl/modules ctl/modules-pkg\n```"}, {"execs": [{"cmd": "ls ctl/modules-pkg/package_manager", "exit_code": 1, "kind": "run", "note": "exit code 1", "output": "ls: ctl/modules-pkg/package_manager: No such file or directory\n", "status": "fail"}], "md": "### 2.2 Each module is a real installed package\n\nThe bundler runs the package manager at build time, so every entry is\na proper installed package \u2014 a `manifest.json`, a `variant` marker,\nand the plugin binary \u2014 not a loose library dropped in a folder.\n\n```bash\nls ctl/modules-pkg/package_manager\n```"}, {"execs": [], "md": "## Step 3: The daemon picks them up automatically\n\nStart a daemon with no module configuration at all. It still finds all\nthree, because both bundled directories are always on the search path\nalongside your session's writable `modules/` directory."}, {"execs": [{"cmd": "# Captured, as a script would: $(...) reads through a pipe that the\n# detached daemon must not inherit, or this line waits for it to exit.\nout=\"$(./ctl/bin/logosctl --config-dir ./session daemon start --detach)\"\nprintf '%s\\n' \"$out\"\n", "exit_code": 0, "kind": "run", "note": "expected 'Daemon started' not found in output", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 3: ./ctl/bin/logosctl: No such file or directory\n\n", "status": "fail"}], "md": "### 3.1 Start the daemon\n\n```bash\nlogosctl --config-dir ./session daemon start --detach\n```"}, {"execs": [{"cmd": "./ctl/bin/logosctl --config-dir ./session module ls", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./ctl/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 3.2 The bundled modules are discoverable\n\n```bash\nlogosctl module ls\n```"}, {"execs": [{"cmd": "./ctl/bin/logosctl --config-dir ./session stop", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./ctl/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 3.3 Stop the daemon\n\n```bash\nlogosctl daemon stop\n```"}]}, {"meta": {"name": "Installing and Removing Packages with logosctl", "platform": "Darwin (ext=dylib)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Installing and Removing Packages with logosctl\n\nThis is the capability that made `logosctl` worth merging: it installs\npackages itself. Previously that took three binaries \u2014 `lgpd` to search a\ncatalog and download a `.lgx`, `lgpm` to install it, and `logoscore` to run\nit \u2014 wired together by hand.\n\n`logosctl` bundles the `package_manager` and `package_downloader` modules\n(the same pair the Basecamp desktop app ships), so one tool covers the whole\nloop: search a catalog, install with dependencies resolved, load, call, and\nremove again.\n\nTwo rules shape everything below, and they are worth stating up front:\n\n- **Installing does not load.** `install` puts files on disk; `module load`\n  activates them. They are separate acts because you may well want to stage\n  a package without starting it.\n- **The daemon does not need restarting.** After an install it re-scans, so a\n  freshly installed module is loadable immediately. Only modules that were\n  *already running* and had to be stopped get restarted.\n\nThis doc-test runs against the **live** module catalog, so it needs network\naccess.\n\n**What you'll build:** A logosctl session with a real package installed from the public catalog, loaded, called, and then removed along with everything that depended on it.\n\n**What you'll learn:**\n\n- How a logosctl session holds its own packages, and why that makes it portable\n- How to search the catalog and preview an install with `--dry-run`\n- Why `install` deliberately leaves the package unloaded\n- How dependencies are resolved on install, and dependents removed on uninstall\n- Why a destructive command with no `-y` and no terminal is refused rather than assumed\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`\n\n- **Network access.** The catalog and the packages are fetched from the public module release repository."}, {"execs": [], "md": "## Step 1: Build the portable logosctl bundle\n\nPackages in the public catalog ship **portable** variants, so this\ndoc-test uses the portable bundle rather than the dev build. A dev build\nlooks for `-dev` variants and would correctly refuse to install a\nreleased package \u2014 that mismatch is a feature, not a failure."}, {"execs": [{"cmd": "nix build \"github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560#ctl-bundle-dir\" -o result-portable", "exit_code": 1, "kind": "run", "note": "exit code 1", "output": "error:\n       \u2026 while updating the lock file of flake 'github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560?narHash=sha256-j%2BJYGfj9HGAvkA3ZPR41V9TIyCN0zYmszA51%2BtjMYME%3D'\n\n       error: cannot write modified lock file of flake 'github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560' (use '--no-write-lock-file' to ignore)\n", "status": "fail"}], "md": "### 1.1 Build the bundle\n\n```bash\nnix build 'github:logos-co/logos-logoscore-cli#ctl-bundle-dir' -o result-portable\n```"}, {"execs": [], "md": "## Step 2: Start a session\n\nA **session** is one directory holding everything: config, the packages\ninstalled into it, per-module persistence, and the keyring used to verify\nsignatures. `--config-dir` picks which one. Nothing here touches\n`~/.logosctl`, and nothing touches a `logoscore` deployment either \u2014 the\ntwo tools share no state."}, {"execs": [{"cmd": "./result-portable/bin/logosctl --config-dir ./session daemon start --detach", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./result-portable/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 2.1 Start the daemon\n\n`--detach` returns only once the daemon is actually accepting\ncommands, so the next command cannot race the boot.\n\n```bash\nlogosctl --config-dir ./session daemon start --detach\n```"}, {"execs": [{"cmd": "./result-portable/bin/logosctl --config-dir ./session module ls", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./result-portable/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 2.2 The package modules come up with it\n\n`package_manager` and `package_downloader` are bundled and loaded at\nboot, because every package command is a call into them.\n\n```bash\nlogosctl module ls\n```"}, {"execs": [], "md": "## Step 3: Find something to install\n\nThe catalog is the merged view over every enabled source. One ships by\ndefault; `logosctl catalog add <url>` adds more."}, {"execs": [{"cmd": "./result-portable/bin/logosctl --config-dir ./session catalog ls", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./result-portable/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 3.1 List the configured catalogs\n\n```bash\nlogosctl catalog ls\n```"}, {"execs": [{"cmd": "./result-portable/bin/logosctl --config-dir ./session package search openmetrics", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./result-portable/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 3.2 Search it\n\n```bash\nlogosctl search openmetrics\n```"}, {"execs": [], "md": "## Step 4: Preview, then install\n\n`--dry-run` resolves everything and prints exactly what would change \u2014\nincluding which running modules would be stopped and restarted \u2014 without\nwriting anything.\n\nOutput below is JSON because these commands are piped rather than run on\na terminal; on a terminal you get the same information as a table. `--json`\nand `--human` force either form."}, {"execs": [{"cmd": "./result-portable/bin/logosctl --config-dir ./session install openmetrics --dry-run", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./result-portable/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 4.1 Preview the install\n\n```bash\nlogosctl install openmetrics --dry-run\n```"}, {"execs": [{"cmd": "./result-portable/bin/logosctl --config-dir ./session install openmetrics -y", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./result-portable/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 4.2 Install for real\n\n`-y` skips the confirmation. Without it, and with no terminal to ask\non, the command is **refused** rather than assumed \u2014 a script that\nforgot `--yes` should fail loudly, not quietly install things.\n\n```bash\nlogosctl install openmetrics -y\n```"}, {"execs": [{"cmd": "./result-portable/bin/logosctl --config-dir ./session package ls", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./result-portable/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 4.3 It landed in the session, not the bundle\n\n`SOURCE` distinguishes the read-only modules shipped beside the\nbinary (`embedded`) from what this session installed (`user`).\n\n```bash\nlogosctl package ls\n```"}, {"execs": [], "md": "## Step 5: Installed is not loaded\n\nThe package is on disk and the daemon has already re-scanned, so it is\ndiscoverable \u2014 but it is not running. That separation is deliberate."}, {"execs": [{"cmd": "./result-portable/bin/logosctl --config-dir ./session module ls", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./result-portable/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 5.1 Discoverable, not loaded\n\n```bash\nlogosctl module ls\n```"}, {"execs": [{"cmd": "./result-portable/bin/logosctl --config-dir ./session module load openmetrics", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./result-portable/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 5.2 Load it \u2014 no daemon restart needed\n\n```bash\nlogosctl module load openmetrics\n```"}, {"execs": [{"cmd": "./result-portable/bin/logosctl --config-dir ./session module ls --loaded", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./result-portable/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 5.3 Confirm it is running\n\n```bash\nlogosctl module ls --loaded\n```"}, {"execs": [], "md": "## Step 6: Remove it\n\nRemoval is the mirror image of install: it takes **dependents** with it by\ndefault, because leaving a module running against a package that no longer\nexists is the more surprising outcome. `--no-dependents` opts out."}, {"execs": [{"cmd": "./result-portable/bin/logosctl --config-dir ./session package remove openmetrics --dry-run", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./result-portable/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 6.1 Preview the removal\n\nNote that it reports the running module it will stop. Nothing here is\nrestarted afterwards \u2014 it is being removed.\n\n```bash\nlogosctl package remove openmetrics --dry-run\n```"}, {"execs": [{"cmd": "./result-portable/bin/logosctl --config-dir ./session package remove openmetrics -y", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./result-portable/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 6.2 Remove for real\n\n```bash\nlogosctl package remove openmetrics -y\n```"}, {"execs": [{"cmd": "./result-portable/bin/logosctl --config-dir ./session package ls", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./result-portable/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 6.3 Gone from the session\n\n```bash\nlogosctl package ls\n```"}, {"execs": [{"cmd": "./result-portable/bin/logosctl --config-dir ./session daemon stop", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./result-portable/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 6.4 Stop the daemon\n\n```bash\nlogosctl daemon stop\n```"}]}, {"meta": {"name": "Qt-free logosctl transport boundary", "platform": "Darwin (ext=dylib)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Qt-free logosctl transport boundary\n\nThe Qt-free logosctl process uses qt_remote_plain for local RPC. It keeps\ncompatibility with current qt_remote modules while Qt stays in logos_host_qt.\nTCP and TLS are intentionally rejected until the plain C ABI implements them.\n\n**What you'll learn:**\n\n- The active transport is local qt_remote_plain\n- Old network configuration fails explicitly\n\n## Prerequisites\n\n- Nix with flakes enabled."}, {"execs": [], "md": "## Step 1: Build logosctl"}, {"execs": [{"cmd": "nix build 'github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560#ctl' --out-link ./logos", "exit_code": 1, "kind": "run", "note": "exit code 1", "output": "error:\n       \u2026 while updating the lock file of flake 'github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560?narHash=sha256-j%2BJYGfj9HGAvkA3ZPR41V9TIyCN0zYmszA51%2BtjMYME%3D'\n\n       error: cannot write modified lock file of flake 'github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560' (use '--no-write-lock-file' to ignore)\n", "status": "fail"}], "md": "### 1.1 Build the CLI\n\n```bash\nnix build 'github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560#ctl' --out-link ./logos\n```"}, {"execs": [], "md": "## Step 2: Reject a network listener\n\nConfiguration validation still accepts the old schema, then daemon\nstartup reports that the runtime cannot bind the requested listener."}, {"execs": [{"cmd": "cat > node.yaml <<'YAML'\nversion: 2\nmodules:\n  core_service:\n    - protocol: tcp\n      host: 127.0.0.1\n      port: 6000\nYAML\n./logos/bin/logosctl --config-dir ./session daemon config set ./node.yaml\n", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 9: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 2.1 Install an old network-shaped config\n\n```bash\ncat > node.yaml <<'YAML'\nversion: 2\nmodules:\n  core_service:\n    - protocol: tcp\n      host: 127.0.0.1\n      port: 6000\nYAML\n./logos/bin/logosctl --config-dir ./session daemon config set ./node.yaml\n\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session daemon start 2>&1 || true", "exit_code": 0, "kind": "run", "note": "expected 'not available in the Qt-free logoscore runtime' not found in output", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 2.2 Start the daemon\n\n```bash\nlogosctl daemon start\n```"}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>

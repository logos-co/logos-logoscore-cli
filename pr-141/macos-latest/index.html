tus": "fail"}], "md": "### 5.4 Async forwarding of the FULL surface through the proxy (start -> read)\n\nThe proxy also forwards through the **asynchronous** client wrappers (the\ngenerated `<method>Async` twins). `probeAsync` fires EVERY method of the\nfull_api surface \u2014 scalars, bstr, any, every array type, map and result \u2014\nasynchronously and returns immediately; the completions land out-of-band\non the transport's delivery thread. A moment later `getAsyncProbe` reads\nthe verified tally back as a single `ALL_OK_ASYNC:<provider>` token,\nproving the proxy -> provider **async** path for the whole surface,\nagainst both the C++ and the Rust provider. (This is the same non-blocking\npath the UI exercises in the Basecamp full-API check.)\n\n```bash\n./logos/bin/logoscore call test_fullapi_proxy useProvider test_fullapi_cpp\n./logos/bin/logoscore call test_fullapi_proxy probeAsync\nsleep 2\n./logos/bin/logoscore call test_fullapi_proxy getAsyncProbe\n./logos/bin/logoscore call test_fullapi_proxy useProvider test_fullapi_rust\n./logos/bin/logoscore call test_fullapi_proxy probeAsync\nsleep 2\n./logos/bin/logoscore call test_fullapi_proxy getAsyncProbe\n\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call test_fullapi_proxy useProvider test_fullapi_cpp\n./logos/bin/logoscore call test_fullapi_proxy fireStringEvent hello\nsleep 1\n./logos/bin/logoscore call test_fullapi_proxy getLastEvent\n", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 2: ./logos/bin/logoscore: No such file or directory\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 4: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 5.5 Event round-trip (subscribe is done at load; trigger -> read)\n\nThe proxy subscribes to the bound provider's events and captures the\nlatest. Triggering an event, then reading it back, exercises the whole\nprovider -> proxy event path. The daemon's event loop pumps the delivery\nbetween the two client calls.\n\n```bash\n./logos/bin/logoscore call test_fullapi_proxy useProvider test_fullapi_cpp\n./logos/bin/logoscore call test_fullapi_proxy fireStringEvent hello\nsleep 1\n./logos/bin/logoscore call test_fullapi_proxy getLastEvent\n\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call test_fullapi_proxy useProvider test_fullapi_rust\n./logos/bin/logoscore call test_fullapi_proxy fireIntEvent 7\nsleep 1\n./logos/bin/logoscore call test_fullapi_proxy getLastEvent\n", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 2: ./logos/bin/logoscore: No such file or directory\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 4: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 5.6 Cross-language event round-trip\n\n```bash\n./logos/bin/logoscore call test_fullapi_proxy useProvider test_fullapi_rust\n./logos/bin/logoscore call test_fullapi_proxy fireIntEvent 7\nsleep 1\n./logos/bin/logoscore call test_fullapi_proxy getLastEvent\n\n```"}, {"execs": [], "md": "## Step 6: The Rust proxy does the same, in Rust\n\n`test_fullapi_proxy_rust` is the Rust mirror: it consumes `full_api` via the\nsame interface dependency (a generated `FullApiClient::bind`) and re-exposes\nit. It forwards to and captures events from both providers too."}, {"execs": [{"cmd": "./logos/bin/logoscore call test_fullapi_proxy_rust useProvider test_fullapi_cpp\n./logos/bin/logoscore call test_fullapi_proxy_rust whoAmI\n./logos/bin/logoscore call test_fullapi_proxy_rust echoDouble 2.5\n./logos/bin/logoscore call test_fullapi_proxy_rust useProvider test_fullapi_rust\n./logos/bin/logoscore call test_fullapi_proxy_rust whoAmI\n", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 2: ./logos/bin/logoscore: No such file or directory\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 3: ./logos/bin/logoscore: No such file or directory\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 4: ./logos/bin/logoscore: No such file or directory\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 5: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 6.1 Forward to both providers\n\n```bash\n./logos/bin/logoscore call test_fullapi_proxy_rust useProvider test_fullapi_cpp\n./logos/bin/logoscore call test_fullapi_proxy_rust whoAmI\n./logos/bin/logoscore call test_fullapi_proxy_rust echoDouble 2.5\n./logos/bin/logoscore call test_fullapi_proxy_rust useProvider test_fullapi_rust\n./logos/bin/logoscore call test_fullapi_proxy_rust whoAmI\n\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call test_fullapi_proxy_rust useProvider test_fullapi_cpp\n./logos/bin/logoscore call test_fullapi_proxy_rust probeAsync\nsleep 2\n./logos/bin/logoscore call test_fullapi_proxy_rust getAsyncProbe\n./logos/bin/logoscore call test_fullapi_proxy_rust useProvider test_fullapi_rust\n./logos/bin/logoscore call test_fullapi_proxy_rust probeAsync\nsleep 2\n./logos/bin/logoscore call test_fullapi_proxy_rust getAsyncProbe\n", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 2: ./logos/bin/logoscore: No such file or directory\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 4: ./logos/bin/logoscore: No such file or directory\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 5: ./logos/bin/logoscore: No such file or directory\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 6: ./logos/bin/logoscore: No such file or directory\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 8: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 6.2 Async forwarding of the FULL surface through the Rust proxy (start -> read)\n\nThe Rust proxy forwards the whole surface asynchronously too, through the\ngenerated `<method>_async` client wrappers. As with the C++ proxy,\n`probeAsync` fires every method without blocking and `getAsyncProbe` reads\nthe verified tally back as `ALL_OK_ASYNC:<provider>` \u2014 so the full async\npath is exercised through both a C++ AND a Rust consumer, against both\nproviders (2x2 with the sync matrix).\n\n```bash\n./logos/bin/logoscore call test_fullapi_proxy_rust useProvider test_fullapi_cpp\n./logos/bin/logoscore call test_fullapi_proxy_rust probeAsync\nsleep 2\n./logos/bin/logoscore call test_fullapi_proxy_rust getAsyncProbe\n./logos/bin/logoscore call test_fullapi_proxy_rust useProvider test_fullapi_rust\n./logos/bin/logoscore call test_fullapi_proxy_rust probeAsync\nsleep 2\n./logos/bin/logoscore call test_fullapi_proxy_rust getAsyncProbe\n\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call test_fullapi_proxy_rust useProvider test_fullapi_cpp\n./logos/bin/logoscore call test_fullapi_proxy_rust fireStringEvent hi\nsleep 1\n./logos/bin/logoscore call test_fullapi_proxy_rust getLastEvent\n", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 2: ./logos/bin/logoscore: No such file or directory\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 4: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 6.3 Event round-trip through the Rust proxy\n\n```bash\n./logos/bin/logoscore call test_fullapi_proxy_rust useProvider test_fullapi_cpp\n./logos/bin/logoscore call test_fullapi_proxy_rust fireStringEvent hi\nsleep 1\n./logos/bin/logoscore call test_fullapi_proxy_rust getLastEvent\n\n```"}, {"execs": [], "md": "## Step 7: Shut down"}, {"execs": [{"cmd": "./logos/bin/logoscore stop", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 7.1 Stop the daemon\n\n```bash\n./logos/bin/logoscore stop\n```"}]}, {"meta": {"name": "Concurrent Clients Against a Blocking Module Method", "platform": "Darwin (ext=dylib)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Concurrent Clients Against a Blocking Module Method\n\nThis doc-test stress-tests the daemon's request handling with a **blocking**\nmodule method. `test_basic_module` exposes `echoWithDelay(value, delayMs)`,\nwhich sleeps `delayMs` milliseconds on the module's thread before returning \u2014\nso while one call is in flight, the module can do nothing else.\n\nWe start a daemon, load the module, then fire **five independent client\nprocesses at once** (each backgrounded `logoscore call` is its own process \u2014\nthe same as running the command in five separate terminals simultaneously),\nevery one of them invoking the 2-second blocking call. Because the module is\nsingle-threaded, the daemon serializes the five requests: they run one after\nanother, so the wall-clock time is the *sum* of the sleeps (~10s), not the\nlongest single one (~2s).\n\nThe point of the exercise is robustness: many clients piling onto a method\nthat holds the module thread must **serialize cleanly \u2014 no crash, no deadlock,\nno dropped replies** \u2014 and the daemon must stay healthy and responsive\nafterwards.\n\n**What you'll learn:**\n\n- How to load a module that exposes a blocking (synchronous, sleeping) method\n- How to drive one daemon from several concurrent client processes at once\n- That a single-threaded module serializes concurrent calls (total time \u2248 sum of the per-call sleeps), rather than running them in parallel\n- That every concurrent client still receives its correct reply\n- That the daemon survives the burst \u2014 no crash, all modules still loaded, and ordinary calls keep working afterwards\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`"}, {"execs": [], "md": "## Step 1: Build logoscore\n\nBuild the logoscore CLI from the published flake. The result is symlinked to\n`./logos/` for easy reference in the steps below."}, {"execs": [{"cmd": "nix build 'github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560' --out-link ./logos", "exit_code": 1, "kind": "run", "note": "exit code 1", "output": "error:\n       \u2026 while updating the lock file of flake 'github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560?narHash=sha256-j%2BJYGfj9HGAvkA3ZPR41V9TIyCN0zYmszA51%2BtjMYME%3D'\n\n       error: cannot write modified lock file of flake 'github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560' (use '--no-write-lock-file' to ignore)\n", "status": "fail"}], "md": "### 1.1 Build the CLI\n\n```bash\nnix build 'github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560' --out-link ./logos\n```\n\nThe build produces `logos/bin/logoscore` plus bundled runtime libraries and\na `logos/modules/` directory containing the built-in `capability_module`."}, {"execs": [], "md": "## Step 2: Prepare a modules directory\n\nInstall `test_basic_module` from logos-test-modules and copy the bundled\n`capability_module` (required for auth when loading modules) into a single\n`./modules/` directory for the daemon to scan."}, {"execs": [{"cmd": "SYSTEM=$(nix eval --impure --raw --expr 'builtins.currentSystem')\nnix build \"github:logos-co/logos-test-modules#modules.$SYSTEM.test_basic_module.install\" --out-link ./result-module\nmkdir -p modules\ncp -RL ./logos/modules/. ./modules/\ncp -RL ./result-module/modules/. ./modules/\n", "exit_code": 0, "kind": "run", "note": "", "output": "this path will be fetched (0.0 KiB download, 2.6 MiB unpacked):\n  /nix/store/rb1yrqvylr487q991ppyjdc57lxas3pq-logos-test_basic_module-module-lib-install\ncopying path '/nix/store/rb1yrqvylr487q991ppyjdc57lxas3pq-logos-test_basic_module-module-lib-install' from 'https://cache.nix.logos.co/ci'...\ncp: ./logos/modules/.: No such file or directory\n", "status": "pass"}], "md": "### 2.1 Install a module to load\n\nBuild `test_basic_module` and merge it with the bundled capability module\ninto `./modules/`:\n\n```bash\nSYSTEM=$(nix eval --impure --raw --expr 'builtins.currentSystem')\nnix build \"github:logos-co/logos-test-modules#modules.$SYSTEM.test_basic_module.install\" --out-link ./result-module\nmkdir -p modules\ncp -RL ./logos/modules/. ./modules/\ncp -RL ./result-module/modules/. ./modules/\n\n```\n\n`test_basic_module` exposes `echoWithDelay(value, delayMs)` \u2014 it sleeps\n`delayMs` milliseconds on the module thread, then returns `value`. That\nblocking behaviour is exactly what lets us observe serialization."}, {"execs": [], "md": "## Step 3: Start the daemon and load the blocking module\n\nStart the daemon in the background, then load `test_basic_module` and confirm\nits blocking method works for a single call before piling on concurrent ones."}, {"execs": [{"cmd": "sh -c './logos/bin/logoscore -D -m ./modules > logs.txt 2>&1 &'", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 3.1 Start the daemon\n\nStart logoscore in daemon mode in the background, capturing output to\n`logs.txt`:\n\n```bash\nlogoscore -D -m ./modules > logs.txt &\n```"}, {"execs": [{"cmd": "sleep 3", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 3\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore load-module test_basic_module", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 3.2 Load the module\n\nLoad `test_basic_module` into the running daemon:\n\n```bash\nlogoscore load-module test_basic_module\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call test_basic_module echoWithDelay warmup 500", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 3.3 Sanity-check the blocking method\n\nA single call to `echoWithDelay` blocks for the requested time and echoes\nits first argument back. Here we sleep 500 ms and get `warmup` returned:\n\n```bash\nlogoscore call test_basic_module echoWithDelay warmup 500\n```"}, {"execs": [], "md": "## Step 4: Hit the blocking method from five concurrent clients\n\nNow launch **five client processes at once**, each calling the 2-second\nblocking method. Each `( logoscore call \u2026 ) &` is an independent process \u2014\nequivalent to running the command in five separate shells simultaneously.\nWe time the whole burst and capture each client's reply to its own file."}, {"execs": [{"cmd": "START=$(date +%s)\nfor i in 1 2 3 4 5; do\n  ( ./logos/bin/logoscore call test_basic_module echoWithDelay \"client-$i\" 2000 > \"call-$i.out\" 2>&1 ) &\ndone\nwait\nEND=$(date +%s)\nELAPSED=$((END - START))\necho \"All 5 concurrent clients returned. Wall-clock: ${ELAPSED}s\"\nif [ \"$ELAPSED\" -ge 8 ]; then\n  echo \"SERIALIZED: total wall-clock ~= sum of the five 2s sleeps (not run in parallel)\"\nelse\n  echo \"UNEXPECTED: burst finished in ${ELAPSED}s \u2014 calls did not serialize as expected\"\nfi\n", "exit_code": 0, "kind": "run", "note": "expected 'SERIALIZED:' not found in output", "output": "All 5 concurrent clients returned. Wall-clock: 0s\nUNEXPECTED: burst finished in 0s \u2014 calls did not serialize as expected\n", "status": "fail"}], "md": "### 4.1 Fire five concurrent blocking calls\n\nThe five calls are submitted at the same instant. Because the module is\nsingle-threaded, the daemon runs them one at a time, so the total\nwall-clock time is the *sum* of the five 2-second sleeps (~10s) rather\nthan ~2s. We assert it took at least 8 seconds \u2014 proof the calls\nserialized instead of running in parallel \u2014 and that nothing crashed.\n\n```bash\n# Five independent client processes, each a 2-second blocking call.\nfor i in 1 2 3 4 5; do\n  logoscore call test_basic_module echoWithDelay \"client-$i\" 2000 &\ndone\nwait\n```\n\nA single-threaded module can only run one call at a time, so five\nsimultaneous 2-second calls take ~10s end-to-end. If they had run\nconcurrently the burst would have finished in ~2s \u2014 the \u22658s wall-clock\nis the observable signature of clean serialization."}, {"execs": [{"cmd": "cat call-1.out call-2.out call-3.out call-4.out call-5.out", "exit_code": 0, "kind": "run", "note": "expected '\"result\":\"client-1\"' not found in output", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 3: ./logos/bin/logoscore: No such file or directory\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 3: ./logos/bin/logoscore: No such file or directory\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 3: ./logos/bin/logoscore: No such file or directory\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 3: ./logos/bin/logoscore: No such file or directory\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 3: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 4.2 Every client got its own correct reply\n\nDespite contending for the same blocked module thread, each of the five\nclients received exactly its own value back \u2014 no replies were dropped,\ncrossed, or corrupted:\n\n```bash\ncat call-1.out call-2.out call-3.out call-4.out call-5.out\n```"}, {"execs": [], "md": "## Step 5: Confirm the daemon survived the burst\n\nThe whole point is that the concurrent blocking storm causes no crash. Verify\nthe daemon is still running with the module loaded, that nothing crashed, and\nthat ordinary calls keep working."}, {"execs": [{"cmd": "./logos/bin/logoscore status", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 5.1 Daemon and module are still healthy\n\nThe daemon is still `running`, the module still `loaded`, nothing crashed:\n\n```bash\nlogoscore status\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call test_basic_module addInts 40 2", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 5.2 Ordinary calls still work\n\nA normal, non-blocking call succeeds after the storm:\n\n```bash\nlogoscore call test_basic_module addInts 40 2\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore stop", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 5.3 Stop the daemon\n\nShut down the daemon cleanly:\n\n```bash\nlogoscore stop\n```"}, {"execs": [{"cmd": "sleep 2", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 2\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore status || true", "exit_code": 0, "kind": "run", "note": "expected '\"status\":\"not_running\"' not found in output", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 5.4 Confirm the daemon has stopped\n\nA final `status` confirms the shutdown \u2014 with no daemon running the client\nreports `not_running` (and exits non-zero, so we add `|| true` to let the\ndoc-test assert on the output):\n\n```bash\nlogoscore status\n```"}]}, {"meta": {"name": "Running Modules with the logoscore Daemon", "platform": "Darwin (ext=dylib)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Running Modules with the logoscore Daemon\n\nThis doc-test walks through the **daemon mode** of `logoscore`: start a long-running\nprocess, inspect its status, load a module, introspect and call it, watch its\nresource usage, unload and reload it, and finally shut the daemon down \u2014 verifying\nat each stage that the command had the effect we expect.\n\n`logoscore` is the headless CLI frontend for the Logos platform. In daemon mode\n(`-D`), it runs in the background and exposes client subcommands (`status`,\n`list-modules`, `load-module`, `module-info`, `stats`, `call`, `unload-module`,\n`reload-module`, `stop`, \u2026) that connect over a local RPC channel.\n\n**What you'll learn:**\n\n- How to build and run the logoscore CLI\n- How to prepare a modules directory for the daemon to scan\n- How to start the daemon in the background and capture its logs\n- How to inspect the daemon and the modules it has discovered\n- How to load a module, introspect it with `module-info`, and call its methods\n- How to read per-module resource usage with `stats`\n- How `status` reflects the module lifecycle as you load, unload, and reload\n- How to stop the daemon and confirm it has actually exited\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`"}, {"execs": [], "md": "## Step 1: Build logoscore\n\nBuild the logoscore CLI from the published flake. The result is symlinked to\n`./logos/` for easy reference in the steps below."}, {"execs": [{"cmd": "nix build 'github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560' --out-link ./logos", "exit_code": 1, "kind": "run", "note": "exit code 1", "output": "error:\n       \u2026 while updating the lock file of flake 'github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560?narHash=sha256-j%2BJYGfj9HGAvkA3ZPR41V9TIyCN0zYmszA51%2BtjMYME%3D'\n\n       error: cannot write modified lock file of flake 'github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560' (use '--no-write-lock-file' to ignore)\n", "status": "fail"}], "md": "### 1.1 Build the CLI\n\n```bash\nnix build 'github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560' --out-link ./logos\n```\n\nThe build produces `logos/bin/logoscore` plus bundled runtime libraries and\na `logos/modules/` directory containing the built-in `capability_module`."}, {"execs": [], "md": "## Step 2: Prepare a modules directory\n\n`logoscore -m ./modules` scans `./modules/` for subdirectories containing\n`manifest.json`. We install `test_basic_module` from logos-test-modules and\ncopy the bundled `capability_module` (required for auth when loading modules)."}, {"execs": [{"cmd": "SYSTEM=$(nix eval --impure --raw --expr 'builtins.currentSystem')\nnix build \"github:logos-co/logos-test-modules#modules.$SYSTEM.test_basic_module.install\" --out-link ./result-module\nmkdir -p modules\ncp -RL ./logos/modules/. ./modules/\ncp -RL ./result-module/modules/. ./modules/\n", "exit_code": 0, "kind": "run", "note": "", "output": "cp: ./logos/modules/.: No such file or directory\n", "status": "pass"}], "md": "### 2.1 Install a module to load\n\nBuild `test_basic_module` and merge it with the bundled capability module\ninto `./modules/`:\n\n```bash\nSYSTEM=$(nix eval --impure --raw --expr 'builtins.currentSystem')\nnix build \"github:logos-co/logos-test-modules#modules.$SYSTEM.test_basic_module.install\" --out-link ./result-module\nmkdir -p modules\ncp -RL ./logos/modules/. ./modules/\ncp -RL ./result-module/modules/. ./modules/\n\n```\n\nThe modules directory now contains:\n\n```\nmodules/\n\u251c\u2500\u2500 capability_module/\n\u2502   \u251c\u2500\u2500 manifest.json\n\u2502   \u2514\u2500\u2500 capability_module_plugin.{so,dylib}\n\u2514\u2500\u2500 test_basic_module/\n    \u251c\u2500\u2500 manifest.json\n    \u2514\u2500\u2500 test_basic_module_plugin.{so,dylib}\n```"}, {"execs": [], "md": "## Step 3: Run the daemon and call a module\n\nStart the daemon in the background, then use client subcommands to interact\nwith it. Output from the daemon process is captured in `logs.txt`."}, {"execs": [{"cmd": "sh -c './logos/bin/logoscore -D -m ./modules > logs.txt 2>&1 &'", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 3.1 Start the daemon\n\nStart logoscore in daemon mode in the background, capturing output to\n`logs.txt`:\n\n```bash\nlogoscore -D -m ./modules > logs.txt &\n```\n\nThe `-D` flag starts the daemon. The client subcommands in the following\nsteps connect to this running process via the config written under\n`~/.logoscore/`."}, {"execs": [{"cmd": "sleep 3", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 3\n```"}, {"execs": [{"cmd": "cat logs.txt", "exit_code": 0, "kind": "run", "note": "", "output": "sh: ./logos/bin/logoscore: No such file or directory\n", "status": "pass"}], "md": "### 3.2 Inspect the startup log\n\nReview the daemon's startup output:\n\n```bash\ncat logs.txt\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore status --human\necho '# --- JSON ---'\n./logos/bin/logoscore status --json\n", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n# --- JSON ---\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 3: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 3.3 Check daemon status\n\nVerify the daemon is running and inspect its health. Every client\ncommand renders a human-readable form on a terminal and JSON when its\noutput is piped; `--human` and `--json` force either form explicitly:\n\n```bash\nlogoscore status            # human-readable (default on a TTY)\nlogoscore status --json     # JSON (default when piped)\n```\n\nHuman-readable form:\n\n```text\nLogoscore Daemon\n  Status:       running\n  PID:          12345\n  Uptime:       6s\n  Version:      v0.2.0\n\nModules: 1 loaded, 0 crashed, 1 not loaded\n  test_basic_module  v1.0.0  not_loaded  -\n  capability_module  v1.0.0  loaded      6s\n```\n\nJSON form:\n\n```json\n{\"daemon\":{\"status\":\"running\",\"pid\":12345,\"uptime_seconds\":6,\"version\":\"0.2.0\"},\n \"modules_summary\":{\"loaded\":1,\"crashed\":0,\"not_loaded\":1},\n \"modules\":[{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":6,\"version\":\"1.0.0\"},\n            {\"name\":\"test_basic_module\",\"status\":\"not_loaded\",\"version\":\"1.0.0\"}]}\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore list-modules --human\necho '# --- JSON ---'\n./logos/bin/logoscore list-modules --json\n", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n# --- JSON ---\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 3: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 3.4 List discovered modules\n\nList modules visible in the scan directory, in both forms:\n\n```bash\nlogoscore list-modules            # human-readable table\nlogoscore list-modules --json     # JSON\n```\n\nHuman-readable table (the `NAME`/`VERSION` columns size to fit):\n\n```text\nNAME               VERSION  STATUS      UPTIME\ntest_basic_module  v1.0.0   not_loaded  -\ncapability_module  v1.0.0   loaded      6s\n```\n\nThe same data as JSON \u2014 `version` is present even for `not_loaded`\nmodules (it comes from each module's metadata, not the running process):\n\n```json\n[{\"name\":\"test_basic_module\",\"status\":\"not_loaded\",\"version\":\"1.0.0\"},\n {\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":6,\"version\":\"1.0.0\"}]\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore load-module test_basic_module", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 3.5 Load the module\n\nLoad `test_basic_module` into the running daemon:\n\n```bash\nlogoscore load-module test_basic_module\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore status --human\necho '# --- JSON ---'\n./logos/bin/logoscore status --json\n", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n# --- JSON ---\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 3: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 3.6 Confirm the module is now loaded\n\nRe-run `status`. The module that was `not_loaded` before now reports\n`loaded`, and once loaded it carries an uptime (shown in both forms):\n\n```bash\nlogoscore status\nlogoscore status --json\n```"}, {"execs": [{"cmd": "dpid=$(./logos/bin/logoscore status --json | python3 -c \"import json,sys;print(json.load(sys.stdin)['daemon']['pid'])\")\ndpgid=$(ps -o pgid= -p \"$dpid\" | tr -d ' ')\nresult=NO_MODULE_SUBPROCESS\nfor hp in $(pgrep -f logos_host); do\n  [ \"$(ps -o ppid= -p \"$hp\" | tr -d ' ')\" = \"$dpid\" ] || continue\n  hpgid=$(ps -o pgid= -p \"$hp\" | tr -d ' ')\n  if [ \"$hp\" = \"$hpgid\" ] && [ \"$hpgid\" != \"$dpgid\" ]; then\n    result=MODULE_SUBPROCESS_ISOLATED; break\n  else\n    result=MODULE_SUBPROCESS_SHARES_LAUNCHER_GROUP\n  fi\ndone\necho \"daemon_pid=$dpid daemon_pgid=$dpgid -> $result\"\n", "exit_code": 0, "kind": "run", "note": "expected 'MODULE_SUBPROCESS_ISOLATED' not found in output", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\nTraceback (most recent call last):\n  File \"<string>\", line 1, in <module>\n    import json,sys;print(json.load(sys.stdin)['daemon']['pid'])\n                          ~~~~~~~~~^^^^^^^^^^^\n  File \"/opt/homebrew/Cellar/python@3.14/3.14.7/Frameworks/Python.framework/Versions/3.14/lib/python3.14/json/__init__.py\", line 298, in load\n    return loads(fp.read(),\n        cls=cls, object_hook=object_hook,\n        parse_float=parse_float, parse_int=parse_int,\n        parse_constant=parse_constant, object_pairs_hook=object_pairs_hook, **kw)\n  File \"/opt/homebrew/Cellar/python@3.14/3.14.7/Frameworks/Python.framework/Versions/3.14/lib/python3.14/json/__init__.py\", line 352, in loads\n    return _default_decoder.decode(s)\n           ~~~~~~~~~~~~~~~~~~~~~~~^^^\n  File \"/opt/homebrew/Cellar/python@3.14/3.14.7/Frameworks/Python.framework/Versions/3.14/lib/python3.14/json/decoder.py\", line 345, in decode\n    obj, end = self.raw_decode(s, idx=_w(s, 0).end())\n               ~~~~~~~~~~~~~~~^^^^^^^^^^^^^^^^^^^^^^^\n  File \"/opt/homebrew/Cellar/python@3.14/3.14.7/Frameworks/Python.framework/Versions/3.14/lib/python3.14/json/decoder.py\", line 363, in raw_decode\n    raise JSONDecodeError(\"Expecting value\", s, err.value) from None\njson.decoder.JSONDecodeError: Expecting value: line 1 column 1 (char 0)\nps: Invalid process id: 8Wto\\001\ndaemon_pid= daemon_pgid= -> NO_MODULE_SUBPROCESS\n", "status": "fail"}], "md": "### 3.7 Module subprocesses are isolated from the launcher's process group\n\nWith a module loaded, the daemon is running it in its own subprocess\n(`logos_host`). The daemon itself stays in the **foreground**, in its\nlauncher's process group, so a shell, `systemd`, or Docker manages it\nnormally \u2014 but each `logos_host` must lead its **own** process group, not\nstay in the daemon's (i.e. the launcher's). Otherwise tearing the module\ntree down on shutdown, or any process-group signal aimed at the daemon,\nleaks into the launcher and can kill the shell driving it (a teardown\nstep dying with exit `-15` on Linux).\n\nWe take a module subprocess (a `logos_host` child of the daemon) and\nassert it is its **own** process-group leader (`pgid == pid`) and is\n**not** in the daemon's group.\n\n```bash\n# a module subprocess must lead its own group: pgid == pid, != daemon\ndpid=$(logoscore status --json | jq .daemon.pid)\nhost=$(pgrep -P \"$dpid\" -f logos_host | head -1)\n[ \"$host\" = \"$(ps -o pgid= -p \"$host\" | tr -d ' ')\" ] && echo ISOLATED\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore module-info test_basic_module --human\necho '# --- JSON ---'\n./logos/bin/logoscore module-info test_basic_module --json\n", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n# --- JSON ---\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 3: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 3.8 Inspect the module with module-info\n\n`module-info` shows a single module's status and the `Q_INVOKABLE`\nmethods it exposes \u2014 the same methods you can `call`:\n\n```bash\nlogoscore module-info test_basic_module\nlogoscore module-info test_basic_module --json\n```\n\nHuman-readable form (methods list trimmed):\n\n```text\nName:          test_basic_module\nVersion:       v1.0.0\nStatus:        loaded\nUptime:        6s\n\nMethods:\n  returnTrue() -> bool\n  addInts(a: int, b: int) -> int\n  ...\n```\n\nJSON form \u2014 version, dependencies, dependents, uptime, and the full\nmethod/event interface in one object:\n\n```json\n{\"name\":\"test_basic_module\",\"version\":\"1.0.0\",\"status\":\"loaded\",\n \"uptime_seconds\":6,\"dependencies\":[],\"dependents\":[],\n \"methods\":[{\"name\":\"returnTrue\",\"returnType\":\"bool\",\"signature\":\"returnTrue()\"}, ...],\n \"events\":[]}\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore stats --human\necho '# --- JSON ---'\n./logos/bin/logoscore stats --json\n", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n# --- JSON ---\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 3: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 3.9 Check resource usage with stats\n\n`stats` reports per-module resource usage (process id, CPU, memory) for\nthe modules the daemon is running:\n\n```bash\nlogoscore stats\nlogoscore stats --json\n```\n\nHuman-readable table:\n\n```text\nMODULE             PID     CPU%    MEMORY\ntest_basic_module  12350   0.0%    18.9 MB\ncapability_module  12340   4.6%    19.5 MB\n```\n\nJSON form:\n\n```json\n[{\"name\":\"test_basic_module\",\"cpu_percent\":0.0,\"cpu_time_seconds\":1.02,\"memory_mb\":18.9},\n {\"name\":\"capability_module\",\"cpu_percent\":4.6,\"cpu_time_seconds\":1.10,\"memory_mb\":19.5}]\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call test_basic_module returnTrue --human\necho '# --- JSON ---'\n./logos/bin/logoscore call test_basic_module returnTrue --json\n", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n# --- JSON ---\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 3: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 3.10 Call methods\n\nInvoke methods on the loaded module, in both forms:\n\n```bash\nlogoscore call test_basic_module returnTrue\nlogoscore call test_basic_module returnTrue --json\n```\n\nThe human-readable form prints just the return value:\n\n```text\ntrue\n```\n\nThe JSON form wraps it with the call's metadata:\n\n```json\n{\"status\":\"ok\",\"module\":\"test_basic_module\",\"method\":\"returnTrue\",\"result\":true}\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call test_basic_module addInts 2 3", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "```bash\nlogoscore call test_basic_module addInts 2 3\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call test_basic_module echo hello", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "```bash\nlogoscore call test_basic_module echo hello\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call test_basic_module returnString", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "```bash\nlogoscore call test_basic_module returnString\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore unload-module test_basic_module", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 3.11 Unload the module\n\nRemove `test_basic_module` from the daemon:\n\n```bash\nlogoscore unload-module test_basic_module\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call test_basic_module returnTrue || true", "exit_code": 0, "kind": "run", "note": "expected 'error' not found in output", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 3.12 Confirm the unload took effect\n\nA `call` against the now-unloaded module is rejected \u2014 the daemon reports\nthat it is not loaded:\n\n```bash\nlogoscore call test_basic_module returnTrue\n```\n\n> The trailing `|| true` lets the doc-test continue past the expected\n> non-zero exit code so we can assert on the error message."}, {"execs": [{"cmd": "./logos/bin/logoscore reload-module test_basic_module", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 3.13 Reload the module\n\n`reload-module` unloads and re-loads a module in one step (handy after\nrebuilding it). The module is loaded and callable again afterwards:\n\n```bash\nlogoscore reload-module test_basic_module\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call test_basic_module addInts 40 2", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "```bash\nlogoscore call test_basic_module addInts 40 2\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore stop", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 3.14 Stop the daemon\n\nShut down the daemon cleanly:\n\n```bash\nlogoscore stop\n```\n\nThe daemon removes its state file and exits. You can also stop it with\n`Ctrl+C` if running in the foreground, or by sending `SIGTERM` to the\ndaemon PID shown in `logoscore status`."}, {"execs": [{"cmd": "sleep 2", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 2\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore status || true", "exit_code": 0, "kind": "run", "note": "expected '\"status\":\"not_running\"' not found in output", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 3.15 Confirm the daemon has stopped\n\nA final `status` confirms the shutdown. With no daemon running, the\nclient reports `not_running` instead of connecting (and exits non-zero,\nso we add `|| true` to let the doc-test assert on the output):\n\n```bash\nlogoscore status\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore -D --config-dir ./crashcfg -m ./modules > crash.log 2>&1 &\nsleep 5\ndpid=$(./logos/bin/logoscore --config-dir ./crashcfg status --json | python3 -c \"import json,sys;print(json.load(sys.stdin)['daemon']['pid'])\")\nworker=\"\"\nfor h in $(pgrep -f logos_host); do\n  [ \"$(ps -o ppid= -p \"$h\" | tr -d ' ')\" = \"$dpid\" ] && { worker=\"$h\"; break; }\ndone\necho \"daemon=$dpid worker=$worker\"\nkill -9 \"$dpid\"\nresult=LEAKED\nfor i in $(seq 1 10); do\n  kill -0 \"$worker\" 2>/dev/null || { result=WORKER_CLEANED_UP; break; }\n  sleep 1\ndone\necho \"RESULT=$result\"\n", "exit_code": 0, "kind": "run", "note": "expected 'WORKER_CLEANED_UP' not found in output", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 3: ./logos/bin/logoscore: No such file or directory\nTraceback (most recent call last):\n  File \"<string>\", line 1, in <module>\n    import json,sys;print(json.load(sys.stdin)['daemon']['pid'])\n                          ~~~~~~~~~^^^^^^^^^^^\n  File \"/opt/homebrew/Cellar/python@3.14/3.14.7/Frameworks/Python.framework/Versions/3.14/lib/python3.14/json/__init__.py\", line 298, in load\n    return loads(fp.read(),\n        cls=cls, object_hook=object_hook,\n        parse_float=parse_float, parse_int=parse_int,\n        parse_constant=parse_constant, object_pairs_hook=object_pairs_hook, **kw)\n  File \"/opt/homebrew/Cellar/python@3.14/3.14.7/Frameworks/Python.framework/Versions/3.14/lib/python3.14/json/__init__.py\", line 352, in loads\n    return _default_decoder.decode(s)\n           ~~~~~~~~~~~~~~~~~~~~~~~^^^\n  File \"/opt/homebrew/Cellar/python@3.14/3.14.7/Frameworks/Python.framework/Versions/3.14/lib/python3.14/json/decoder.py\", line 345, in decode\n    obj, end = self.raw_decode(s, idx=_w(s, 0).end())\n               ~~~~~~~~~~~~~~~^^^^^^^^^^^^^^^^^^^^^^^\n  File \"/opt/homebrew/Cellar/python@3.14/3.14.7/Frameworks/Python.framework/Versions/3.14/lib/python3.14/json/decoder.py\", line 363, in raw_decode\n    raise JSONDecodeError(\"Expecting value\", s, err.value) from None\njson.decoder.JSONDecodeError: Expecting value: line 1 column 1 (char 0)\ndaemon= worker=\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 9: kill: `': not a pid or valid job spec\nRESULT=LEAKED\n", "status": "fail"}], "md": "### 3.16 A worker is not orphaned if the daemon crashes\n\nThe flip side of detaching workers into their own process group: a\nmodule subprocess must not be left **running** if the daemon dies\n*without* cleaning it up. We start a throwaway daemon, **hard-kill** it\n(`SIGKILL`, so no graceful teardown runs), and confirm its module\nsubprocess exits on its own \u2014 via `PR_SET_PDEATHSIG` on Linux and a\n`getppid` watchdog on other platforms. (Graceful shutdown, above, still\nreaps workers per-PID; this covers the crash path.)\n\n```bash\n# hard-kill the daemon; its module subprocess must exit on its own\nlogoscore -D -m ./modules &      # (throwaway)\nkill -9 \"$(logoscore status --json | jq .daemon.pid)\"\n```"}]}, {"meta": {"name": "Running logoscore as a System Service, Shared with an OS Group (Linux)", "platform": "Darwin (ext=dylib)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Running logoscore as a System Service, Shared with an OS Group (Linux)\n\nEverything else in this doc-test suite runs the daemon as *you*, in your own\n`~/.logoscore`. A real deployment usually doesn't look like that: the node is\na **systemd service running as its own unprivileged user**, and the humans who\ndrive it log in as themselves. That arrangement has three moving parts that\nhave to line up, and if any one of them is wrong the symptom is the same \u2014\n`logoscore status` reports the daemon, and every other command fails.\n\n1. **The Unix sockets must be connectable by the other user.** `bind()`\n   creates them `0755`, and connecting to an `AF_UNIX` socket requires\n   **write** permission on the socket file, so by default nobody but the\n   service user can reach a module.\n2. **The client artifacts must be readable by the other user.** A client\n   discovers the daemon through `client/config.json`, which the daemon\n   rewrites on every boot (the instance id changes each time).\n3. **The credential must be one the daemon accepts.**\n\n`--access-group <group>` lines all three up at once: the daemon binds its\nsockets `0660` and chgrps them to that group, and writes its client artifacts\n`0640` in a `0750` directory owned by it. Any member of the group can then\ndrive the node \u2014 the same model as `docker.sock`.\n\n> \u26a0\ufe0f **The group is the trust boundary.** Everyone in it can read the daemon's\n> own token and has full control of the node. Operator-issued tokens\n> (`issue-token`) add per-user *accounting*, *expiry* and *revocation* within\n> that group; they are not isolation from it. Put only trusted operators in\n> the group.\n\n> This walkthrough needs Linux, systemd and passwordless `sudo`, so every step\n> below **skips itself** on macOS and anywhere those are missing. On such a\n> host you will see `SKIP:` lines instead of output \u2014 that is the spec\n> reporting honestly, not a silent pass of the real assertions.\n\n**What you'll learn:**\n\n- Why a second user can run `status` but nothing else, and which of the three causes is biting you\n- How to write a systemd unit for `logoscore` that runs as its own service user\n- What `--access-group` changes about socket permissions and client-artifact permissions\n- Why `PrivateTmp=yes` breaks a shared node no matter how the permissions are set\n- How a group member drives the node with no configuration of their own\n- How to issue a per-user token, use it, and revoke it while the node keeps running\n- That a non-member is refused, at both the file layer and the socket layer\n- That stopping the service leaves no socket files behind\n\n## Prerequisites\n\n- **Linux with systemd**, and passwordless `sudo`. The steps create OS users\nand install a unit file, so they cannot run unprivileged. Every step\nself-skips where these are unavailable.\n\nVerify: `test -d /run/systemd/system && sudo -n true && echo \"ready\"`\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`"}, {"execs": [], "md": "## Step 1: Build the node and stage it where a service can reach it\n\nA systemd unit runs with a minimal environment and no access to your\nworking directory, so the binary and the modules both have to live\nsomewhere the service user can read. Nix store paths are world-readable,\nwhich makes them a natural `ExecStart=`; the modules we copy to\n`/var/lib/logos-node/modules`."}, {"execs": [{"cmd": "{ [ \"$(uname -s)\" = Linux ] && [ -d /run/systemd/system ] && sudo -n true 2>/dev/null; } || { echo \"SKIP: needs Linux + systemd + passwordless sudo\"; exit 0; }\nnix build 'github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560' --out-link ./logos\nreadlink -f ./logos/bin/logoscore > ./ls-path\ntest -x \"$(cat ./ls-path)\" || { echo \"logoscore not executable\"; exit 1; }\necho \"logoscore: $(cat ./ls-path)\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "SKIP: needs Linux + systemd + passwordless sudo\n", "status": "pass"}], "md": "### 1.1 Build the CLI\n\nBuild `logoscore` and record its resolved store path \u2014 the unit file\nneeds an absolute path, because `sudo`'s `secure_path` drops Nix from\n`PATH`.\n\n```bash\nnix build 'github:logos-co/logos-logoscore-cli' --out-link ./logos\nreadlink -f ./logos/bin/logoscore    # absolute path for ExecStart=\n```"}, {"execs": [{"cmd": "{ [ \"$(uname -s)\" = Linux ] && [ -d /run/systemd/system ] && sudo -n true 2>/dev/null; } || { echo \"SKIP: needs Linux + systemd + passwordless sudo\"; exit 0; }\nSYSTEM=$(nix eval --impure --raw --expr 'builtins.currentSystem')\nnix build \"github:logos-co/logos-test-modules#modules.$SYSTEM.test_basic_module.install\" --out-link ./result-module\nmkdir -p modules\nchmod -R u+w ./modules 2>/dev/null || true\ncp -RL ./logos/modules/. ./modules/\nchmod -R u+w ./modules 2>/dev/null || true\ncp -RL ./result-module/modules/. ./modules/\ntest -f modules/test_basic_module/manifest.json || { echo \"module staging failed\"; exit 1; }\nls modules\n", "exit_code": 0, "kind": "run", "note": "", "output": "SKIP: needs Linux + systemd + passwordless sudo\n", "status": "pass"}], "md": "### 1.2 Assemble the modules directory\n\nThe daemon needs the bundled `capability_module` (it brokers the\nclient handshake) plus something to call \u2014 `test_basic_module`.\n\n```bash\nnix build \"github:logos-co/logos-test-modules#modules.$SYSTEM.test_basic_module.install\" \\\n    --out-link ./result-module\nmkdir -p modules\ncp -RL ./logos/modules/. ./modules/\ncp -RL ./result-module/modules/. ./modules/\n```"}, {"execs": [], "md": "## Step 2: Create the service user, the shared group, and two humans\n\nFour identities make the point:\n\n| identity | role |\n|---|---|\n| group `logos` | the shared-access group |\n| user `logos` | the unprivileged account the service runs as |\n| user `alice` | an operator, **in** the group |\n| user `mallory` | another account, **not** in the group |\n\n`alice` and `mallory` differ in exactly one respect \u2014 group membership \u2014\nso anything that works for one and not the other is attributable to it."}, {"execs": [{"cmd": "{ [ \"$(uname -s)\" = Linux ] && [ -d /run/systemd/system ] && sudo -n true 2>/dev/null; } || { echo \"SKIP: needs Linux + systemd + passwordless sudo\"; exit 0; }\nsudo groupadd -f logos\nid -u logos   >/dev/null 2>&1 || sudo useradd --system --gid logos --home-dir /var/lib/logos-node --shell /usr/sbin/nologin logos\nid -u alice   >/dev/null 2>&1 || sudo useradd -m -G logos alice\nid -u mallory >/dev/null 2>&1 || sudo useradd -m mallory\nsudo usermod -aG logos alice\n\n# The node's state directory. 0750 root-of-the-group: the service user\n# owns it, group members may traverse and read, everyone else cannot.\nsudo install -d -o logos -g logos -m 0750 /var/lib/logos-node\nsudo rm -rf /var/lib/logos-node/modules\nsudo cp -RL ./modules /var/lib/logos-node/modules\nsudo chown -R logos:logos /var/lib/logos-node/modules\nsudo chmod -R a+rX /var/lib/logos-node/modules\n\n# Assert the two humans differ only in group membership.\nif ! id -nG alice | tr ' ' '\\n' | grep -qx logos; then echo \"alice must be in group logos\"; exit 1; fi\nif id -nG mallory | tr ' ' '\\n' | grep -qx logos; then echo \"mallory must NOT be in group logos\"; exit 1; fi\necho \"alice groups:   $(id -nG alice)\"\necho \"mallory groups: $(id -nG mallory)\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "SKIP: needs Linux + systemd + passwordless sudo\n", "status": "pass"}], "md": "### 2.1 Create identities and the node directory\n\n```bash\nsudo groupadd -f logos\nsudo useradd --system --gid logos --home-dir /var/lib/logos-node \\\n             --shell /usr/sbin/nologin logos\nsudo useradd -m -G logos alice      # operator, in the group\nsudo useradd -m mallory             # not in the group\n\nsudo install -d -o logos -g logos -m 0750 /var/lib/logos-node\nsudo cp -RL ./modules /var/lib/logos-node/modules\n```"}, {"execs": [], "md": "## Step 3: Install and start the systemd unit\n\nThe unit runs the daemon as `logos:logos` with an explicit `--config-dir`\nso its state lives under `/var/lib/logos-node` rather than a home\ndirectory, and `--access-group logos` to make the sockets and client\nartifacts group-accessible.\n\nOne setting deserves a warning of its own: **`PrivateTmp=yes` silently\nbreaks a shared node.** It gives the service its own `/tmp` namespace, so\nthe module sockets are created somewhere no other user can even *see* \u2014\nclients outside the unit get `ENOENT`, and no permission change can repair\nit. Leave it off, or relocate the sockets deliberately by setting `TMPDIR`\nfor both the service and its clients."}, {"execs": [{"cmd": "{ [ \"$(uname -s)\" = Linux ] && [ -d /run/systemd/system ] && sudo -n true 2>/dev/null; } || { echo \"SKIP: needs Linux + systemd + passwordless sudo\"; exit 0; }\nLS=$(cat ./ls-path)\nsudo tee /etc/systemd/system/logos-node.service >/dev/null <<UNIT\n[Unit]\nDescription=Logos node (logoscore)\nAfter=network.target\n\n[Service]\nType=simple\nUser=logos\nGroup=logos\nExecStart=$LS daemon --config-dir /var/lib/logos-node/.logoscore -m /var/lib/logos-node/modules --access-group logos\nRestart=no\n# PrivateTmp=yes would hide the module sockets from every other user.\nPrivateTmp=no\n\n[Install]\nWantedBy=multi-user.target\nUNIT\nsudo systemctl daemon-reload\nsudo systemctl start logos-node.service\necho \"unit started\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "SKIP: needs Linux + systemd + passwordless sudo\n", "status": "pass"}], "md": "### 3.1 Write the unit and start it\n\n```bash\nsudo tee /etc/systemd/system/logos-node.service <<'UNIT'\n[Unit]\nDescription=Logos node (logoscore)\nAfter=network.target\n\n[Service]\nType=simple\nUser=logos\nGroup=logos\nExecStart=/nix/store/.../bin/logoscore daemon \\\n    --config-dir /var/lib/logos-node/.logoscore \\\n    -m /var/lib/logos-node/modules \\\n    --access-group logos\nRestart=no\nPrivateTmp=no\n\n[Install]\nWantedBy=multi-user.target\nUNIT\nsudo systemctl daemon-reload\nsudo systemctl start logos-node.service\n```"}, {"execs": [{"cmd": "{ [ \"$(uname -s)\" = Linux ] && [ -d /run/systemd/system ] && sudo -n true 2>/dev/null; } || { echo \"SKIP: needs Linux + systemd + passwordless sudo\"; exit 0; }\nLS=$(cat ./ls-path)\nok=\"\"\nfor i in $(seq 1 90); do\n  if sudo -u logos env HOME=/var/lib/logos-node \"$LS\" --config-dir /var/lib/logos-node/.logoscore status --json 2>/dev/null | grep -q '\"status\":\"running\"'; then\n    ok=1; break\n  fi\n  sleep 1\ndone\nif [ -z \"$ok\" ]; then\n  echo \"--- systemctl status ---\"; sudo systemctl status logos-node.service --no-pager -l || true\n  echo \"--- journal ---\";          sudo journalctl -u logos-node.service --no-pager -n 120 || true\n  echo \"daemon never became ready\"; exit 1\nfi\necho \"node is running\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "SKIP: needs Linux + systemd + passwordless sudo\n", "status": "pass"}], "md": "### 3.2 Wait for the node to answer\n\nPoll as the service user until `core_service` responds. If it never\ndoes, the journal is dumped so the failure is diagnosable rather than\njust a timeout.\n\n```bash\nsudo -u logos logoscore --config-dir /var/lib/logos-node/.logoscore status\n```"}, {"execs": [{"cmd": "{ [ \"$(uname -s)\" = Linux ] && [ -d /run/systemd/system ] && sudo -n true 2>/dev/null; } || { echo \"SKIP: needs Linux + systemd + passwordless sudo\"; exit 0; }\nINST=$(sudo cat /var/lib/logos-node/.logoscore/daemon/state.json | python3 -c 'import json,sys;print(json.load(sys.stdin)[\"instance_id\"])')\necho \"$INST\" > ./instance-id\necho \"instance: $INST\"\necho \"--- module sockets ---\"\nls -l /tmp/logos_*\"$INST\"*\nSOCK=$(ls /tmp/logos_core_service_\"$INST\" 2>/dev/null | head -1)\nif [ -z \"$SOCK\" ]; then echo \"core_service socket not found\"; exit 1; fi\nMODE_OWNER=$(stat -c '%A %U %G' \"$SOCK\")\necho \"core_service socket: $MODE_OWNER\"\ncase \"$MODE_OWNER\" in\n  srw-rw----*\" logos\") : ;;\n  *) echo \"expected a 0660 socket owned by group logos, got: $MODE_OWNER\"; exit 1 ;;\nesac\necho \"--- client artifacts ---\"\nsudo ls -l /var/lib/logos-node/.logoscore/client/\n", "exit_code": 0, "kind": "run", "note": "", "output": "SKIP: needs Linux + systemd + passwordless sudo\n", "status": "pass"}], "md": "### 3.3 Inspect what --access-group actually changed\n\nTwo things, both visible on disk. The module sockets are now `0660`\nand owned by the group \u2014 `rw` for the group is precisely what an\n`AF_UNIX` `connect()` needs. And the client artifacts are group\nreadable, so a member can discover the daemon without copying\nanything.\n\n```bash\nls -l /tmp/logos_*\n# srw-rw---- logos logos  logos_core_service_<instance>\n#    ^^ group write == connectable by the group\n```"}, {"execs": [], "md": "## Step 4: Drive the node from another user account\n\nThis is the part that fails without `--access-group`. `alice` has no\nconfiguration of her own: she points `LOGOSCORE_CONFIG_DIR` at the\ndaemon's directory and everything resolves from there \u2014 the dial spec,\nthe instance id, and the credential. Nothing needs re-copying when the\nnode restarts, because she is reading the daemon's live files rather than\na stale snapshot of them."}, {"execs": [{"cmd": "{ [ \"$(uname -s)\" = Linux ] && [ -d /run/systemd/system ] && sudo -n true 2>/dev/null; } || { echo \"SKIP: needs Linux + systemd + passwordless sudo\"; exit 0; }\nLS=$(cat ./ls-path)\nCFG=/var/lib/logos-node/.logoscore\n# cd somewhere alice can traverse: the doc-test working directory is\n# created 0700 by mkdtemp, so sudo would warn about an inaccessible cwd.\ncd /tmp\n\nOUT=$(sudo -u alice env HOME=/home/alice LOGOSCORE_CONFIG_DIR=$CFG \"$LS\" status --json)\necho \"status:  $OUT\"\ncase \"$OUT\" in *'\"status\":\"running\"'*) : ;; *) echo \"alice could not reach the node\"; exit 1 ;; esac\n\nOUT=$(sudo -u alice env HOME=/home/alice LOGOSCORE_CONFIG_DIR=$CFG \"$LS\" load-module test_basic_module --json)\necho \"load:    $OUT\"\ncase \"$OUT\" in *'\"status\":\"ok\"'*) : ;; *) echo \"alice could not load a module\"; exit 1 ;; esac\n\nOUT=$(sudo -u alice env HOME=/home/alice LOGOSCORE_CONFIG_DIR=$CFG \"$LS\" call test_basic_module addInts 2 3 --json)\necho \"call:    $OUT\"\ncase \"$OUT\" in *'\"result\":5'*) : ;; *) echo \"alice could not call a method\"; exit 1 ;; esac\necho \"alice drove the node end-to-end\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "SKIP: needs Linux + systemd + passwordless sudo\n", "status": "pass"}], "md": "### 4.1 alice: status, load, call\n\n```bash\nexport LOGOSCORE_CONFIG_DIR=/var/lib/logos-node/.logoscore\nlogoscore status\nlogoscore load-module test_basic_module\nlogoscore call test_basic_module addInts 2 3\n```"}, {"execs": [], "md": "## Step 5: Give alice a token of her own\n\nReading the daemon's directory means alice is using the node's own boot\ncredential. An operator-issued token replaces that with something\nattributable: it is recorded under a name, it can carry an expiry, and it\ncan be revoked while the node keeps running \u2014 no restart, no disruption to\nanyone else.\n\nShe presents it with `LOGOSCORE_TOKEN`, which overrides whatever the\nconfig directory would have supplied."}, {"execs": [{"cmd": "{ [ \"$(uname -s)\" = Linux ] && [ -d /run/systemd/system ] && sudo -n true 2>/dev/null; } || { echo \"SKIP: needs Linux + systemd + passwordless sudo\"; exit 0; }\nLS=$(cat ./ls-path)\nCFG=/var/lib/logos-node/.logoscore\ncd /tmp\n\nISSUED=$(sudo -u logos env HOME=/var/lib/logos-node \"$LS\" --config-dir $CFG issue-token --name alice --json)\necho \"issued:  $ISSUED\"\nTOK=$(printf '%s' \"$ISSUED\" | python3 -c 'import json,sys;print(json.load(sys.stdin)[\"token\"])')\nif [ -z \"$TOK\" ]; then echo \"no token issued\"; exit 1; fi\n\nOUT=$(sudo -u alice env HOME=/home/alice LOGOSCORE_CONFIG_DIR=$CFG LOGOSCORE_TOKEN=\"$TOK\" \"$LS\" list-modules --json)\necho \"with her token: $OUT\"\ncase \"$OUT\" in *test_basic_module*) : ;; *) echo \"alice's own token was not accepted\"; exit 1 ;; esac\n\n# Revoke, then present the very same token again. A rejected token\n# yields an empty module list rather than an error exit.\nsudo -u logos env HOME=/var/lib/logos-node \"$LS\" --config-dir $CFG revoke-token alice --json\nOUT=$(sudo -u alice env HOME=/home/alice LOGOSCORE_CONFIG_DIR=$CFG LOGOSCORE_TOKEN=\"$TOK\" \"$LS\" list-modules --json)\necho \"after revoke:   $OUT\"\ncase \"$OUT\" in *test_basic_module*) echo \"revoked token still authorizes\"; exit 1 ;; *) : ;; esac\necho \"revocation took effect immediately, with the node still running\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "SKIP: needs Linux + systemd + passwordless sudo\n", "status": "pass"}], "md": "### 5.1 Issue it, use it, revoke it\n\n```bash\n# as the operator\nsudo -u logos logoscore --config-dir /var/lib/logos-node/.logoscore \\\n    issue-token --name alice          # --expires 30d, --local-only also available\n\n# as alice\nLOGOSCORE_TOKEN=<her token> logoscore list-modules\n\n# revoke without restarting the node\nsudo -u logos logoscore --config-dir /var/lib/logos-node/.logoscore \\\n    revoke-token alice\n```\n\n`issue-token` also accepts `--expires 30d` and `--local-only` (accept\nthe token only on the local socket).\n`list-tokens` shows what is outstanding."}, {"execs": [], "md": "## Step 6: A non-member is refused\n\n`mallory` differs from `alice` in exactly one way, and is stopped twice\nover: she cannot traverse the `0750` state directory to read the dial\nspec, and even with a copy of it she has no write permission on the\n`0660` sockets, which is what `connect()` requires."}, {"execs": [{"cmd": "{ [ \"$(uname -s)\" = Linux ] && [ -d /run/systemd/system ] && sudo -n true 2>/dev/null; } || { echo \"SKIP: needs Linux + systemd + passwordless sudo\"; exit 0; }\nLS=$(cat ./ls-path)\nCFG=/var/lib/logos-node/.logoscore\nINST=$(cat ./instance-id)\ncd /tmp\n\n# 1. The file layer: she cannot even read the dial spec.\nif sudo -u mallory cat $CFG/client/config.json >/dev/null 2>&1; then\n  echo \"mallory should not be able to read the client config\"; exit 1\nfi\necho \"config.json: unreadable by mallory (as intended)\"\n\n# 2. The socket layer: no write permission means no connect().\nif sudo -u mallory test -w /tmp/logos_core_service_\"$INST\"; then\n  echo \"mallory should not have write access to the socket\"; exit 1\nfi\necho \"socket:      not writable by mallory (connect would be EACCES)\"\n\n# 3. End to end: the command must not succeed in listing modules.\nOUT=$(sudo -u mallory env HOME=/home/mallory LOGOSCORE_CONFIG_DIR=$CFG \"$LS\" list-modules --json 2>&1 || true)\necho \"mallory list-modules: $OUT\"\ncase \"$OUT\" in *test_basic_module*) echo \"mallory reached the node\"; exit 1 ;; *) : ;; esac\necho \"mallory is refused\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "SKIP: needs Linux + systemd + passwordless sudo\n", "status": "pass"}], "md": "### 6.1 mallory gets nothing\n\n```bash\nsudo -u mallory logoscore list-modules   # refused: not in the group\n```"}, {"execs": [], "md": "## Step 7: Stop the service and confirm nothing is left behind\n\nA node that leaks its socket files accumulates one per module per boot,\nforever. Stopping the unit sends `SIGTERM`, the daemon and each module\nhost unwind their event loops, and Qt's `QLocalServer` destructor unlinks\neach socket on the way out.\n\nWe assert against **this instance's** socket names specifically, so the\ncheck says something precise about this node rather than about whatever\nelse happens to be in `/tmp`."}, {"execs": [{"cmd": "{ [ \"$(uname -s)\" = Linux ] && [ -d /run/systemd/system ] && sudo -n true 2>/dev/null; } || { echo \"SKIP: needs Linux + systemd + passwordless sudo\"; exit 0; }\nINST=$(cat ./instance-id)\necho \"sockets before stop:\"\nls -l /tmp/logos_*\"$INST\"* 2>/dev/null || true\nBEFORE=$(ls /tmp/logos_*\"$INST\"* 2>/dev/null | wc -l)\nif [ \"$BEFORE\" -eq 0 ]; then echo \"no sockets to begin with - the check would be vacuous\"; exit 1; fi\necho \"count before: $BEFORE\"\n\nsudo systemctl stop logos-node.service\nfor i in $(seq 1 30); do\n  n=$(ls /tmp/logos_*\"$INST\"* 2>/dev/null | wc -l)\n  [ \"$n\" -eq 0 ] && break\n  sleep 1\ndone\nAFTER=$(ls /tmp/logos_*\"$INST\"* 2>/dev/null | wc -l)\necho \"count after:  $AFTER\"\nif [ \"$AFTER\" -ne 0 ]; then\n  echo \"sockets survived the stop:\"; ls -l /tmp/logos_*\"$INST\"* 2>/dev/null || true\n  exit 1\nfi\necho \"every socket for instance $INST was unlinked\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "SKIP: needs Linux + systemd + passwordless sudo\n", "status": "pass"}], "md": "### 7.1 systemctl stop, then look\n\n```bash\nsudo systemctl stop logos-node.service\nls /tmp/logos_*        # nothing left from this node\n```"}, {"execs": [{"cmd": "{ [ \"$(uname -s)\" = Linux ] && [ -d /run/systemd/system ] && sudo -n true 2>/dev/null; } || { echo \"SKIP: needs Linux + systemd + passwordless sudo\"; exit 0; }\nsudo systemctl disable logos-node.service >/dev/null 2>&1 || true\nsudo rm -f /etc/systemd/system/logos-node.service\nsudo systemctl daemon-reload\necho \"unit removed\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "SKIP: needs Linux + systemd + passwordless sudo\n", "status": "pass"}], "md": "### 7.2 Clean up\n\nRemove the unit so the host is left as we found it. The users and the\ngroup are left in place \u2014 removing accounts is more disruptive than\nleaving two unprivileged ones behind.\n\n```bash\nsudo systemctl disable --now logos-node.service\nsudo rm /etc/systemd/system/logos-node.service\n```"}]}, {"meta": {"name": "Qt-free logoscore transport boundary", "platform": "Darwin (ext=dylib)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Qt-free logoscore transport boundary\n\nThe Qt-free logoscore process uses qt_remote_plain for local RPC. It keeps\ncompatibility with current qt_remote modules while Qt stays in logos_host_qt.\nTCP and TLS are intentionally rejected until the plain C ABI implements them.\n\n**What you'll learn:**\n\n- The active transport is local qt_remote_plain\n- Old network configuration fails explicitly\n\n## Prerequisites\n\n- Nix with flakes enabled."}, {"execs": [], "md": "## Step 1: Build logoscore"}, {"execs": [{"cmd": "nix build 'github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560' --out-link ./logos", "exit_code": 1, "kind": "run", "note": "exit code 1", "output": "error:\n       \u2026 while updating the lock file of flake 'github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560?narHash=sha256-j%2BJYGfj9HGAvkA3ZPR41V9TIyCN0zYmszA51%2BtjMYME%3D'\n\n       error: cannot write modified lock file of flake 'github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560' (use '--no-write-lock-file' to ignore)\n", "status": "fail"}], "md": "### 1.1 Build the CLI\n\n```bash\nnix build 'github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560' --out-link ./logos\n```"}, {"execs": [], "md": "## Step 2: Reject a network listener\n\nThe parser still recognizes the old tcp name so the daemon can report a\nuseful migration error. It does not silently fall back to local IPC."}, {"execs": [{"cmd": "./logos/bin/logoscore --config-dir ./session -D --module-transport core_service=tcp,host=127.0.0.1,port=6000 2>&1 || true", "exit_code": 0, "kind": "run", "note": "expected 'not available in the Qt-free logoscore runtime' not found in output", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 2.1 Request TCP\n\n```bash\nlogoscore -D --module-transport core_service=tcp,host=127.0.0.1,port=6000\n```"}]}, {"meta": {"name": "Running Modules with the logosctl Daemon", "platform": "Darwin (ext=dylib)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Running Modules with the logosctl Daemon\n\nThis doc-test walks through the **daemon mode** of `logosctl`: start a long-running\nprocess, inspect its status, load a module, introspect and call it, watch its\nresource usage, unload and reload it, and finally shut the daemon down \u2014 verifying\nat each stage that the command had the effect we expect.\n\n`logosctl` is the headless CLI frontend for the Logos platform. In daemon mode\n(`daemon start`, or the `-D` shorthand), it runs in the background and exposes\nclient commands (`daemon status`, `module ls`, `module load`, `module show`,\n`stats`, `call`, `module unload`, `module reload`, `daemon stop`, \u2026) that\nconnect over a local RPC channel.\n\n**What you'll learn:**\n\n- How to build and run the logosctl CLI\n- How a session directory holds the modules the daemon scans\n- How to start the daemon in the background and capture its logs\n- How to inspect the daemon and the modules it has discovered\n- How to load a module, introspect it with `module show`, and call its methods\n- How to read per-module resource usage with `stats`\n- How `status` reflects the module lifecycle as you load, unload, and reload\n- How to stop the daemon and confirm it has actually exited\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`"}, {"execs": [], "md": "## Step 1: Build logosctl\n\nBuild the logosctl CLI from the published flake. The result is symlinked to\n`./logos/` for easy reference in the steps below."}, {"execs": [{"cmd": "nix build \"github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560#ctl\" --out-link ./logos", "exit_code": 1, "kind": "run", "note": "exit code 1", "output": "error:\n       \u2026 while updating the lock file of flake 'github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560?narHash=sha256-j%2BJYGfj9HGAvkA3ZPR41V9TIyCN0zYmszA51%2BtjMYME%3D'\n\n       error: cannot write modified lock file of flake 'github:logos-co/logos-logoscore-cli/216783bf12e8aae5b2d1ddec6b7a73568ed60560' (use '--no-write-lock-file' to ignore)\n", "status": "fail"}], "md": "### 1.1 Build the CLI\n\n```bash\nnix build 'github:logos-co/logos-logoscore-cli#ctl' --out-link ./logos\n```\n\nThe build produces `logos/bin/logosctl` plus bundled runtime libraries and\na `logos/modules/` directory containing the built-in `capability_module`."}, {"execs": [], "md": "## Step 2: Prepare a modules directory\n\nA logosctl **session** is a single directory that holds everything the\ndaemon needs: its config, the modules installed into it, its persistence\nand its trust material. `--config-dir` picks which session to use, and\nthe daemon scans that session's `modules/` subdirectory (plus the\nread-only set bundled beside the binary).\n\nNormally you populate a session with `logosctl install`. Here we drop\n`test_basic_module` straight into `./session/modules/` instead, because\nthis doc-test uses a locally-built module that is not in any catalog."}, {"execs": [{"cmd": "SYSTEM=$(nix eval --impure --raw --expr 'builtins.currentSystem')\nnix build \"github:logos-co/logos-test-modules#modules.$SYSTEM.test_basic_module.install\" --out-link ./result-module\nmkdir -p session/modules\ncp -RL ./result-module/modules/. ./session/modules/\n", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 2.1 Install a module to load\n\nBuild `test_basic_module` and merge it with the bundled capability module\ninto the session's `modules/` directory:\n\n```bash\nSYSTEM=$(nix eval --impure --raw --expr 'builtins.currentSystem')\nnix build \"github:logos-co/logos-test-modules#modules.$SYSTEM.test_basic_module.install\" --out-link ./result-module\nmkdir -p session/modules\ncp -RL ./result-module/modules/. ./session/modules/\n\n```\n\nThe session's modules directory now contains:\n\n```\nmodules/\n\u251c\u2500\u2500 capability_module/\n\u2502   \u251c\u2500\u2500 manifest.json\n\u2502   \u2514\u2500\u2500 capability_module_plugin.{so,dylib}\n\u2514\u2500\u2500 test_basic_module/\n    \u251c\u2500\u2500 manifest.json\n    \u2514\u2500\u2500 test_basic_module_plugin.{so,dylib}\n```"}, {"execs": [], "md": "## Step 3: Run the daemon and call a module\n\nStart the daemon in the background, then use client subcommands to interact\nwith it. Output from the daemon process is captured in `session/logs/daemon.log`."}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session daemon start --detach", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 3.1 Start the daemon\n\nStart logosctl in daemon mode in the background, capturing output to\n`session/logs/daemon.log`. That name is e", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 3.5 Load the module\n\nLoad `test_basic_module` into the running daemon:\n\n```bash\nlogosctl module load test_basic_module\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session daemon status --human\necho '# --- JSON ---'\n./logos/bin/logosctl --config-dir ./session daemon status --json\n", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n# --- JSON ---\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 3: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 3.6 Confirm the module is now loaded\n\nRe-run `status`. The module that was `not_loaded` before now reports\n`loaded`, and once loaded it carries an uptime (shown in both forms):\n\n```bash\nlogosctl daemon status\nlogosctl daemon status --json\n```"}, {"execs": [{"cmd": "dpid=$(./logos/bin/logosctl --config-dir ./session daemon status --json | python3 -c \"import json,sys;print(json.load(sys.stdin)['daemon']['pid'])\")\ndpgid=$(ps -o pgid= -p \"$dpid\" | tr -d ' ')\nresult=NO_MODULE_SUBPROCESS\nfor hp in $(pgrep -f logos_host); do\n  [ \"$(ps -o ppid= -p \"$hp\" | tr -d ' ')\" = \"$dpid\" ] || continue\n  hpgid=$(ps -o pgid= -p \"$hp\" | tr -d ' ')\n  if [ \"$hp\" = \"$hpgid\" ] && [ \"$hpgid\" != \"$dpgid\" ]; then\n    result=MODULE_SUBPROCESS_ISOLATED; break\n  else\n    result=MODULE_SUBPROCESS_SHARES_LAUNCHER_GROUP\n  fi\ndone\necho \"daemon_pid=$dpid daemon_pgid=$dpgid -> $result\"\n", "exit_code": 1, "kind": "run", "note": "exit code 1", "output": "'utf-8' codec can't decode byte 0xa0 in position 1440: invalid start byte", "status": "fail"}], "md": "### 3.7 Module subprocesses are isolated from the launcher's process group\n\nWith a module loaded, the daemon is running it in its own subprocess\n(`logos_host`). The daemon itself stays in the **foreground**, in its\nlauncher's process group, so a shell, `systemd`, or Docker manages it\nnormally \u2014 but each `logos_host` must lead its **own** process group, not\nstay in the daemon's (i.e. the launcher's). Otherwise tearing the module\ntree down on shutdown, or any process-group signal aimed at the daemon,\nleaks into the launcher and can kill the shell driving it (a teardown\nstep dying with exit `-15` on Linux).\n\nWe take a module subprocess (a `logos_host` child of the daemon) and\nassert it is its **own** process-group leader (`pgid == pid`) and is\n**not** in the daemon's group.\n\n```bash\n# a module subprocess must lead its own group: pgid == pid, != daemon\ndpid=$(logosctl daemon status --json | jq .daemon.pid)\nhost=$(pgrep -P \"$dpid\" -f logos_host | head -1)\n[ \"$host\" = \"$(ps -o pgid= -p \"$host\" | tr -d ' ')\" ] && echo ISOLATED\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session module show test_basic_module --human\necho '# --- JSON ---'\n./logos/bin/logosctl --config-dir ./session module show test_basic_module --json\n", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n# --- JSON ---\n/nix/store/55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9/bin/sh: line 3: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 3.8 Inspect the module with module show\n\n`module show` (`module info` is accepted too) shows a single module's\nstatus and the `Q_INVOKABLE` methods it exposes \u2014 the same methods you\ncan `call`:\n\n```bash\nlogosctl module show test_basic_module\nlogosctl module show test_basic_module --json\n```\n\nHuman-readable form (methods list trimmed):\n\n```text\nName:          te

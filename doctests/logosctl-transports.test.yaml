name: "Qt-free logosctl transport listeners"
output: logosctl-transports.md
release: ""

intro: |
  The Qt-free logosctl process uses qt_remote_plain for local, TCP, and TLS
  RPC. It keeps compatibility with current qt_remote modules while Qt stays
  in logos_host_qt.

what_you_learn:
  - A local control endpoint remains available when TCP is configured
  - The plain runtime binds and advertises a TCP listener

prerequisites:
  - "Nix with flakes enabled."

sections:
  - title: "Build logosctl"
    step: true
    steps:
      - title: "Build the CLI"
        run: "nix build 'github:logos-co/logos-logoscore-cli{release}#ctl' --out-link ./logos"
        check_file: "logos/bin/logosctl"

  - title: "Bind a loopback TCP listener"
    step: true
    text: |
      Configuration can request TCP while retaining local control access.
      Port 0 lets the OS choose an available port.
    steps:
      - title: "Configure TCP"
        run: |
          cat > node.yaml <<'YAML'
          version: 2
          modules:
            core_service:
              - protocol: tcp
                host: 127.0.0.1
                port: 0
          YAML
          ./logos/bin/logosctl --config-dir ./session daemon config set ./node.yaml
        check_file: "session/daemon/config.yaml"

      - title: "Start the daemon"
        run: "./logos/bin/logosctl --config-dir ./session daemon start --detach"

      - title: "Check the bound listener and local control endpoint"
        run: |
          ./logos/bin/logosctl --config-dir ./session daemon status --json
          python3 - <<'PY'
          import json
          with open('session/daemon/state.json') as f:
              state = json.load(f)
          transports = state['resolved']['modules']['core_service']['transports']
          assert any(t['protocol'] == 'local' for t in transports), transports
          assert any(t['protocol'] == 'tcp' and t['host'] == '127.0.0.1'
                     and t['port'] > 0 for t in transports), transports
          print('local control and bound TCP listener are available')
          PY
        expect_contains:
          - "local control and bound TCP listener are available"

      - title: "Stop the daemon"
        run: "./logos/bin/logosctl --config-dir ./session daemon stop"

ires 30d` and `--local-only` (refuse\nthe token over `tcp` / `tcp_ssl`, accept it only on the local socket).\n`list-tokens` shows what is outstanding."}, {"execs": [], "md": "## Step 6: A non-member is refused\n\n`mallory` differs from `alice` in exactly one way, and is stopped twice\nover: she cannot traverse the `0750` state directory to read the dial\nspec, and even with a copy of it she has no write permission on the\n`0660` sockets, which is what `connect()` requires."}, {"execs": [{"cmd": "{ [ \"$(uname -s)\" = Linux ] && [ -d /run/systemd/system ] && sudo -n true 2>/dev/null; } || { echo \"SKIP: needs Linux + systemd + passwordless sudo\"; exit 0; }\nLS=$(cat ./ls-path)\nCFG=/var/lib/logos-node/.logoscore\nINST=$(cat ./instance-id)\ncd /tmp\n\n# 1. The file layer: she cannot even read the dial spec.\nif sudo -u mallory cat $CFG/client/config.json >/dev/null 2>&1; then\n  echo \"mallory should not be able to read the client config\"; exit 1\nfi\necho \"config.json: unreadable by mallory (as intended)\"\n\n# 2. The socket layer: no write permission means no connect().\nif sudo -u mallory test -w /tmp/logos_core_service_\"$INST\"; then\n  echo \"mallory should not have write access to the socket\"; exit 1\nfi\necho \"socket:      not writable by mallory (connect would be EACCES)\"\n\n# 3. End to end: the command must not succeed in listing modules.\nOUT=$(sudo -u mallory env HOME=/home/mallory LOGOSCORE_CONFIG_DIR=$CFG \"$LS\" list-modules --json 2>&1 || true)\necho \"mallory list-modules: $OUT\"\ncase \"$OUT\" in *test_basic_module*) echo \"mallory reached the node\"; exit 1 ;; *) : ;; esac\necho \"mallory is refused\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "config.json: unreadable by mallory (as intended)\nsocket:      not writable by mallory (connect would be EACCES)\nmallory list-modules: {\"code\":\"NO_DAEMON\",\"message\":\"No client config at /var/lib/logos-node/.logoscore/client/config.json. Start a daemon in this session (it writes one on boot), or install a dial spec with `logosctl client config set FILE` alongside the matching token file.\",\"status\":\"error\"}\nmallory is refused\n", "status": "pass"}], "md": "### 6.1 mallory gets nothing\n\n```bash\nsudo -u mallory logoscore list-modules   # refused: not in the group\n```"}, {"execs": [], "md": "## Step 7: Stop the service and confirm nothing is left behind\n\nA node that leaks its socket files accumulates one per module per boot,\nforever. Stopping the unit sends `SIGTERM`, the daemon and each module\nhost unwind their event loops, and Qt's `QLocalServer` destructor unlinks\neach socket on the way out.\n\nWe assert against **this instance's** socket names specifically, so the\ncheck says something precise about this node rather than about whatever\nelse happens to be in `/tmp`."}, {"execs": [{"cmd": "{ [ \"$(uname -s)\" = Linux ] && [ -d /run/systemd/system ] && sudo -n true 2>/dev/null; } || { echo \"SKIP: needs Linux + systemd + passwordless sudo\"; exit 0; }\nINST=$(cat ./instance-id)\necho \"sockets before stop:\"\nls -l /tmp/logos_*\"$INST\"* 2>/dev/null || true\nBEFORE=$(ls /tmp/logos_*\"$INST\"* 2>/dev/null | wc -l)\nif [ \"$BEFORE\" -eq 0 ]; then echo \"no sockets to begin with - the check would be vacuous\"; exit 1; fi\necho \"count before: $BEFORE\"\n\nsudo systemctl stop logos-node.service\nfor i in $(seq 1 30); do\n  n=$(ls /tmp/logos_*\"$INST\"* 2>/dev/null | wc -l)\n  [ \"$n\" -eq 0 ] && break\n  sleep 1\ndone\nAFTER=$(ls /tmp/logos_*\"$INST\"* 2>/dev/null | wc -l)\necho \"count after:  $AFTER\"\nif [ \"$AFTER\" -ne 0 ]; then\n  echo \"sockets survived the stop:\"; ls -l /tmp/logos_*\"$INST\"* 2>/dev/null || true\n  exit 1\nfi\necho \"every socket for instance $INST was unlinked\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "sockets before stop:\nsrw-rw---- 1 logos logos 0 Aug 21 01:18 /tmp/logos_capability_module_5bf07df77c72\nsrw-rw---- 1 logos logos 0 Aug 21 01:18 /tmp/logos_core_service_5bf07df77c72\nsrw-rw---- 1 logos logos 0 Aug 21 01:18 /tmp/logos_test_basic_module_5bf07df77c72\ncount before: 3\ncount after:  0\nevery socket for instance 5bf07df77c72 was unlinked\n", "status": "pass"}], "md": "### 7.1 systemctl stop, then look\n\n```bash\nsudo systemctl stop logos-node.service\nls /tmp/logos_*        # nothing left from this node\n```"}, {"execs": [{"cmd": "{ [ \"$(uname -s)\" = Linux ] && [ -d /run/systemd/system ] && sudo -n true 2>/dev/null; } || { echo \"SKIP: needs Linux + systemd + passwordless sudo\"; exit 0; }\nsudo systemctl disable logos-node.service >/dev/null 2>&1 || true\nsudo rm -f /etc/systemd/system/logos-node.service\nsudo systemctl daemon-reload\necho \"unit removed\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "unit removed\n", "status": "pass"}], "md": "### 7.2 Clean up\n\nRemove the unit so the host is left as we found it. The users and the\ngroup are left in place \u2014 removing accounts is more disruptive than\nleaving two unprivileged ones behind.\n\n```bash\nsudo systemctl disable --now logos-node.service\nsudo rm /etc/systemd/system/logos-node.service\n```"}]}, {"meta": {"name": "Reaching the logoscore Daemon over TCP and TCP+TLS", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Reaching the logoscore Daemon over TCP and TCP+TLS\n\nBy default the `logoscore` daemon binds every module to a local Unix socket,\nso only clients on the same host \u2014 using the auto-emitted config under\n`~/.logoscore/` \u2014 can reach it. This doc-test shows how to expose the daemon\nover the network instead, using the two non-local transports `logoscore`\nsupports:\n\n- **`tcp`** \u2014 a plaintext TCP listener. Good for loopback and trusted\n  networks. On a non-loopback host it puts the auth token on the wire in\n  cleartext, so the daemon refuses to bind it there without `--insecure-tcp`.\n- **`tcp_ssl`** \u2014 a TLS-wrapped TCP listener. The wire is encrypted with a\n  server certificate; the client verifies that certificate against a CA.\n\nWe drive everything on a single host over the loopback interface\n(`127.0.0.1`) so the doc-test is self-contained and needs no second machine,\nbut the moving parts \u2014 a per-module network listener on the daemon, a\nhand-written `client/config.json` dial spec, and a copied auth token \u2014 are\nexactly the ones a real remote client uses.\n\n> \u26a0\ufe0f **Remote operation is under active development.** The transport flags,\n> the `client/config.json` schema, and the auth model may change between\n> releases. Local same-host use is the stable path. This walkthrough\n> authenticates the network client with the daemon's **auto-emitted token**\n> (`client/auto.json`), which is the credential the daemon registers for\n> itself at boot.\n>\n> Operator-issued tokens (`logoscore issue-token --name alice`) are also\n> honored for `core_service` calls over every transport, and are the better\n> choice for a real remote client: they are named, can carry an `--expires`\n> deadline, and can be revoked while the node keeps running. A token issued\n> `--local-only` is deliberately refused over `tcp` / `tcp_ssl` and accepted\n> only on the local socket.\n\n**What you'll learn:**\n\n- How the daemon's per-module transports work and why `local` is always present\n- How to add a `tcp` listener to the well-known modules with `--module-transport`\n- Why both `core_service` and `capability_module` must be exposed, not just one\n- How the plaintext-TCP guard protects you from leaking tokens on the wire\n- How to write a `client/config.json` dial spec and point a client at it with `--config-dir`\n- How to copy the daemon's auth token into the client config directory\n- How to drive the daemon (`status`, `load-module`, `call`, \u2026) over TCP\n- How to switch the same setup to `tcp_ssl` with a self-signed certificate\n- How TLS peer verification fails closed when the client has no CA to trust\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`\n\n- **OpenSSL** on `PATH` (only the final TLS section needs it) to generate a\nthrowaway self-signed certificate.\n\nVerify: `openssl version`"}, {"execs": [], "md": "## Step 1: Build logoscore and prepare modules\n\nBuild the CLI and assemble a modules directory, exactly as in the daemon\ndoc-test. The daemon needs the bundled `capability_module` (used for the\nclient handshake) plus at least one ordinary module to load and call \u2014\nhere `test_basic_module` from logos-test-modules."}, {"execs": [{"cmd": "nix build 'github:logos-co/logos-logoscore-cli/5200623eeff8a96b3e46657fbf2ef54d40d101f4' --out-link ./logos", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 1.1 Build the CLI\n\n```bash\nnix build 'github:logos-co/logos-logoscore-cli/5200623eeff8a96b3e46657fbf2ef54d40d101f4' --out-link ./logos\n```\n\nThe build produces `logos/bin/logoscore` plus a `logos/modules/`\ndirectory containing the built-in `capability_module`."}, {"execs": [{"cmd": "SYSTEM=$(nix eval --impure --raw --expr 'builtins.currentSystem')\nnix build \"github:logos-co/logos-test-modules#modules.$SYSTEM.test_basic_module.install\" --out-link ./result-module\nmkdir -p modules\n# cp -RL copies the read-only nix-store trees as read-only files, so a\n# re-run (or a pre-populated modules/) can't overwrite them. Restore\n# write permission first to keep the copy idempotent.\nchmod -R u+w ./modules 2>/dev/null || true\ncp -RL ./logos/modules/. ./modules/\nchmod -R u+w ./modules 2>/dev/null || true\ncp -RL ./result-module/modules/. ./modules/\n", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 1.2 Install a module to load\n\nBuild `test_basic_module` and merge it with the bundled capability\nmodule into `./modules/`:\n\n```bash\nSYSTEM=$(nix eval --impure --raw --expr 'builtins.currentSystem')\nnix build \"github:logos-co/logos-test-modules#modules.$SYSTEM.test_basic_module.install\" --out-link ./result-module\nmkdir -p modules\n# cp -RL copies the read-only nix-store trees as read-only files, so a\n# re-run (or a pre-populated modules/) can't overwrite them. Restore\n# write permission first to keep the copy idempotent.\nchmod -R u+w ./modules 2>/dev/null || true\ncp -RL ./logos/modules/. ./modules/\nchmod -R u+w ./modules 2>/dev/null || true\ncp -RL ./result-module/modules/. ./modules/\n\n```\n\n```\nmodules/\n\u251c\u2500\u2500 capability_module/\n\u2502   \u251c\u2500\u2500 manifest.json\n\u2502   \u2514\u2500\u2500 capability_module_plugin.{so,dylib}\n\u2514\u2500\u2500 test_basic_module/\n    \u251c\u2500\u2500 manifest.json\n    \u2514\u2500\u2500 test_basic_module_plugin.{so,dylib}\n```"}, {"execs": [], "md": "## Step 2: Start the daemon with TCP listeners\n\n`--module-transport NAME=PROTOCOL[,k=v...]` adds one network listener to\nthe named module. We bind **both** well-known modules on loopback:\n`core_service` on port 6000 and `capability_module` on port 6001.\n\nTwo things worth calling out:\n\n- **`local` is always present.** Every configured module keeps its\n  same-host Unix-socket listener; the `tcp` entry is an *additional*\n  outside-facing surface. That's what lets the daemon's own\n  intra-process calls keep working while remote clients use TCP.\n- **Expose `capability_module`, not just `core_service`.** Before its\n  first call, a client performs a `requestModule` handshake against\n  `capability_module` to resolve the endpoint. A remote client has no\n  Unix socket to the daemon, so that handshake has to ride the network\n  too. Expose only `core_service` and remote client commands hang or fail\n  at connect time.\n\nWe use `--config-dir ./daemon-home` to keep all daemon state inside the\nworking directory instead of `~/.logoscore`."}, {"execs": [{"cmd": "./logos/bin/logoscore --config-dir ./daemon-home -D -m ./modules --module-transport core_service=tcp,host=0.0.0.0,port=6000 2>&1 || true", "exit_code": 0, "kind": "run", "note": "", "output": "Error: module 'core_service' binds plaintext tcp on non-loopback host '0.0.0.0'. Use protocol=tcp_ssl, or pass --insecure-tcp if you really mean it.\n", "status": "pass"}], "md": "### 2.1 Refuse plaintext TCP on a public interface\n\nFirst, a guardrail. Plaintext `tcp` on a non-loopback host would put\nthe auth token on the wire in cleartext, so the daemon refuses to bind\nit unless you explicitly pass `--insecure-tcp`. Watch it reject a\n`0.0.0.0` listener (the `|| true` lets the doc-test continue past the\nexpected non-zero exit):\n\n```bash\nlogoscore -D -m ./modules --module-transport core_service=tcp,host=0.0.0.0,port=6000\n```\n\nOn loopback (`127.0.0.1`) there is nothing to leak to, so the same\nflag binds without the escape hatch \u2014 which is what we do next."}, {"execs": [{"cmd": "sh -c './logos/bin/logoscore --config-dir ./daemon-home -D -m ./modules --module-transport core_service=tcp,host=127.0.0.1,port=6000 --module-transport capability_module=tcp,host=127.0.0.1,port=6001 > daemon.log 2>&1 &'", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 2.2 Start the daemon on loopback TCP\n\nStart the daemon in the background with TCP listeners for both\nwell-known modules, capturing its output to `daemon.log`:\n\n```bash\nlogoscore -D -m ./modules \\\n    --module-transport core_service=tcp,host=127.0.0.1,port=6000 \\\n    --module-transport capability_module=tcp,host=127.0.0.1,port=6001 \\\n    > daemon.log &\n```"}, {"execs": [{"cmd": "sleep 4", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 4\n```"}, {"execs": [{"cmd": "cat ./daemon-home/daemon/state.json", "exit_code": 0, "kind": "run", "note": "", "output": "{\n    \"config_source\": \"cli\",\n    \"instance_id\": \"1e6dbb75643a\",\n    \"pid\": 10391,\n    \"resolved\": {\n        \"insecure_tcp\": false,\n        \"logging\": {\n            \"console\": true,\n            \"enabled\": true,\n            \"file\": \"daemon.log\",\n            \"max_files\": 5,\n            \"max_size_mb\": 10\n        },\n        \"modules\": {\n            \"capability_module\": {\n                \"transports\": [\n                    {\n                        \"protocol\": \"local\"\n                    },\n                    {\n                        \"codec\": \"json\",\n                        \"host\": \"127.0.0.1\",\n                        \"port\": 6001,\n                        \"protocol\": \"tcp\"\n                    }\n                ]\n            },\n            \"core_service\": {\n                \"transports\": [\n                    {\n                        \"protocol\": \"local\"\n                    },\n                    {\n                        \"codec\": \"json\",\n                        \"host\": \"127.0.0.1\",\n                        \"port\": 6000,\n                        \"protocol\": \"tcp\"\n                    }\n                ]\n            }\n        },\n        \"modules_dirs\": [\n            \"./modules\"\n        ],\n        \"persistence_path\": \"\",\n        \"ssl\": {\n            \"ca\": \"\",\n            \"cert\": \"\",\n            \"key\": \"\"\n        }\n    },\n    \"started_at\": \"2026-08-21T01:23:07Z\",\n    \"version\": 2\n}\n", "status": "pass"}], "md": "### 2.3 Confirm the resolved transports\n\nThe daemon records the transports it actually bound in\n`daemon/state.json`. Each well-known module shows the implicit\n`local` listener first, followed by the `tcp` one we asked for:\n\n```bash\ncat ~/.logoscore/daemon/state.json\n```"}, {"execs": [], "md": "## Step 3: Point a client at the daemon over TCP\n\nA network client doesn't read the daemon's files \u2014 it dials whatever its\nown `client/config.json` says and authenticates with a token file beside\nit. We build a **separate** config directory (`./client-home`) to make the\nclient/daemon split explicit, then point the client at it with\n`--config-dir`.\n\nThe directory layout the client expects:\n\n```\nclient-home/            \u2190 pass this to --config-dir\n\u2514\u2500\u2500 client/\n    \u251c\u2500\u2500 config.json     \u2190 the dial spec\n    \u2514\u2500\u2500 auto.json       \u2190 the auth token referenced by token_file\n```"}, {"execs": [{"cmd": "mkdir -p ./client-home/client\ncp ./daemon-home/client/auto.json ./client-home/client/auto.json\n", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 3.1 Copy the daemon's auth token\n\nAt boot the daemon emits its own token to\n`client/auto.json` under its config dir. Copy that into the client's\n`client/` directory \u2014 it's the credential the client will present:\n\n```bash\nmkdir -p ./client-home/client\ncp ./daemon-home/client/auto.json ./client-home/client/auto.json\n\n```\n\n> On a real remote host you'd `scp` this file across instead of\n> copying it locally. Treat it as a secret: anything holding it can\n> drive the daemon."}, {"execs": [{"cmd": "cat > ./client-home/client/config.json <<'JSON'\n{\n    \"version\": 2,\n    \"token_file\": \"auto.json\",\n    \"daemon\": {\n        \"core_service\":      { \"transport\": \"tcp\", \"host\": \"127.0.0.1\", \"port\": 6000 },\n        \"capability_module\": { \"transport\": \"tcp\", \"host\": \"127.0.0.1\", \"port\": 6001 }\n    }\n}\nJSON\n", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 3.2 Write the dial spec\n\nThe `client/config.json` schema is version `2`. `token_file` names the\nfile you just copied, and the `daemon` block lists one entry per\nmodule with its transport, host, and port \u2014 matching the listeners the\ndaemon bound. Both `core_service` and `capability_module` are required:\n\n```bash\ncat > ./client-home/client/config.json <<'JSON'\n{\n    \"version\": 2,\n    \"token_file\": \"auto.json\",\n    \"daemon\": {\n        \"core_service\":      { \"transport\": \"tcp\", \"host\": \"127.0.0.1\", \"port\": 6000 },\n        \"capability_module\": { \"transport\": \"tcp\", \"host\": \"127.0.0.1\", \"port\": 6001 }\n    }\n}\nJSON\n\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore --config-dir ./client-home status", "exit_code": 0, "kind": "run", "note": "", "output": "{\"daemon\":{\"pid\":10391,\"status\":\"running\",\"version\":\"1.0.0\"},\"modules\":[{\"name\":\"test_basic_module\",\"status\":\"not_loaded\",\"version\":\"1.0.0\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":4,\"version\":\"1.0.0\"}],\"modules_summary\":{\"crashed\":0,\"loaded\":1,\"not_loaded\":1}}\n", "status": "pass"}], "md": "### 3.3 Check daemon status over TCP\n\nWith the dial spec in place, every client command works against\n`--config-dir ./client-home` \u2014 the traffic now goes over TCP:\n\n```bash\nlogoscore --config-dir ./client-home status\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore --config-dir ./client-home list-modules", "exit_code": 0, "kind": "run", "note": "", "output": "[{\"name\":\"test_basic_module\",\"status\":\"not_loaded\",\"version\":\"1.0.0\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":4,\"version\":\"1.0.0\"}]\n", "status": "pass"}], "md": "### 3.4 List, load, and call over TCP\n\nDrive the module lifecycle exactly as you would locally:\n\n```bash\nlogoscore --config-dir ./client-home list-modules\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore --config-dir ./client-home load-module test_basic_module", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[],\"module\":\"test_basic_module\",\"status\":\"ok\",\"version\":\"1.0.0\"}\n", "status": "pass"}], "md": "```bash\nlogoscore --config-dir ./client-home load-module test_basic_module\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore --config-dir ./client-home call test_basic_module addInts 2 3", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"addInts\",\"module\":\"test_basic_module\",\"result\":5,\"status\":\"ok\"}\n", "status": "pass"}], "md": "```bash\nlogoscore --config-dir ./client-home call test_basic_module addInts 2 3\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore --config-dir ./client-home stop", "exit_code": 0, "kind": "run", "note": "", "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.5 Stop the daemon\n\nShut the TCP daemon down before moving on to the TLS variant:\n\n```bash\nlogoscore --config-dir ./client-home stop\n```"}, {"execs": [{"cmd": "sleep 2", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 2\n```"}, {"execs": [], "md": "## Step 4: Encrypt the wire with tcp_ssl\n\n`tcp` is fine on loopback, but across any untrusted network you want the\nwire encrypted. The `tcp_ssl` protocol wraps the same TCP listener in TLS.\nThe daemon side adds `cert=` and `key=` (the server's certificate and\nprivate key); the client side adds a `ca` to verify that certificate\nagainst, plus `verify_peer`.\n\nTLS verifies the certificate's host name against the address the client\ndialed, so the certificate must cover `127.0.0.1`. We generate a throwaway\nself-signed certificate whose Subject Alternative Name includes it, and\nuse that same certificate as the client's CA."}, {"execs": [{"cmd": "mkdir -p tls\nopenssl req -x509 -newkey rsa:2048 -nodes \\\n  -keyout tls/key.pem -out tls/cert.pem -days 365 \\\n  -subj \"/CN=logoscore-test\" \\\n  -addext \"subjectAltName=IP:127.0.0.1,DNS:localhost\"\ncp tls/cert.pem tls/ca.pem\n", "exit_code": 0, "kind": "run", "note": "", "output": ".........+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++*.....+...+.+..+....+.....+.+........+.+...+......+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++*.........+....+..+...+....+...+..+............+.+...+.....+..........+...........+.........+.+...+...............+...............+...............+.....+......+....+...+...+......+..............+.......+..+..........+......+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++\n..+.......+.....+....+.....+...+.+..+...+.+..............+.......+..+......+.+......+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++*.....+.....+.+...+...+..+.............+..............+...+......+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++*.+...+.........+.+.........+..+..........+...+...+.....+.........+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++\n-----\n", "status": "pass"}], "md": "### 4.1 Generate a self-signed certificate\n\nCreate a key + certificate with `subjectAltName=IP:127.0.0.1`. Because\nit's self-signed, the certificate is also its own CA \u2014 so we copy it to\n`ca.pem` for the client to trust:\n\n```bash\nmkdir -p tls\nopenssl req -x509 -newkey rsa:2048 -nodes \\\n  -keyout tls/key.pem -out tls/cert.pem -days 365 \\\n  -subj \"/CN=logoscore-test\" \\\n  -addext \"subjectAltName=IP:127.0.0.1,DNS:localhost\"\ncp tls/cert.pem tls/ca.pem\n\n```"}, {"execs": [{"cmd": "sh -c './logos/bin/logoscore --config-dir ./tls-daemon-home -D -m ./modules --module-transport \"core_service=tcp_ssl,host=127.0.0.1,port=6443,cert=$PWD/tls/cert.pem,key=$PWD/tls/key.pem\" --module-transport \"capability_module=tcp_ssl,host=127.0.0.1,port=6444,cert=$PWD/tls/cert.pem,key=$PWD/tls/key.pem\" > tls-daemon.log 2>&1 &'", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 4.2 Start the daemon with tcp_ssl listeners\n\nBind both well-known modules over `tcp_ssl`, passing the cert and key.\nOn loopback no `--insecure-tcp` is involved at all \u2014 TLS is never\nplaintext:\n\n```bash\nlogoscore -D -m ./modules \\\n    --module-transport \"core_service=tcp_ssl,host=127.0.0.1,port=6443,cert=$PWD/tls/cert.pem,key=$PWD/tls/key.pem\" \\\n    --module-transport \"capability_module=tcp_ssl,host=127.0.0.1,port=6444,cert=$PWD/tls/cert.pem,key=$PWD/tls/key.pem\" \\\n    > tls-daemon.log &\n```"}, {"execs": [{"cmd": "sleep 4", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 4\n```"}, {"execs": [{"cmd": "mkdir -p ./tls-client-home/client\ncp ./tls-daemon-home/client/auto.json ./tls-client-home/client/auto.json\ncat > ./tls-client-home/client/config.json <<JSON\n{\n    \"version\": 2,\n    \"token_file\": \"auto.json\",\n    \"daemon\": {\n        \"core_service\":      { \"transport\": \"tcp_ssl\", \"host\": \"127.0.0.1\", \"port\": 6443, \"ca\": \"$PWD/tls/ca.pem\", \"verify_peer\": true },\n        \"capability_module\": { \"transport\": \"tcp_ssl\", \"host\": \"127.0.0.1\", \"port\": 6444, \"ca\": \"$PWD/tls/ca.pem\", \"verify_peer\": true }\n    }\n}\nJSON\n", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 4.3 Write the TLS dial spec\n\nThe client config is the same shape as before, but `transport` becomes\n`tcp_ssl` and each module entry gains `ca` (the certificate to trust)\nand `verify_peer: true`:\n\n```bash\nmkdir -p ./tls-client-home/client\ncp ./tls-daemon-home/client/auto.json ./tls-client-home/client/auto.json\ncat > ./tls-client-home/client/config.json <<JSON\n{\n    \"version\": 2,\n    \"token_file\": \"auto.json\",\n    \"daemon\": {\n        \"core_service\":      { \"transport\": \"tcp_ssl\", \"host\": \"127.0.0.1\", \"port\": 6443, \"ca\": \"$PWD/tls/ca.pem\", \"verify_peer\": true },\n        \"capability_module\": { \"transport\": \"tcp_ssl\", \"host\": \"127.0.0.1\", \"port\": 6444, \"ca\": \"$PWD/tls/ca.pem\", \"verify_peer\": true }\n    }\n}\nJSON\n\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore --config-dir ./tls-client-home status", "exit_code": 0, "kind": "run", "note": "", "output": "{\"daemon\":{\"pid\":10421,\"status\":\"running\",\"version\":\"1.0.0\"},\"modules\":[{\"name\":\"test_basic_module\",\"status\":\"not_loaded\",\"version\":\"1.0.0\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":4,\"version\":\"1.0.0\"}],\"modules_summary\":{\"crashed\":0,\"loaded\":1,\"not_loaded\":1}}\n", "status": "pass"}], "md": "### 4.4 Drive the daemon over TLS\n\nStatus, load, and call now travel over an encrypted connection:\n\n```bash\nlogoscore --config-dir ./tls-client-home status\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore --config-dir ./tls-client-home load-module test_basic_module", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[],\"module\":\"test_basic_module\",\"status\":\"ok\",\"version\":\"1.0.0\"}\n", "status": "pass"}], "md": "```bash\nlogoscore --config-dir ./tls-client-home load-module test_basic_module\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore --config-dir ./tls-client-home call test_basic_module addInts 40 2", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"addInts\",\"module\":\"test_basic_module\",\"result\":42,\"status\":\"ok\"}\n", "status": "pass"}], "md": "```bash\nlogoscore --config-dir ./tls-client-home call test_basic_module addInts 40 2\n```"}, {"execs": [{"cmd": "cat > ./tls-client-home/client/config.json <<'JSON'\n{\n    \"version\": 2,\n    \"token_file\": \"auto.json\",\n    \"daemon\": {\n        \"core_service\":      { \"transport\": \"tcp_ssl\", \"host\": \"127.0.0.1\", \"port\": 6443, \"verify_peer\": true },\n        \"capability_module\": { \"transport\": \"tcp_ssl\", \"host\": \"127.0.0.1\", \"port\": 6444, \"verify_peer\": true }\n    }\n}\nJSON\n./logos/bin/logoscore --config-dir ./tls-client-home status || true\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"daemon\":{\"status\":\"not_running\",\"version\":\"pre-release-5200623\"},\"modules\":[],\"rpc_error\":\"core_service not reachable\"}\n", "status": "pass"}], "md": "### 4.5 Verification fails closed without the CA\n\nTLS is only as good as the verification behind it. Re-point the client\nat the same `tcp_ssl` endpoint but drop the `ca` while keeping\n`verify_peer: true` \u2014 the client has nothing to anchor the daemon's\nself-signed certificate to, so the handshake is rejected and the\ndaemon is reported unreachable (the `|| true` lets the doc-test assert\non the failure):\n\n```bash\nlogoscore --config-dir ./tls-client-home status   # no ca \u2192 rejected\n```\n\n> To intentionally skip verification in a dev setup, set\n> `\"verify_peer\": false` (or pass `--no-verify-peer`) instead of\n> omitting the CA \u2014 but never do that against a real network."}, {"execs": [{"cmd": "./logos/bin/logoscore --config-dir ./tls-daemon-home stop", "exit_code": 0, "kind": "run", "note": "", "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 4.6 Stop the TLS daemon\n\n```bash\nlogoscore --config-dir ./tls-daemon-home stop\n```"}, {"execs": [{"cmd": "sleep 2", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 2\n```"}]}, {"meta": {"name": "Running Modules with the logosctl Daemon", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Running Modules with the logosctl Daemon\n\nThis doc-test walks through the **daemon mode** of `logosctl`: start a long-running\nprocess, inspect its status, load a module, introspect and call it, watch its\nresource usage, unload and reload it, and finally shut the daemon down \u2014 verifying\nat each stage that the command had the effect we expect.\n\n`logosctl` is the headless CLI frontend for the Logos platform. In daemon mode\n(`daemon start`, or the `-D` shorthand), it runs in the background and exposes\nclient commands (`daemon status`, `module ls`, `module load`, `module show`,\n`stats`, `call`, `module unload`, `module reload`, `daemon stop`, \u2026) that\nconnect over a local RPC channel.\n\n**What you'll learn:**\n\n- How to build and run the logosctl CLI\n- How a session directory holds the modules the daemon scans\n- How to start the daemon in the background and capture its logs\n- How to inspect the daemon and the modules it has discovered\n- How to load a module, introspect it with `module show`, and call its methods\n- How to read per-module resource usage with `stats`\n- How `status` reflects the module lifecycle as you load, unload, and reload\n- How to stop the daemon and confirm it has actually exited\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`"}, {"execs": [], "md": "## Step 1: Build logosctl\n\nBuild the logosctl CLI from the published flake. The result is symlinked to\n`./logos/` for easy reference in the steps below."}, {"execs": [{"cmd": "nix build \"github:logos-co/logos-logoscore-cli/5200623eeff8a96b3e46657fbf2ef54d40d101f4#ctl\" --out-link ./logos", "exit_code": 0, "kind": "run", "note": "", "output": "these 2 derivations will be built:\n  /nix/store/1bf2xi53znanf59igliyylk3hzgilwmg-logos-logoscore-cli-logosctl-0.1.0-dev.drv\n  /nix/store/xan3jfn9nyn2mgfz0v4kx3lmbh5ly5fv-logos-logoscore-cli-ctl.drv\nbuilding '/nix/store/1bf2xi53znanf59igliyylk3hzgilwmg-logos-logoscore-cli-logosctl-0.1.0-dev.drv'...\nbuilding '/nix/store/xan3jfn9nyn2mgfz0v4kx3lmbh5ly5fv-logos-logoscore-cli-ctl.drv'...\n", "status": "pass"}], "md": "### 1.1 Build the CLI\n\n```bash\nnix build 'github:logos-co/logos-logoscore-cli#ctl' --out-link ./logos\n```\n\nThe build produces `logos/bin/logosctl` plus bundled runtime libraries and\na `logos/modules/` directory containing the built-in `capability_module`."}, {"execs": [], "md": "## Step 2: Prepare a modules directory\n\nA logosctl **session** is a single directory that holds everything the\ndaemon needs: its config, the modules installed into it, its persistence\nand its trust material. `--config-dir` picks which session to use, and\nthe daemon scans that session's `modules/` subdirectory (plus the\nread-only set bundled beside the binary).\n\nNormally you populate a session with `logosctl install`. Here we drop\n`test_basic_module` straight into `./session/modules/` instead, because\nthis doc-test uses a locally-built module that is not in any catalog."}, {"execs": [{"cmd": "SYSTEM=$(nix eval --impure --raw --expr 'builtins.currentSystem')\nnix build \"github:logos-co/logos-test-modules#modules.$SYSTEM.test_basic_module.install\" --out-link ./result-module\nmkdir -p session/modules\ncp -RL ./result-module/modules/. ./session/modules/\n", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 2.1 Install a module to load\n\nBuild `test_basic_module` and merge it with the bundled capability module\ninto the session's `modules/` directory:\n\n```bash\nSYSTEM=$(nix eval --impure --raw --expr 'builtins.currentSystem')\nnix build \"github:logos-co/logos-test-modules#modules.$SYSTEM.test_basic_module.install\" --out-link ./result-module\nmkdir -p session/modules\ncp -RL ./result-module/modules/. ./session/modules/\n\n```\n\nThe session's modules directory now contains:\n\n```\nmodules/\n\u251c\u2500\u2500 capability_module/\n\u2502   \u251c\u2500\u2500 manifest.json\n\u2502   \u2514\u2500\u2500 capability_module_plugin.{so,dylib}\n\u2514\u2500\u2500 test_basic_module/\n    \u251c\u2500\u2500 manifest.json\n    \u2514\u2500\u2500 test_basic_module_plugin.{so,dylib}\n```"}, {"execs": [], "md": "## Step 3: Run the daemon and call a module\n\nStart the daemon in the background, then use client subcommands to interact\nwith it. Output from the daemon process is captured in `session/logs/daemon.log`."}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session daemon start --detach", "exit_code": 0, "kind": "run", "note": "", "output": "Daemon started (pid 10773)\nLogs: /home/runner/work/_temp/doctest-test-3sylohax/./session/logs/daemon.log\n", "status": "pass"}], "md": "### 3.1 Start the daemon\n\nStart logosctl in daemon mode in the background, capturing output to\n`session/logs/daemon.log`. That name is a symlink to the\ncurrent session's timestamped file, so it always points at the live log:\n\n```bash\nlogosctl daemon start --detach\n```\n\n`daemon start --detach` returns only once the daemon is accepting\ncommands (`-D` is the shorthand for `daemon start`). The client\ncommands in the following steps connect to this running process via\nthe dial spec the daemon wrote into this session \u2014 `session/client/`,\nbecause every command here passes `--config-dir ./session`. Without\nit they would use `~/.logosctl/` instead."}, {"execs": [{"cmd": "sleep 3", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 3\n```"}, {"execs": [{"cmd": "cat session/logs/daemon.log", "exit_code": 0, "kind": "run", "note": "", "output": "[2026-08-21 01:30:35.597] [info] Inter-module access enforcement is OFF (no access policy set): any loaded module may call any other\n[2026-08-21 01:30:35.598] [info] [logos] Granting host services to 'capability_module': token_registry,token_delivery\n[2026-08-21 01:30:35.612] [out] [capability_module] [2026-08-21 01:30:35.612] [info] Granting host services to capability_module: [\"token_registry\",\"token_delivery\"]\n[2026-08-21 01:30:35.839] [info] [logos] Module loaded: capability_module\n[2026-08-21 01:30:35.843] [info] [logos] Module loaded: package_manager\n[2026-08-21 01:30:35.845] [info] [logos] Module loaded: package_downloader\nLogosctl daemon started (pid 10773, instance 64c168accc91)\nDaemon state: /home/runner/work/_temp/doctest-test-3sylohax/./session/daemon/state.json\nLocal client config: /home/runner/work/_temp/doctest-test-3sylohax/./session/client/config.yaml\n", "status": "pass"}], "md": "### 3.2 Inspect the startup log\n\nReview the daemon's startup output:\n\n```bash\ncat session/logs/daemon.log\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session daemon status --human\necho '# --- JSON ---'\n./logos/bin/logosctl --config-dir ./session daemon status --json\n", "exit_code": 0, "kind": "run", "note": "", "output": "Logosctl Daemon\n  Status:       running\n  PID:          10773\n  Uptime:       0s\n  Version:      v1.0.0\n\nModules: 3 loaded, 0 crashed, 1 not loaded\n  test_basic_module   v1.0.0  not_loaded  -\n  package_manager     v1.0.0  loaded      4s\n  package_downloader  v1.0.0  loaded      4s\n  capability_module   v1.0.0  loaded      4s\n# --- JSON ---\n{\"daemon\":{\"pid\":10773,\"status\":\"running\",\"version\":\"1.0.0\"},\"modules\":[{\"name\":\"test_basic_module\",\"status\":\"not_loaded\",\"version\":\"1.0.0\"},{\"name\":\"package_manager\",\"status\":\"loaded\",\"uptime_seconds\":4,\"version\":\"1.0.0\"},{\"name\":\"package_downloader\",\"status\":\"loaded\",\"uptime_seconds\":4,\"version\":\"1.0.0\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":4,\"version\":\"1.0.0\"}],\"modules_summary\":{\"crashed\":0,\"loaded\":3,\"not_loaded\":1}}\n", "status": "pass"}], "md": "### 3.3 Check daemon status\n\nVerify the daemon is running and inspect its health. Every client\ncommand renders a human-readable form on a terminal and JSON when its\noutput is piped; `--human` and `--json` force either form explicitly:\n\n```bash\nlogosctl daemon status            # human-readable (default on a TTY)\nlogosctl daemon status --json     # JSON (default when piped)\n```\n\nHuman-readable form:\n\n```text\nLogosctl Daemon\n  Status:       running\n  PID:          12345\n  Uptime:       6s\n  Version:      v0.2.0\n\nModules: 1 loaded, 0 crashed, 1 not loaded\n  test_basic_module  v1.0.0  not_loaded  -\n  capability_module  v1.0.0  loaded      6s\n```\n\nJSON form:\n\n```json\n{\"daemon\":{\"status\":\"running\",\"pid\":12345,\"uptime_seconds\":6,\"version\":\"0.2.0\"},\n \"modules_summary\":{\"loaded\":1,\"crashed\":0,\"not_loaded\":1},\n \"modules\":[{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":6,\"version\":\"1.0.0\"},\n            {\"name\":\"test_basic_module\",\"status\":\"not_loaded\",\"version\":\"1.0.0\"}]}\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session module ls --human\necho '# --- JSON ---'\n./logos/bin/logosctl --config-dir ./session module ls --json\n", "exit_code": 0, "kind": "run", "note": "", "output": "NAME                VERSION  STATUS      UPTIME\ntest_basic_module   v1.0.0   not_loaded  -\npackage_manager     v1.0.0   loaded      4s\npackage_downloader  v1.0.0   loaded      4s\ncapability_module   v1.0.0   loaded      4s\n# --- JSON ---\n[{\"name\":\"test_basic_module\",\"status\":\"not_loaded\",\"version\":\"1.0.0\"},{\"name\":\"package_manager\",\"status\":\"loaded\",\"uptime_seconds\":4,\"version\":\"1.0.0\"},{\"name\":\"package_downloader\",\"status\":\"loaded\",\"uptime_seconds\":4,\"version\":\"1.0.0\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":4,\"version\":\"1.0.0\"}]\n", "status": "pass"}], "md": "### 3.4 List discovered modules\n\nList modules visible in the scan directory, in both forms:\n\n```bash\nlogosctl module ls            # human-readable table\nlogosctl module ls --json     # JSON\n```\n\nHuman-readable table (the `NAME`/`VERSION` columns size to fit):\n\n```text\nNAME               VERSION  STATUS      UPTIME\ntest_basic_module  v1.0.0   not_loaded  -\ncapability_module  v1.0.0   loaded      6s\n```\n\nThe same data as JSON \u2014 `version` is present even for `not_loaded`\nmodules (it comes from each module's metadata, not the running process):\n\n```json\n[{\"name\":\"test_basic_module\",\"status\":\"not_loaded\",\"version\":\"1.0.0\"},\n {\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":6,\"version\":\"1.0.0\"}]\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session module load test_basic_module", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[],\"module\":\"test_basic_module\",\"status\":\"ok\",\"version\":\"1.0.0\"}\n", "status": "pass"}], "md": "### 3.5 Load the module\n\nLoad `test_basic_module` into the running daemon:\n\n```bash\nlogosctl module load test_basic_module\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session daemon status --human\necho '# --- JSON ---'\n./logos/bin/logosctl --config-dir ./session daemon status --json\n", "exit_code": 0, "kind": "run", "note": "", "output": "Logosctl Daemon\n  Status:       running\n  PID:          10773\n  Uptime:       0s\n  Version:      v1.0.0\n\nModules: 4 loaded, 0 crashed, 0 not loaded\n  test_basic_module   v1.0.0  loaded      0s\n  package_manager     v1.0.0  loaded      4s\n  package_downloader  v1.0.0  loaded      4s\n  capability_module   v1.0.0  loaded      4s\n# --- JSON ---\n{\"daemon\":{\"pid\":10773,\"status\":\"running\",\"version\":\"1.0.0\"},\"modules\":[{\"name\":\"test_basic_module\",\"status\":\"loaded\",\"uptime_seconds\":0,\"version\":\"1.0.0\"},{\"name\":\"package_manager\",\"status\":\"loaded\",\"uptime_seconds\":4,\"version\":\"1.0.0\"},{\"name\":\"package_downloader\",\"status\":\"loaded\",\"uptime_seconds\":4,\"version\":\"1.0.0\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":4,\"version\":\"1.0.0\"}],\"modules_summary\":{\"crashed\":0,\"loaded\":4,\"not_loaded\":0}}\n", "status": "pass"}], "md": "### 3.6 Confirm the module is now loaded\n\nRe-run `status`. The module that was `not_loaded` before now reports\n`loaded`, and once loaded it carries an uptime (shown in both forms):\n\n```bash\nlogosctl daemon status\nlogosctl daemon status --json\n```"}, {"execs": [{"cmd": "dpid=$(./logos/bin/logosctl --config-dir ./session daemon status --json | python3 -c \"import json,sys;print(json.load(sys.stdin)['daemon']['pid'])\")\ndpgid=$(ps -o pgid= -p \"$dpid\" | tr -d ' ')\nresult=NO_MODULE_SUBPROCESS\nfor hp in $(pgrep -f logos_host); do\n  [ \"$(ps -o ppid= -p \"$hp\" | tr -d ' ')\" = \"$dpid\" ] || continue\n  hpgid=$(ps -o pgid= -p \"$hp\" | tr -d ' ')\n  if [ \"$hp\" = \"$hpgid\" ] && [ \"$hpgid\" != \"$dpgid\" ]; then\n    result=MODULE_SUBPROCESS_ISOLATED; break\n  else\n    result=MODULE_SUBPROCESS_SHARES_LAUNCHER_GROUP\n  fi\ndone\necho \"daemon_pid=$dpid daemon_pgid=$dpgid -> $result\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "daemon_pid=10773 daemon_pgid=10773 -> MODULE_SUBPROCESS_ISOLATED\n", "status": "pass"}], "md": "### 3.7 Module subprocesses are isolated from the launcher's process group\n\nWith a module loaded, the daemon is running it in its own subprocess\n(`logos_host`). The daemon itself stays in the **foreground**, in its\nlauncher's process group, so a shell, `systemd`, or Docker manages it\nnormally \u2014 but each `logos_host` must lead its **own** process group, not\nstay in the daemon's (i.e. the launcher's). Otherwise tearing the module\ntree down on shutdown, or any process-group signal aimed at the daemon,\nleaks into the launcher and can kill the shell driving it (a teardown\nstep dying with exit `-15` on Linux).\n\nWe take a module subprocess (a `logos_host` child of the daemon) and\nassert it is its **own** process-group leader (`pgid == pid`) and is\n**not** in the daemon's group.\n\n```bash\n# a module subprocess must lead its own group: pgid == pid, != daemon\ndpid=$(logosctl daemon status --json | jq .daemon.pid)\nhost=$(pgrep -P \"$dpid\" -f logos_host | head -1)\n[ \"$host\" = \"$(ps -o pgid= -p \"$host\" | tr -d ' ')\" ] && echo ISOLATED\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session module show test_basic_module --human\necho '# --- JSON ---'\n./logos/bin/logosctl --config-dir ./session module show test_basic_module --json\n", "exit_code": 0, "kind": "run", "note": "", "output": "Name:          test_basic_module\nVersion:       v1.0.0\nStatus:        loaded\nPID:           0\nUptime:        0s\n\nMethods:\n  doNothing() -> void\n  doNothingWithArgs(a: QString, b: qlonglong) -> void\n  returnTrue() -> bool\n  returnFalse() -> bool\n  isPositive(value: qlonglong) -> bool\n  returnInt() -> qlonglong\n  addInts(a: qlonglong, b: qlonglong) -> qlonglong\n  stringLength(s: QString) -> qlonglong\n  returnString() -> QString\n  echo(input: QString) -> QString\n  concat(a: QString, b: QString) -> QString\n  successResult() -> LogosResult\n  errorResult() -> LogosResult\n  resultWithMap() -> LogosResult\n  resultWithList() -> LogosResult\n  validateInput(input: QString) -> LogosResult\n  returnVariantInt() -> QVariant\n  returnVariantString() -> QVariant\n  returnVariantMap() -> QVariant\n  returnVariantList() -> QVariant\n  returnJsonArray() -> QVariantList\n  makeJsonArray(a: QString, b: QString) -> QVariantList\n  returnStringList() -> QStringList\n  splitString(input: QString) -> QStringList\n  echoInt(n: qlonglong) -> qlonglong\n  echoBool(b: bool) -> bool\n  joinStrings(list: QStringList) -> QString\n  byteArraySize(data: QByteArray) -> qlonglong\n  urlToString(url: QString) -> QString\n  noArgs() -> QString\n  oneArg(a: QString) -> QString\n  twoArgs(a: QString, b: qlonglong) -> QString\n  threeArgs(a: QString, b: qlonglong, c: bool) -> QString\n  fourArgs(a: QString, b: qlonglong, c: bool, d: QString) -> QString\n  fiveArgs(a: QString, b: qlonglong, c: bool, d: QString, e: qlonglong) -> QString\n  emitTestEvent(data: QString) -> void\n  emitMultiArgEvent(name: QString, count: qlonglong) -> void\n  echoWithDelay(value: QString, delayMs: qlonglong) -> QString\n  crashOnDemand() -> void\n\nEvents:\n  testEvent(data: QString)\n  multiArgEvent(name: QString, count: qlonglong)\n# --- JSON ---\n{\"dependencies\":[],\"dependents\":[],\"events\":[{\"name\":\"testEvent\",\"parameters\":[{\"name\":\"data\",\"type\":\"QString\"}],\"signature\":\"testEvent(QString)\",\"type\":\"event\"},{\"name\":\"multiArgEvent\",\"parameters\":[{\"name\":\"name\",\"type\":\"QString\"},{\"name\":\"count\",\"type\":\"qlonglong\"}],\"signature\":\"multiArgEvent(QString,qlonglong)\",\"type\":\"event\"}],\"methods\":[{\"isInvokable\":true,\"name\":\"doNothing\",\"returnType\":\"void\",\"signature\":\"doNothing()\"},{\"isInvokable\":true,\"name\":\"doNothingWithArgs\",\"parameters\":[{\"name\":\"a\",\"type\":\"QString\"},{\"name\":\"b\",\"type\":\"qlonglong\"}],\"returnType\":\"void\",\"signature\":\"doNothingWithArgs(QString,qlonglong)\"},{\"isInvokable\":true,\"name\":\"returnTrue\",\"returnType\":\"bool\",\"signature\":\"returnTrue()\"},{\"isInvokable\":true,\"name\":\"returnFalse\",\"returnType\":\"bool\",\"signature\":\"returnFalse()\"},{\"isInvokable\":true,\"name\":\"isPositive\",\"parameters\":[{\"name\":\"value\",\"type\":\"qlonglong\"}],\"returnType\":\"bool\",\"signature\":\"isPositive(qlonglong)\"},{\"isInvokable\":true,\"name\":\"returnInt\",\"returnType\":\"qlonglong\",\"signature\":\"returnInt()\"},{\"isInvokable\":true,\"name\":\"addInts\",\"parameters\":[{\"name\":\"a\",\"type\":\"qlonglong\"},{\"name\":\"b\",\"type\":\"qlonglong\"}],\"returnType\":\"qlonglong\",\"signature\":\"addInts(qlonglong,qlonglong)\"},{\"isInvokable\":true,\"name\":\"stringLength\",\"parameters\":[{\"name\":\"s\",\"type\":\"QString\"}],\"returnType\":\"qlonglong\",\"signature\":\"stringLength(QString)\"},{\"isInvokable\":true,\"name\":\"returnString\",\"returnType\":\"QString\",\"signature\":\"returnString()\"},{\"isInvokable\":true,\"name\":\"echo\",\"parameters\":[{\"name\":\"input\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"echo(QString)\"},{\"isInvokable\":true,\"name\":\"concat\",\"parameters\":[{\"name\":\"a\",\"type\":\"QString\"},{\"name\":\"b\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"concat(QString,QString)\"},{\"isInvokable\":true,\"name\":\"successResult\",\"returnType\":\"LogosRe

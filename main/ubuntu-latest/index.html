bool)\"},{\"isInvokable\":true,\"name\":\"joinStrings\",\"parameters\":[{\"name\":\"list\",\"type\":\"QStringList\"}],\"returnType\":\"QString\",\"signature\":\"joinStrings(QStringList)\"},{\"isInvokable\":true,\"name\":\"byteArraySize\",\"parameters\":[{\"name\":\"data\",\"type\":\"QByteArray\"}],\"returnType\":\"qlonglong\",\"signature\":\"byteArraySize(QByteArray)\"},{\"isInvokable\":true,\"name\":\"urlToString\",\"parameters\":[{\"name\":\"url\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"urlToString(QString)\"},{\"isInvokable\":true,\"name\":\"noArgs\",\"returnType\":\"QString\",\"signature\":\"noArgs()\"},{\"isInvokable\":true,\"name\":\"oneArg\",\"parameters\":[{\"name\":\"a\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"oneArg(QString)\"},{\"isInvokable\":true,\"name\":\"twoArgs\",\"parameters\":[{\"name\":\"a\",\"type\":\"QString\"},{\"name\":\"b\",\"type\":\"qlonglong\"}],\"returnType\":\"QString\",\"signature\":\"twoArgs(QString,qlonglong)\"},{\"isInvokable\":true,\"name\":\"threeArgs\",\"parameters\":[{\"name\":\"a\",\"type\":\"QString\"},{\"name\":\"b\",\"type\":\"qlonglong\"},{\"name\":\"c\",\"type\":\"bool\"}],\"returnType\":\"QString\",\"signature\":\"threeArgs(QString,qlonglong,bool)\"},{\"isInvokable\":true,\"name\":\"fourArgs\",\"parameters\":[{\"name\":\"a\",\"type\":\"QString\"},{\"name\":\"b\",\"type\":\"qlonglong\"},{\"name\":\"c\",\"type\":\"bool\"},{\"name\":\"d\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"fourArgs(QString,qlonglong,bool,QString)\"},{\"isInvokable\":true,\"name\":\"fiveArgs\",\"parameters\":[{\"name\":\"a\",\"type\":\"QString\"},{\"name\":\"b\",\"type\":\"qlonglong\"},{\"name\":\"c\",\"type\":\"bool\"},{\"name\":\"d\",\"type\":\"QString\"},{\"name\":\"e\",\"type\":\"qlonglong\"}],\"returnType\":\"QString\",\"signature\":\"fiveArgs(QString,qlonglong,bool,QString,qlonglong)\"},{\"isInvokable\":true,\"name\":\"emitTestEvent\",\"parameters\":[{\"name\":\"data\",\"type\":\"QString\"}],\"returnType\":\"void\",\"signature\":\"emitTestEvent(QString)\"},{\"isInvokable\":true,\"name\":\"emitMultiArgEvent\",\"parameters\":[{\"name\":\"name\",\"type\":\"QString\"},{\"name\":\"count\",\"type\":\"qlonglong\"}],\"returnType\":\"void\",\"signature\":\"emitMultiArgEvent(QString,qlonglong)\"},{\"isInvokable\":true,\"name\":\"echoWithDelay\",\"parameters\":[{\"name\":\"value\",\"type\":\"QString\"},{\"name\":\"delayMs\",\"type\":\"qlonglong\"}],\"returnType\":\"QString\",\"signature\":\"echoWithDelay(QString,qlonglong)\"},{\"isInvokable\":true,\"name\":\"crashOnDemand\",\"returnType\":\"void\",\"signature\":\"crashOnDemand()\"}],\"name\":\"test_basic_module\",\"status\":\"loaded\",\"uptime_seconds\":0,\"version\":\"1.0.0\"}\n", "status": "pass"}], "md": "### 3.8 Inspect the module with module show\n\n`module show` (`module info` is accepted too) shows a single module's\nstatus and the `Q_INVOKABLE` methods it exposes \u2014 the same methods you\ncan `call`:\n\n```bash\nlogosctl module show test_basic_module\nlogosctl module show test_basic_module --json\n```\n\nHuman-readable form (methods list trimmed):\n\n```text\nName:          test_basic_module\nVersion:       v1.0.0\nStatus:        loaded\nUptime:        6s\n\nMethods:\n  returnTrue() -> bool\n  addInts(a: int, b: int) -> int\n  ...\n```\n\nJSON form \u2014 version, dependencies, dependents, uptime, and the full\nmethod/event interface in one object:\n\n```json\n{\"name\":\"test_basic_module\",\"version\":\"1.0.0\",\"status\":\"loaded\",\n \"uptime_seconds\":6,\"dependencies\":[],\"dependents\":[],\n \"methods\":[{\"name\":\"returnTrue\",\"returnType\":\"bool\",\"signature\":\"returnTrue()\"}, ...],\n \"events\":[]}\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session stats --human\necho '# --- JSON ---'\n./logos/bin/logosctl --config-dir ./session stats --json\n", "exit_code": 0, "kind": "run", "note": "", "output": "MODULE              PID     CPU%    MEMORY\ntest_basic_module   0       0.0%    23.6 MB\npackage_downloader  0       0.0%    23.7 MB\npackage_manager     0       0.0%    24.1 MB\ncapability_module   0       0.0%    23.8 MB\n# --- JSON ---\n[{\"cpu_percent\":0.0,\"cpu_time_seconds\":0.0,\"memory_mb\":23.56640625,\"name\":\"test_basic_module\"},{\"cpu_percent\":0.0,\"cpu_time_seconds\":0.0,\"memory_mb\":23.73828125,\"name\":\"package_downloader\"},{\"cpu_percent\":0.0,\"cpu_time_seconds\":0.0,\"memory_mb\":24.10546875,\"name\":\"package_manager\"},{\"cpu_percent\":0.0,\"cpu_time_seconds\":0.0,\"memory_mb\":23.78515625,\"name\":\"capability_module\"}]\n", "status": "pass"}], "md": "### 3.9 Check resource usage with stats\n\n`stats` reports per-module resource usage (process id, CPU, memory) for\nthe modules the daemon is running:\n\n```bash\nlogosctl stats\nlogosctl stats --json\n```\n\nHuman-readable table:\n\n```text\nMODULE             PID     CPU%    MEMORY\ntest_basic_module  12350   0.0%    18.9 MB\ncapability_module  12340   4.6%    19.5 MB\n```\n\nJSON form:\n\n```json\n[{\"name\":\"test_basic_module\",\"cpu_percent\":0.0,\"cpu_time_seconds\":1.02,\"memory_mb\":18.9},\n {\"name\":\"capability_module\",\"cpu_percent\":4.6,\"cpu_time_seconds\":1.10,\"memory_mb\":19.5}]\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call test_basic_module returnTrue --human\necho '# --- JSON ---'\n./logos/bin/logosctl --config-dir ./session call test_basic_module returnTrue --json\n", "exit_code": 0, "kind": "run", "note": "", "output": "true\n# --- JSON ---\n{\"method\":\"returnTrue\",\"module\":\"test_basic_module\",\"result\":true,\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.10 Call methods\n\nInvoke methods on the loaded module, in both forms:\n\n```bash\nlogosctl call test_basic_module returnTrue\nlogosctl call test_basic_module returnTrue --json\n```\n\nThe human-readable form prints just the return value:\n\n```text\ntrue\n```\n\nThe JSON form wraps it with the call's metadata:\n\n```json\n{\"status\":\"ok\",\"module\":\"test_basic_module\",\"method\":\"returnTrue\",\"result\":true}\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call test_basic_module addInts 2 3", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"addInts\",\"module\":\"test_basic_module\",\"result\":5,\"status\":\"ok\"}\n", "status": "pass"}], "md": "```bash\nlogosctl call test_basic_module addInts 2 3\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call test_basic_module echo hello", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"echo\",\"module\":\"test_basic_module\",\"result\":\"hello\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "```bash\nlogosctl call test_basic_module echo hello\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call test_basic_module returnString", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"returnString\",\"module\":\"test_basic_module\",\"result\":\"test_basic_module\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "```bash\nlogosctl call test_basic_module returnString\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session module unload test_basic_module", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependents_unloaded\":[],\"module\":\"test_basic_module\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.11 Unload the module\n\nRemove `test_basic_module` from the daemon:\n\n```bash\nlogosctl module unload test_basic_module\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call test_basic_module returnTrue || true", "exit_code": 0, "kind": "run", "note": "", "output": "{\"code\":\"METHOD_FAILED\",\"message\":\"Call to test_basic_module.returnTrue failed.\",\"status\":\"error\"}\n", "status": "pass"}], "md": "### 3.12 Confirm the unload took effect\n\nA `call` against the now-unloaded module is rejected \u2014 the daemon reports\nthat it is not loaded:\n\n```bash\nlogosctl call test_basic_module returnTrue\n```\n\n> The trailing `|| true` lets the doc-test continue past the expected\n> non-zero exit code so we can assert on the error message."}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session module reload test_basic_module", "exit_code": 0, "kind": "run", "note": "", "output": "{\"action\":\"reload\",\"module\":\"test_basic_module\",\"previous_status\":\"not_loaded\",\"status\":\"loaded\",\"version\":\"1.0.0\"}\n", "status": "pass"}], "md": "### 3.13 Reload the module\n\n`module reload` unloads and re-loads a module in one step (handy after\nrebuilding it). The module is loaded and callable again afterwards:\n\n```bash\nlogosctl module reload test_basic_module\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call test_basic_module addInts 40 2", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"addInts\",\"module\":\"test_basic_module\",\"result\":42,\"status\":\"ok\"}\n", "status": "pass"}], "md": "```bash\nlogosctl call test_basic_module addInts 40 2\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session daemon stop", "exit_code": 0, "kind": "run", "note": "", "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.14 Stop the daemon\n\nShut down the daemon cleanly:\n\n```bash\nlogosctl daemon stop\n```\n\nThe daemon removes its state file and exits. You can also stop it with\n`Ctrl+C` if running in the foreground, or by sending `SIGTERM` to the\ndaemon PID shown in `logosctl daemon status`."}, {"execs": [{"cmd": "sleep 2", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 2\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session daemon status || true", "exit_code": 0, "kind": "run", "note": "", "output": "{\"daemon\":{\"instance_id\":\"64c168accc91\",\"status\":\"not_running\",\"version\":\"pre-release-5200623\"},\"modules\":[],\"rpc_error\":\"core_service not reachable\"}\n", "status": "pass"}], "md": "### 3.15 Confirm the daemon has stopped\n\nA final `status` confirms the shutdown. With no daemon running, the\nclient reports `not_running` instead of connecting (and exits non-zero,\nso we add `|| true` to let the doc-test assert on the output):\n\n```bash\nlogosctl daemon status\n```"}, {"execs": [{"cmd": "mkdir -p ./crashcfg/modules && cp -RL ./session/modules/. ./crashcfg/modules/\n./logos/bin/logosctl --config-dir ./crashcfg -D > crash.log 2>&1 &\nsleep 5\ndpid=$(./logos/bin/logosctl --config-dir ./crashcfg status --json | python3 -c \"import json,sys;print(json.load(sys.stdin)['daemon']['pid'])\")\nworker=\"\"\nfor h in $(pgrep -f logos_host); do\n  [ \"$(ps -o ppid= -p \"$h\" | tr -d ' ')\" = \"$dpid\" ] && { worker=\"$h\"; break; }\ndone\necho \"daemon=$dpid worker=$worker\"\nkill -9 \"$dpid\"\nresult=LEAKED\nfor i in $(seq 1 10); do\n  kill -0 \"$worker\" 2>/dev/null || { result=WORKER_CLEANED_UP; break; }\n  sleep 1\ndone\necho \"RESULT=$result\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "daemon=10834 worker=10838\nRESULT=WORKER_CLEANED_UP\n", "status": "pass"}], "md": "### 3.16 A worker is not orphaned if the daemon crashes\n\nThe flip side of detaching workers into their own process group: a\nmodule subprocess must not be left **running** if the daemon dies\n*without* cleaning it up. We start a throwaway daemon, **hard-kill** it\n(`SIGKILL`, so no graceful teardown runs), and confirm its module\nsubprocess exits on its own \u2014 via `PR_SET_PDEATHSIG` on Linux and a\n`getppid` watchdog on other platforms. (Graceful shutdown, above, still\nreaps workers per-PID; this covers the crash path.)\n\n```bash\n# hard-kill the daemon; its module subprocess must exit on its own\nlogosctl daemon start --detach        # (throwaway session)\nkill -9 \"$(logosctl daemon status --json | jq .daemon.pid)\"\n```"}]}, {"meta": {"name": "Installing a Local .lgx with logosctl", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Installing a Local .lgx with logosctl\n\n[`logosctl-packages`](logosctl-packages.md) installs from the public\ncatalog. This one never touches it.\n\nA `.lgx` you already have \u2014 one you just built, one a colleague sent you,\none pulled from a private release \u2014 installs straight from disk. The catalog\nis never consulted, no key has to be trusted, and nothing is fetched: the\nfile on disk *is* the package, and the daemon reads it where it lies.\n\nThat makes this the doc-test to read if you are developing a module, because\nthe local file is the only thing you have. It is also fully hermetic, so it\nruns offline once the two builds are done.\n\nThree spellings do the same thing:\n\n| Command | When |\n|---|---|\n| `logosctl install ./mod.lgx` | A path. Anything ending in `.lgx` is read as a file. |\n| `logosctl install --file ./mod.lgx` | The same, said explicitly. |\n| `logosctl install --dir ./drop` | Every `.lgx` in a directory, in one operation. |\n\nThe rules from the catalog doc-test still hold here \u2014 **installing does not\nload**, and the daemon does not need restarting afterwards.\n\n**What you'll build:** A logosctl session with a locally built .lgx installed from disk, loaded, and called \u2014 without consulting a catalog or the network.\n\n**What you'll learn:**\n\n- How to install a `.lgx` that is already on disk, by path, by `--file`, and by `--dir`\n- Why an argument ending in `.lgx` is read as a path rather than a catalog name\n- How to inspect a `.lgx` before installing it\n- Why catalog names and local files cannot be combined in one command\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`"}, {"execs": [], "md": "## Step 1: Build logosctl and a package to install\n\nTwo builds. The first is the CLI; the second is a real module packaged\nas a `.lgx` \u2014 `test_basic_module`, which exposes an `echo` method the\nlast step calls to prove the installed files actually run.\n\nThis uses the **dev** build (`#ctl`) rather than the portable bundle,\nbecause a nix-built `.lgx` carries a `-dev` variant. A portable\n`logosctl` looks for the unsuffixed variant and would correctly refuse\nthis package \u2014 that mismatch is the variant contract working, not a\nfailure. The\n[catalog doc-test](logosctl-packages.md) is the other way round: released\npackages are portable, so it builds the portable bundle."}, {"execs": [{"cmd": "nix build \"github:logos-co/logos-logoscore-cli/5200623eeff8a96b3e46657fbf2ef54d40d101f4#ctl\" -o ctl", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 1.1 Build the CLI\n\n```bash\nnix build 'github:logos-co/logos-logoscore-cli#ctl' -o ctl\n```"}, {"execs": [{"cmd": "SYS=$(nix eval --impure --raw --expr builtins.currentSystem)\nnix build \"github:logos-co/logos-test-modules#modules.$SYS.test_basic_module.lgx\" -o test-lgx\n# Copy it out of the read-only store so the rest of the doc-test can\n# treat it like any other file sitting in a directory.\ncp test-lgx/*.lgx ./test_basic_module.lgx\nchmod +w ./test_basic_module.lgx\nls -l ./test_basic_module.lgx\n", "exit_code": 0, "kind": "run", "note": "", "output": "-rw-r--r-- 1 runner runner 959587 Aug 21 01:37 ./test_basic_module.lgx\n", "status": "pass"}], "md": "### 1.2 Build a module as a .lgx\n\nThe `.lgx` lives under a per-system attribute, so the current system\nis resolved first. From inside a module's own clone this is just\n`nix build '.#lgx'` \u2014 which is what you would actually run while\ndeveloping one.\n\n```bash\n# In a module's own checkout:\nnix build '.#lgx' -o test-lgx\ncp test-lgx/*.lgx ./test_basic_module.lgx\n```"}, {"execs": [], "md": "## Step 2: Start a session\n\nA session is one directory holding config, installed packages and\nper-module state. Note what is *not* done here: no `catalog add`, no\n`catalog refresh`, no keys added. A local install needs none of it \u2014\nthe default catalog stays exactly as it was, unread."}, {"execs": [{"cmd": "./ctl/bin/logosctl --config-dir ./session daemon start --detach", "exit_code": 0, "kind": "run", "note": "", "output": "Daemon started (pid 10935)\nLogs: /home/runner/work/_temp/doctest-test-9qf9hr1k/./session/logs/daemon.log\n", "status": "pass"}], "md": "### 2.1 Start the daemon\n\n`--detach` returns only once the daemon is accepting commands, so\nthe next command cannot race the boot.\n\n```bash\nlogosctl --config-dir ./session daemon start --detach\n```"}, {"execs": [{"cmd": "./ctl/bin/logosctl --human --config-dir ./session package ls", "exit_code": 0, "kind": "run", "note": "", "output": "NAME                         VERSION      TYPE       SOURCE\npackage_downloader           1.0.0        core       embedded\npackage_manager              1.0.0        core       embedded\n", "status": "pass"}], "md": "### 2.2 Nothing is installed yet\n\nThe two `embedded` entries are the package modules that ship inside\nthe binary. Anything this doc-test installs shows up alongside them\nas `user`.\n\n```bash\nlogosctl package ls\n```"}, {"execs": [], "md": "## Step 3: Look before you install\n\n`package show` takes a path as readily as a name, so a `.lgx` can be\ninspected before anything is written to the session. This is the step\nworth taking with a file you did not build yourself: it reports the\nsignature status, and whether some version of it is already installed."}, {"execs": [{"cmd": "./ctl/bin/logosctl --human --config-dir ./session package show ./test_basic_module.lgx", "exit_code": 0, "kind": "run", "note": "", "output": "name:                test_basic_module\nversion:             1.0.0\ntype:                core\ncategory:            testing\ndescription:         Test module exercising every SDK parameter type, return type, argument count, and event pattern\nsignatureStatus:     unsigned\nisAlreadyInstalled:  false\ninstalledVersion:    \n", "status": "pass"}], "md": "### 3.1 Inspect the file\n\n```bash\nlogosctl package show ./test_basic_module.lgx\n```"}, {"execs": [{"cmd": "./ctl/bin/logosctl --human --config-dir ./session package install ./test_basic_module.lgx --dry-run", "exit_code": 0, "kind": "run", "note": "", "output": "The following changes will be made (install):\n  install    test_basic_module 1.0.0\n(dry run \u2014 nothing was changed)\n", "status": "pass"}], "md": "### 3.2 Preview the install\n\n`--dry-run` plans the operation and stops. The package is read off\ndisk to do it, which is why the plan can name a version for\nsomething no catalog has ever heard of.\n\n```bash\nlogosctl package install ./test_basic_module.lgx --dry-run\n```"}, {"execs": [], "md": "## Step 4: Install it\n\nThe path is a positional argument \u2014 `install` reads anything ending in\n`.lgx` as a file, because a catalog name cannot carry that suffix. Being\nexplicit with `--file` does exactly the same thing.\n\n`-y` is required in a script: a mutating command with no `-y` and no\nterminal to prompt on is refused rather than assumed-yes."}, {"execs": [{"cmd": "./ctl/bin/logosctl --human --config-dir ./session install ./test_basic_module.lgx -y", "exit_code": 0, "kind": "run", "note": "", "output": "The following changes will be made (install):\n  install    test_basic_module 1.0.0\nInstalled: test_basic_module\nLoad with: logosctl module load test_basic_module\n", "status": "pass"}], "md": "### 4.1 Install from the local file\n\n```bash\nlogosctl install ./test_basic_module.lgx -y\n```"}, {"execs": [{"cmd": "./ctl/bin/logosctl --human --config-dir ./session package ls", "exit_code": 0, "kind": "run", "note": "", "output": "NAME                         VERSION      TYPE       SOURCE\npackage_downloader           1.0.0        core       embedded\npackage_manager              1.0.0        core       embedded\ntest_basic_module            1.0.0        core       user\n", "status": "pass"}], "md": "### 4.2 It is installed into the session\n\nIts source is `user` \u2014 it lives in the session's writable `modules/`\ndirectory, unlike the `embedded` package modules that ship inside\nthe binary.\n\n```bash\nlogosctl package ls\n```"}, {"execs": [], "md": "## Step 5: It really runs\n\nInstalling put files on disk and stopped there. Loading is the separate,\nexplicit act \u2014 and calling a method is what proves the installed copy is\na working module rather than a well-formed archive."}, {"execs": [{"cmd": "./ctl/bin/logosctl --human --config-dir ./session module load test_basic_module", "exit_code": 0, "kind": "run", "note": "", "output": "Loaded module: test_basic_module (v1.0.0)\n", "status": "pass"}], "md": "### 5.1 Load the module\n\n```bash\nlogosctl module load test_basic_module\n```"}, {"execs": [{"cmd": "./ctl/bin/logosctl --human --config-dir ./session call test_basic_module echo hello", "exit_code": 0, "kind": "run", "note": "", "output": "hello\n", "status": "pass"}], "md": "### 5.2 Call a method on it\n\n```bash\nlogosctl call test_basic_module echo hello\n```"}, {"execs": [], "md": "## Step 6: A directory of packages\n\n`--dir` takes every `.lgx` in a directory as one operation \u2014 the shape\nyou want when a build drops several packages side by side.\n\nRe-running it over a package that is already installed is a\n**reinstall**, and because `test_basic_module` is loaded right now, the\nplan says so: it has to be stopped and restarted around the file\nreplacement."}, {"execs": [{"cmd": "mkdir -p drop\ncp ./test_basic_module.lgx drop/\nls drop\n", "exit_code": 0, "kind": "run", "note": "", "output": "test_basic_module.lgx\n", "status": "pass"}], "md": "### 6.1 Drop the package in a directory\n\n```bash\ncp ./test_basic_module.lgx drop/\n```"}, {"execs": [{"cmd": "./ctl/bin/logosctl --human --config-dir ./session package install --dir ./drop --dry-run", "exit_code": 0, "kind": "run", "note": "", "output": "The following changes will be made (install):\n  reinstall  test_basic_module 1.0.0 -> 1.0.0\nThese running modules will be stopped and restarted: test_basic_module\n(dry run \u2014 nothing was changed)\n", "status": "pass"}], "md": "### 6.2 Plan an install from the directory\n\n```bash\nlogosctl package install --dir ./drop --dry-run\n```"}, {"execs": [], "md": "## Step 7: What is refused, and why\n\nTwo refusals are worth seeing, because both replaced a silent wrong\nanswer.\n\nA local file and a catalog name resolve by completely different rules \u2014\none is read off disk, the other is looked up and downloaded \u2014 and the\ndaemon plans one way or the other. A request carrying both used to\ninstall the files and quietly drop the names. It is now refused, so\n\"install these four things\" never means \"install two of them\".\n\nA path that does not exist is reported as a missing file. Before, it\nfell through to the catalog resolver and came back as `no candidate\nmatches './typo.lgx'`, which reads like the package was rejected rather\nthan never found."}, {"execs": [{"cmd": "out=$(./ctl/bin/logosctl --human --config-dir ./session \\\n        package install some_catalog_package ./test_basic_module.lgx -y 2>&1) && {\n  echo \"UNEXPECTED: mixing was accepted\"; exit 1; }\necho \"$out\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "Error: Cannot mix catalog packages with local .lgx files in one install. Run them as separate commands.\n", "status": "pass"}], "md": "### 7.1 Mixing a name and a file is refused\n\n```bash\nlogosctl package install some_catalog_package ./test_basic_module.lgx -y\n```"}, {"execs": [{"cmd": "out=$(./ctl/bin/logosctl --human --config-dir ./session \\\n        package install ./typo.lgx -y 2>&1) && {\n  echo \"UNEXPECTED: a missing file was accepted\"; exit 1; }\necho \"$out\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "Error: No such .lgx file: ./typo.lgx\n", "status": "pass"}], "md": "### 7.2 A missing file is reported as a missing file\n\n```bash\nlogosctl package install ./typo.lgx -y\n```"}, {"execs": [], "md": "## Step 8: Clean up\n\n`remove` takes the package **name**, not the file it came from \u2014 once\ninstalled, the `.lgx` has done its job and the session tracks the\npackage by name like any other. It stops the module first, since its\nfiles are about to disappear."}, {"execs": [{"cmd": "./ctl/bin/logosctl --human --config-dir ./session package remove test_basic_module -y", "exit_code": 0, "kind": "run", "note": "", "output": "The following changes will be made (remove):\n  remove     test_basic_module (1.0.0)\nThese running modules will be stopped: test_basic_module\nRemoved: test_basic_module\n", "status": "pass"}], "md": "### 8.1 Remove the package\n\n```bash\nlogosctl package remove test_basic_module -y\n```"}, {"execs": [{"cmd": "./ctl/bin/logosctl --config-dir ./session daemon stop", "exit_code": 0, "kind": "run", "note": "", "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 8.2 Stop the daemon\n\n```bash\nlogosctl daemon stop\n```"}]}, {"meta": {"name": "What Ships Inside the logosctl Binary", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"execs": [], "md": "# What Ships Inside the logosctl Binary\n\n`logosctl` is not just a client \u2014 it ships a small set of **bundled modules**\nthat make it self-sufficient. They live next to the binary and are added to\nthe daemon's module search path automatically, as read-only \"embedded\"\ndirectories sitting alongside the writable one in your session dir.\n\nThey arrive in two directories, which is worth explaining because it looks\nodd at first:\n\n| Directory | Contents |\n|---|---|\n| `<bin>/../modules` | `capability_module` \u2014 bundled by **both** binaries this repo ships |\n| `<bin>/../modules-pkg` | `package_manager`, `package_downloader` \u2014 `logosctl` only |\n\n`logoscore` scans `modules/` and its doc-tests assert exactly what is in\nthere, so the package modules go in a directory of their own rather than\nchanging what `logoscore` sees. The daemon adds both paths, so the split is\ninvisible in use \u2014 `module ls` shows all three.\n\nThree modules are bundled:\n\n| Module | Why it ships |\n|---|---|\n| `capability_module` | The auth handshake every client performs before its first RPC. Without it, nothing connects. |\n| `package_manager` | Installs and uninstalls packages, and owns the dependency graph. |\n| `package_downloader` | Owns the catalogs: search, dependency resolution, downloads. |\n\nThis is the same trio [`logos-basecamp`](https://github.com/logos-co/logos-basecamp)\nbundles, so the CLI and the desktop app drive an identical module surface \u2014 the\nCLI is not a reduced-capability sibling.\n\nThis doc-test builds **this** commit and asserts all three are present.\n\n**What you'll learn:**\n\n- Which modules ship inside the logosctl binary, and why each one is there\n- Where bundled modules live on disk relative to the binary\n- How the embedded module directory relates to your session's writable one\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`"}, {"execs": [], "md": "## Step 1: Build logosctl\n\nBuild the CLI from this commit. The build bundles each module into an\n`.lgx` package and installs it into the output's `modules/` directory, so\nwhat you get is exactly what a released binary would ship."}, {"execs": [{"cmd": "nix build \"github:logos-co/logos-logoscore-cli/5200623eeff8a96b3e46657fbf2ef54d40d101f4#ctl\" -o ctl", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 1.1 Build the CLI\n\n```bash\nnix build 'github:logos-co/logos-logoscore-cli#ctl'\n```"}, {"execs": [], "md": "## Step 2: Confirm the bundled modules\n\nAll three modules must be present. `capability_module` is load-bearing for\n*any* client command; the two package modules are what let `logosctl`\ninstall and manage packages on its own rather than shelling out to\nseparate tools."}, {"execs": [{"cmd": "ls ctl/modules ctl/modules-pkg", "exit_code": 0, "kind": "run", "note": "", "output": "ctl/modules:\ncapability_module\n\nctl/modules-pkg:\npackage_downloader\npackage_manager\n", "status": "pass"}], "md": "### 2.1 List the bundled modules\n\n```bash\nls ctl/modules ctl/modules-pkg\n```"}, {"execs": [{"cmd": "ls ctl/modules-pkg/package_manager", "exit_code": 0, "kind": "run", "note": "", "output": "liblgx.so\nlibpackage_manager_lib.so\nmanifest.json\npackage_manager_plugin.so\nvariant\n", "status": "pass"}], "md": "### 2.2 Each module is a real installed package\n\nThe bundler runs the package manager at build time, so every entry is\na proper installed package \u2014 a `manifest.json`, a `variant` marker,\nand the plugin binary \u2014 not a loose library dropped in a folder.\n\n```bash\nls ctl/modules-pkg/package_manager\n```"}, {"execs": [], "md": "## Step 3: The daemon picks them up automatically\n\nStart a daemon with no module configuration at all. It still finds all\nthree, because both bundled directories are always on the search path\nalongside your session's writable `modules/` directory."}, {"execs": [{"cmd": "./ctl/bin/logosctl --config-dir ./session -D > daemon.log 2>&1 &\n# Capture, then test -- NOT `status --json | grep -q`. grep -q exits on\n# its first match, the producer takes SIGPIPE (141), and under\n# `set -o pipefail` the pipeline reports 141 rather than 0, so the\n# `&& break` never fires and the wait runs all 60 iterations before\n# giving up on a daemon that came up immediately.\nfor _ in $(seq 1 60); do\n  st=$(./ctl/bin/logosctl --config-dir ./session status --json 2>/dev/null || true)\n  case \"$st\" in *'\"running\"'*) break ;; esac\n  sleep 1\ndone\n", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 3.1 Start the daemon\n\n```bash\nlogosctl --config-dir ./session -D &\n```"}, {"execs": [{"cmd": "./ctl/bin/logosctl --config-dir ./session module ls", "exit_code": 0, "kind": "run", "note": "", "output": "[{\"name\":\"package_manager\",\"status\":\"loaded\",\"uptime_seconds\":1,\"version\":\"1.0.0\"},{\"name\":\"package_downloader\",\"status\":\"loaded\",\"uptime_seconds\":1,\"version\":\"1.0.0\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":1,\"version\":\"1.0.0\"}]\n", "status": "pass"}], "md": "### 3.2 The bundled modules are discoverable\n\n```bash\nlogosctl module ls\n```"}, {"execs": [{"cmd": "./ctl/bin/logosctl --config-dir ./session stop", "exit_code": 0, "kind": "run", "note": "", "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.3 Stop the daemon\n\n```bash\nlogosctl daemon stop\n```"}]}, {"meta": {"name": "Installing and Removing Packages with logosctl", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Installing and Removing Packages with logosctl\n\nThis is the capability that made `logosctl` worth merging: it installs\npackages itself. Previously that took three binaries \u2014 `lgpd` to search a\ncatalog and download a `.lgx`, `lgpm` to install it, and `logoscore` to run\nit \u2014 wired together by hand.\n\n`logosctl` bundles the `package_manager` and `package_downloader` modules\n(the same pair the Basecamp desktop app ships), so one tool covers the whole\nloop: search a catalog, install with dependencies resolved, load, call, and\nremove again.\n\nTwo rules shape everything below, and they are worth stating up front:\n\n- **Installing does not load.** `install` puts files on disk; `module load`\n  activates them. They are separate acts because you may well want to stage\n  a package without starting it.\n- **The daemon does not need restarting.** After an install it re-scans, so a\n  freshly installed module is loadable immediately. Only modules that were\n  *already running* and had to be stopped get restarted.\n\nThis doc-test runs against the **live** module catalog, so it needs network\naccess.\n\n**What you'll build:** A logosctl session with a real package installed from the public catalog, loaded, called, and then removed along with everything that depended on it.\n\n**What you'll learn:**\n\n- How a logosctl session holds its own packages, and why that makes it portable\n- How to search the catalog and preview an install with `--dry-run`\n- Why `install` deliberately leaves the package unloaded\n- How dependencies are resolved on install, and dependents removed on uninstall\n- Why a destructive command with no `-y` and no terminal is refused rather than assumed\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`\n\n- **Network access.** The catalog and the packages are fetched from the public module release repository."}, {"execs": [], "md": "## Step 1: Build the portable logosctl bundle\n\nPackages in the public catalog ship **portable** variants, so this\ndoc-test uses the portable bundle rather than the dev build. A dev build\nlooks for `-dev` variants and would correctly refuse to install a\nreleased package \u2014 that mismatch is a feature, not a failure."}, {"execs": [{"cmd": "nix build \"github:logos-co/logos-logoscore-cli/5200623eeff8a96b3e46657fbf2ef54d40d101f4#ctl-bundle-dir\" -o result-portable", "exit_code": 0, "kind": "run", "note": "", "output": "these 14 deriv tl-bundle-dir' -o result-portable\n```"}, {"execs": [], "md": "## Step 2: Start a session\n\nA **session** is one directory holding everything: config, the packages\ninstalled into it, per-module persistence, and the keyring used to verify\nsignatures. `--config-dir` picks which one. Nothing here touches\n`~/.logosctl`, and nothing touches a `logoscore` deployment either \u2014 the\ntwo tools share no state."}, {"execs": [{"cmd": "./result-portable/bin/logosctl --config-dir ./session daemon start --detach", "exit_code": 0, "kind": "run", "note": "", "output": "Daemon started (pid 36290)\nLogs: /home/runner/work/_temp/doctest-test-06je0xjj/./session/logs/daemon.log\n", "status": "pass"}], "md": "### 2.1 Start the daemon\n\n`--detach` returns only once the daemon is actually accepting\ncommands, so the next command cannot race the boot.\n\n```bash\nlogosctl --config-dir ./session daemon start --detach\n```"}, {"execs": [{"cmd": "./result-portable/bin/logosctl --config-dir ./session module ls", "exit_code": 0, "kind": "run", "note": "", "output": "[{\"name\":\"package_manager\",\"status\":\"loaded\",\"uptime_seconds\":1,\"version\":\"1.0.0\"},{\"name\":\"package_downloader\",\"status\":\"loaded\",\"uptime_seconds\":1,\"version\":\"1.0.0\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":1,\"version\":\"1.0.0\"}]\n", "status": "pass"}], "md": "### 2.2 The package modules come up with it\n\n`package_manager` and `package_downloader` are bundled and loaded at\nboot, because every package command is a call into them.\n\n```bash\nlogosctl module ls\n```"}, {"execs": [], "md": "## Step 3: Find something to install\n\nThe catalog is the merged view over every enabled source. One ships by\ndefault; `logosctl catalog add <url>` adds more."}, {"execs": [{"cmd": "./result-portable/bin/logosctl --config-dir ./session catalog ls", "exit_code": 0, "kind": "run", "note": "", "output": "[{\"description\":\"Curated official Logos modules.\",\"displayName\":\"Lo ing which running modules would be stopped and restarted \u2014 without\nwriting anything.\n\nOutput below is JSON because these commands are piped rather than run on\na terminal; on a terminal you get the same information as a table. `--json`\nand `--human` force either form."}, {"execs": [{"cmd": "./result-portable/bin/logosctl --config-dir ./session install openmetrics --dry-run", "exit_code": 0, "kind": "run", "note": "", "output": "{\"affected_loaded\":[],\"changes\":[{\"action\":\"install\",\"fromVersion\":\"\",\"name\":\"openmetrics\",\"repository\":\"https://raw.githubusercontent.com/logos-co/logos-modules-release/refs/heads/main/logos-repo.json\",\"toVersion\":\"0.1.1\",\"topLevel\":true}],\"op\":\"install\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 4.1 Preview the install\n\n```bash\nlogosctl install openmetrics --dry-run\n```"}, {"execs": [{"cmd": "./result-portable/bin/logosctl --config-dir ./session install openmetrics -y", "exit_code": 0, "kind": "run", "note": "", "output": "{\"affected_loaded\":[],\"changes\":[{\"action\":\"install\",\"fromVersion\":\"\",\"name\":\"openmetrics\",\"repository\":\"https://raw.githubusercontent.com/logos-co/logos-modules-release/refs/heads/main/logos-repo.json\",\"toVersion\":\"0.1.1\",\"topLevel\":true}],\"installed\":[\"openmetrics\"],\"op\":\"install\",\"reloaded\":[],\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 4.2 Install for real\n\n`-y` skips the confirmation. Without it, and with no terminal to ask\non, the command is **refused** rather than assumed \u2014 a script that\nforgot `--yes` should fail loudly, not quietly install things.\n\n```bash\nlogosctl install openmetrics -y\n```"}, {"execs": [{"cmd": "./result-portable/bin/logosctl --config-dir ./session package ls", "exit_code": 0, "kind": "run", "note": "", "output": "[{\"author\":\"Logos Core Team\",\"category\":\"monitoring\",\"dependencies\":[],\"description\":\"Serves an OpenMetrics /metrics endpoint by scraping modules that implement collectMetrics()\",\"displayName\":\"\",\"hashes\":{\"root\":\"973dab6f364b215e9a6dc1ab115218d345880bb938fade898aa97233a10532d4\"},\"icon\":\"\",\"installDir\":\"/home/runner/work/_temp/doctest-test-06je0xjj/./session/modules/openmetrics\",\"installType\":\"user\",\"license\":\"\",\"mainFilePath\":\"/home/runner/work/_temp/doctest-test-06je0xjj/./session/modules/openmetrics/openmetrics_plugin.so\",\"manifestVersion\":\"0.3.0\",\"name\":\"openmetrics\",\"type\":\"core\",\"version\":\"0.1.1\",\"view\":\"\"},{\"author\":\"Logos Core Team\",\"category\":\"management\",\"dependencies\":[],\"description\":\"Online package catalog and download service\",\"displayName\":\"Package Downloader\",\"hashes\":{\"root\":\"8209b53b142cd82dca3c6c65578c057eed06124ede83960ef63468cf7d8039e9\"},\"icon\":\"\",\"installDir\":\"/nix/store/zppnisg5id8ij68qca248p8rv8jh758m-logos-logoscore-cli-logosctl-portable-bundle-0.1.0-dev/modules-pkg/package_downloader\",\"installType\":\"embedded\",\"license\":\"\",\"mainFilePath\":\"/nix/store/zppnisg5id8ij68qca248p8rv8jh758m-logos-logoscore-cli-logosctl-portable-bundle-0.1.0-dev/modules-pkg/package_downloader/package_downloader_plugin.so\",\"manifestVersion\":\"0.4.0\",\"name\":\"package_downloader\",\"type\":\"core\",\"version\":\"1.0.0\",\"view\":\"\"},{\"author\":\"Logos Core Team\",\"category\":\"management\",\"dependencies\":[],\"description\":\"Plugin manager for the Logos system\",\"displayName\":\"Package Manager\",\"hashes\":{\"root\":\"5c31950d9e568318397438cbb7050c5c756dd7ff11304d7123a39dae37defd4d\"},\"icon\":\"\",\"installDir\":\"/nix/store/zppnisg5id8ij68qca248p8rv8jh758m-logos-logoscore-cli-logosctl-portable-bundle-0.1.0-dev/modules-pkg/package_manager\",\"installType\":\"embedded\",\"license\":\"\",\"mainFilePath\":\"/nix/store/zppnisg5id8ij68qca248p8rv8jh758m-logos-logoscore-cli-logosctl-portable-bundle-0.1.0-dev/modules-pkg/package_manager/package_manager_plugin.so\",\"manifestVersion\":\"0.4.0\",\"name\":\"package_manager\",\"type\":\"core\",\"version\":\"1.0.0\",\"view\":\"\"}]\n", "status": "pass"}], "md": "### 4.3 It landed in the session, not the bundle\n\n`SOURCE` distinguishes the read-only modules shipped beside the\nbinary (`embedded`) from what this session installed (`user`).\n\n```bash\nlogosctl package ls\n```"}, {"execs": [], "md": "## Step 5: Installed is not loaded\n\nThe package is on disk and the daemon has already re-scanned, so it is\ndiscoverable \u2014 but it is not running. That separation is deliberate."}, {"execs": [{"cmd": "./result-portable/bin/logosctl --config-dir ./session module ls", "exit_code": 0, "kind": "run", "note": "", "output": "[{\"name\":\"openmetrics\",\"status\":\"not_loaded\",\"version\":\"0.1.1\"},{\"name\":\"package_manager\",\"status\":\"loaded\",\"uptime_seconds\":5,\"version\":\"1.0.0\"},{\"name\":\"package_downloader\",\"status\":\"loaded\",\"uptime_seconds\":5,\"version\":\"1.0.0\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":5,\"version\":\"1.0.0\"}]\n", "status": "pass"}], "md": "### 5.1 Discoverable, not loaded\n\n```bash\nlogosctl module ls\n```"}, {"execs": [{"cmd": "./result-portable/bin/logosctl --config-dir ./session module load openmetrics", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[],\"module\":\"openmetrics\",\"status\":\"ok\",\"version\":\"0.1.1\"}\n", "status": "pass"}], "md": "### 5.2 Load it \u2014 no daemon restart needed\n\n```bash\nlogosctl module load openmetrics\n```"}, {"execs": [{"cmd": "./result-portable/bin/logosctl --config-dir ./session module ls --loaded", "exit_code": 0, "kind": "run", "note": "", "output": "[{\"name\":\"openmetrics\",\"status\":\"loaded\",\"uptime_seconds\":0,\"version\":\"0.1.1\"},{\"name\":\"package_manager\",\"status\":\"loaded\",\"uptime_seconds\":5,\"version\":\"1.0.0\"},{\"name\":\"package_downloader\",\"status\":\"loaded\",\"uptime_seconds\":5,\"version\":\"1.0.0\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":5,\"version\":\"1.0.0\"}]\n", "status": "pass"}], "md": "### 5.3 Confirm it is running\n\n```bash\nlogosctl module ls --loaded\n```"}, {"execs": [], "md": "## Step 6: Remove it\n\nRemoval is the mirror image of install: it takes **dependents** with it by\ndefault, because leaving a module running against a package that no longer\nexists is the more surprising outcome. `--no-dependents` opts out."}, {"execs": [{"cmd": "./result-portable/bin/logosctl --config-dir ./session package remove openmetrics --dry-run", "exit_code": 0, "kind": "run", "note": "", "output": "{\"affected_loaded\":[\"openmetrics\"],\"changes\":[{\"action\":\"remove\",\"fromVersion\":\"0.1.1\",\"name\":\"openmetrics\",\"toVersion\":\"\"}],\"op\":\"remove\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 6.1 Preview the removal\n\nNote that it reports the running module it will stop. Nothing here is\nrestarted afterwards \u2014 it is being removed.\n\n```bash\nlogosctl package remove openmetrics --dry-run\n```"}, {"execs": [{"cmd": "./result-portable/bin/logosctl --config-dir ./session package remove openmetrics -y", "exit_code": 0, "kind": "run", "note": "", "output": "{\"affected_loaded\":[\"openmetrics\"],\"changes\":[{\"action\":\"remove\",\"fromVersion\":\"0.1.1\",\"name\":\"openmetrics\",\"toVersion\":\"\"}],\"op\":\"remove\",\"reloaded\":[],\"removed\":[\"openmetrics\"],\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 6.2 Remove for real\n\n```bash\nlogosctl package remove openmetrics -y\n```"}, {"execs": [{"cmd": "./result-portable/bin/logosctl --config-dir ./session package ls", "exit_code": 0, "kind": "run", "note": "", "output": "[{\"author\":\"Logos Core Team\",\"category\":\"management\",\"dependencies\":[],\"description\":\"Online package catalog and download service\",\"displayName\":\"Package Downloader\",\"hashes\":{\"root\":\"8209b53b142cd82dca3c6c65578c057eed06124ede83960ef63468cf7d8039e9\"},\"icon\":\"\",\"installDir\":\"/nix/store/zppnisg5id8ij68qca248p8rv8jh758m-logos-logoscore-cli-logosctl-portable-bundle-0.1.0-dev/modules-pkg/package_downloader\",\"installType\":\"embedded\",\"license\":\"\",\"mainFilePath\":\"/nix/store/zppnisg5id8ij68qca248p8rv8jh758m-logos-logoscore-cli-logosctl-portable-bundle-0.1.0-dev/modules-pkg/package_downloader/package_downloader_plugin.so\",\"manifestVersion\":\"0.4.0\",\"name\":\"package_downloader\",\"type\":\"core\",\"version\":\"1.0.0\",\"view\":\"\"},{\"author\":\"Logos Core Team\",\"category\":\"management\",\"dependencies\":[],\"description\":\"Plugin manager for the Logos system\",\"displayName\":\"Package Manager\",\"hashes\":{\"root\":\"5c31950d9e568318397438cbb7050c5c756dd7ff11304d7123a39dae37defd4d\"},\"icon\":\"\",\"installDir\":\"/nix/store/zppnisg5id8ij68qca248p8rv8jh758m-logos-logoscore-cli-logosctl-portable-bundle-0.1.0-dev/modules-pkg/package_manager\",\"installType\":\"embedded\",\"license\":\"\",\"mainFilePath\":\"/nix/store/zppnisg5id8ij68qca248p8rv8jh758m-logos-logoscore-cli-logosctl-portable-bundle-0.1.0-dev/modules-pkg/package_manager/package_manager_plugin.so\",\"manifestVersion\":\"0.4.0\",\"name\":\"package_manager\",\"type\":\"core\",\"version\":\"1.0.0\",\"view\":\"\"}]\n", "status": "pass"}], "md": "### 6.3 Gone from the session\n\n```bash\nlogosctl package ls\n```"}, {"execs": [{"cmd": "./result-portable/bin/logosctl --config-dir ./session daemon stop", "exit_code": 0, "kind": "run", "note": "", "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 6.4 Stop the daemon\n\n```bash\nlogosctl daemon stop\n```"}]}, {"meta": {"name": "Reaching the logosctl Daemon over TCP and TCP+TLS", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Reaching the logosctl Daemon over TCP and TCP+TLS\n\nBy default the `logosctl` daemon binds every module to a local Unix socket,\nso only clients on the same host \u2014 using the auto-emitted config under\n`~/.logosctl/` \u2014 can reach it. This doc-test shows how to expose the daemon\nover the network instead, using the two non-local transports `logosctl`\nsupports:\n\n- **`tcp`** \u2014 a plaintext TCP listener. Good for loopback and trusted\n  networks. On a non-loopback host it puts the auth token on the wire in\n  cleartext, so the daemon refuses to bind it there unless the config says\n  `insecure_tcp: true`.\n- **`tcp_ssl`** \u2014 a TLS-wrapped TCP listener. The wire is encrypted with a\n  server certificate; the client verifies that certificate against a CA.\n\nWe drive everything on a single host over the loopback interface\n(`127.0.0.1`) so the doc-test is self-contained and needs no second machine,\nbut the moving parts \u2014 a per-module network listener on the daemon, a\nclient dial spec, and a copied auth token \u2014 are exactly the ones a real\nremote client uses.\n\nBoth sides are configured the same way: write a YAML document, install it\ninto the session with `daemon config set` / `client config set`. Configuration\nis never passed alongside another command, so `daemon start` always acts on\nwhatever the session already holds.\n\n> \u26a0\ufe0f **Remote operation is under active development.** The config schema\n> and the auth model may change between\n> releases. Local same-host use is the stable path. This walkthrough\n> authenticates the network client with the daemon's **auto-emitted token**\n> (`client/auto.json`), which is the credential the daemon registers for\n> itself at boot.\n>\n> Operator-issued tokens (`logosctl token issue --name alice`) are also\n> honored for `core_service` calls over every transport, and are the better\n> choice for a real remote client: they are named, can carry an `--expires`\n> deadline, and can be revoked while the node keeps running. A token issued\n> `--local-only` is deliberately refused over `tcp` / `tcp_ssl` and accepted\n> only on the local socket.\n\n**What you'll learn:**\n\n- How the daemon's per-module transports work and why `local` is always present\n- How to add a `tcp` listener to the well-known modules with `daemon config set`\n- Why both `core_service` and `capability_module` must be exposed, not just one\n- How the plaintext-TCP guard protects you from leaking tokens on the wire\n- How to write a client dial spec with `client config set` and point a client at it with `--config-dir`\n- How to copy the daemon's auth token into the client config directory\n- How to drive the daemon (`status`, `module load`, `call`, \u2026) over TCP\n- How to switch the same setup to `tcp_ssl` with a self-signed certificate\n- How TLS peer verification fails closed when the client has no CA to trust\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`\n\n- **OpenSSL** on `PATH` (only the final TLS section needs it) to generate a\nthrowaway self-signed certificate.\n\nVerify: `openssl version`"}, {"execs": [], "md": "## Step 1: Build logosctl and prepare modules\n\nBuild the CLI and assemble a modules directory, exactly as in the daemon\ndoc-test. The daemon needs the bundled `capability_module` (used for the\nclient handshake) plus at least one ordinary module to load and call \u2014\nhere `test_basic_module` from logos-test-modules."}, {"execs": [{"cmd": "nix build \"github:logos-co/logos-logoscore-cli/5200623eeff8a96b3e46657fbf2ef54d40d101f4#ctl\" --out-link ./logos", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 1.1 Build the CLI\n\n```bash\nnix build 'github:logos-co/logos-logoscore-cli#ctl' --out-link ./logos\n```\n\nThe build produces `logos/bin/logosctl` plus a `logos/modules/`\ndirectory containing the built-in `capability_module`."}, {"execs": [{"cmd": "SYSTEM=$(nix eval --impure --raw --expr 'builtins.currentSystem')\nnix build \"github:logos-co/logos-test-modules#modules.$SYSTEM.test_basic_module.install\" --out-link ./result-module\nmkdir -p modules\n# cp -RL copies the read-only nix-store trees as read-only files, so a\n# re-run (or a pre-populated modules/) can't overwrite them. Restore\n# write permission first to keep the copy idempotent.\nchmod -R u+w ./modules 2>/dev/null || true\ncp -RL ./logos/modules/. ./modules/\nchmod -R u+w ./modules 2>/dev/null || true\ncp -RL ./result-module/modules/. ./modules/\n", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 1.2 Install a module to load\n\nBuild `test_basic_module` and merge it with the bundled capability\nmodule into `./modules/`:\n\n```bash\nSYSTEM=$(nix eval --impure --raw --expr 'builtins.currentSystem')\nnix build \"github:logos-co/logos-test-modules#modules.$SYSTEM.test_basic_module.install\" --out-link ./result-module\nmkdir -p modules\n# cp -RL copies the read-only nix-store trees as read-only files, so a\n# re-run (or a pre-populated modules/) can't overwrite them. Restore\n# write permission first to keep the copy idempotent.\nchmod -R u+w ./modules 2>/dev/null || true\ncp -RL ./logos/modules/. ./modules/\nchmod -R u+w ./modules 2>/dev/null || true\ncp -RL ./result-module/modules/. ./modules/\n\n```\n\n```\nmodules/\n\u251c\u2500\u2500 capability_module/\n\u2502   \u251c\u2500\u2500 manifest.json\n\u2502   \u2514\u2500\u2500 capability_module_plugin.{so,dylib}\n\u2514\u2500\u2500 test_basic_module/\n    \u251c\u2500\u2500 manifest.json\n    \u2514\u2500\u2500 test_basic_module_plugin.{so,dylib}\n```"}, {"execs": [], "md": "## Step 2: Start the daemon with TCP listeners\n\nThe daemon's listeners live in its config document, under `modules:` \u2014\none entry per module, each a list of listeners. We bind **both**\nwell-known modules on loopback: `core_service` on port 6000 and\n`capability_module` on port 6001.\n\nTwo things worth calling out:\n\n- **`local` is always present.** Every configured module keeps its\n  same-host Unix-socket listener; the `tcp` entry is an *additional*\n  outside-facing surface. That's what lets the daemon's own\n  intra-process calls keep working while remote clients use TCP.\n- **Expose `capability_module`, not just `core_service`.** Before its\n  first call, a client performs a `requestModule` handshake against\n  `capability_module` to resolve the endpoint. A remote client has no\n  Unix socket to the daemon, so that handshake has to ride the network\n  too. Expose only `core_service` and remote client commands hang or fail\n  at connect time.\n\nWe use `--config-dir ./daemon-home` to keep all daemon state inside the\nworking directory instead of `~/.logosctl`."}, {"execs": [{"cmd": "mkdir -p ./daemon-home\ncat > ./public.yaml <<'YAML'\nversion: 2\nmodules_dirs:\n  - ./modules\nmodules:\n  core_service:\n    - protocol: tcp\n      host: 0.0.0.0\n      port: 6000\nYAML\n./logos/bin/logosctl --config-dir ./daemon-home daemon config set ./public.yaml\n./logos/bin/logosctl --config-dir ./daemon-home daemon start --detach 2>&1 || true\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"path\":\"/home/runner/work/_temp/doctest-test-w4p9q7fl/./daemon-home/daemon/config.yaml\",\"status\":\"ok\"}\nError: module 'core_service' binds plaintext tcp on non-loopback host '0.0.0.0'. Use protocol: tcp_ssl, or set insecure_tcp: true in the daemon config if you really mean it.\n", "status": "pass"}], "md": "### 2.1 Refuse plaintext TCP on a public interface\n\nFirst, a guardrail. Plaintext `tcp` on a non-loopback host would put\nthe auth token on the wire in cleartext, so the daemon refuses to bind\nit unless the config explicitly says `insecure_tcp: true`. Watch it\nreject a `0.0.0.0` listener (the `|| true` lets the doc-test continue\npast the expected non-zero exit):\n\n```bash\nlogosctl daemon config set ./public.yaml\nlogosctl daemon start --detach\n```\n\nOn loopback (`127.0.0.1`) there is nothing to leak to, so the same\nlistener binds without the escape hatch \u2014 which is what we do next."}, {"execs": [{"cmd": "cat > ./node.yaml <<'YAML'\nversion: 2\nmodules_dirs:\n  - ./modules\nmodules:\n  core_service:\n    - protocol: tcp\n      host: 127.0.0.1\n      port: 6000\n  capability_module:\n    - protocol: tcp\n      host: 127.0.0.1\n      port: 6001\nYAML\n./logos/bin/logosctl --config-dir ./daemon-home daemon config set ./node.yaml\n./logos/bin/logosctl --config-dir ./daemon-home daemon start --detach\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"path\":\"/home/runner/work/_temp/doctest-test-w4p9q7fl/./daemon-home/daemon/config.yaml\",\"status\":\"ok\"}\nDaemon started (pid 36385)\nLogs: /home/runner/work/_temp/doctest-test-w4p9q7fl/./daemon-home/logs/daemon.log\n", "status": "pass"}], "md": "### 2.2 Start the daemon on loopback TCP\n\nReplace the config with one that binds both well-known modules on\nloopback. `config set` overwrites wholesale \u2014 there is no merge \u2014 so\nthis is the whole daemon configuration:\n\n```bash\nlogosctl daemon config set ./node.yaml\nlogosctl daemon start --detach\n```"}, {"execs": [{"cmd": "sleep 4", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 4\n```"}, {"execs": [{"cmd": "cat ./daemon-home/daemon/state.json", "exit_code": 0, "kind": "run", "note": "", "output": "{\n    \"config_source\": \"config.yaml\",\n    \"instance_id\": \"e0141d410f82\",\n    \"pid\": 36385,\n    \"resolved\": {\n        \"insecure_tcp\": false,\n        \"logging\": {\n            \"console\": true,\n            \"enabled\": true,\n            \"file\": \"daemon.log\",\n            \"max_files\": 5,\n            \"max_size_mb\": 10\n        },\n        \"modules\": {\n            \"capability_module\": {\n                \"transports\": [\n                    {\n                        \"protocol\": \"local\"\n                    },\n                    {\n                        \"codec\": \"json\",\n                        \"host\": \"127.0.0.1\",\n                        \"port\": 6001,\n                        \"protocol\": \"tcp\"\n                    }\n                ]\n            },\n            \"core_service\": {\n                \"transports\": [\n                    {\n                        \"protocol\": \"local\"\n                    },\n                    {\n                        \"codec\": \"json\",\n                        \"host\": \"127.0.0.1\",\n                        \"port\": 6000,\n                        \"protocol\": \"tcp\"\n                    }\n                ]\n            }\n        },\n        \"modules_dirs\": [\n            \"./modules\"\n        ],\n        \"persistence_path\": \"\",\n        \"ssl\": {\n            \"ca\": \"\",\n            \"cert\": \"\",\n            \"key\": \"\"\n        }\n    },\n    \"started_at\": \"2026-08-21T01:57:35Z\",\n    \"version\": 2\n}\n", "status": "pass"}], "md": "### 2.3 Confirm the resolved transports\n\nThe daemon records the transports it actually bound in\n`daemon/state.json`. Each well-known module shows the implicit\n`local` listener first, followed by the `tcp` one we asked for:\n\n```bash\ncat ~/.logosctl/daemon/state.json\n```"}, {"execs": [], "md": "## Step 3: Point a client at the daemon over TCP\n\nA network client doesn't read the daemon's files \u2014 it dials whatever its\nown client config says and authenticates with a token file beside it. We\nbuild a **separate** config directory (`./client-home`) to make the\nclient/daemon split explicit, then point the client at it with\n`--config-dir`.\n\nThe directory layout the client ends up with:\n\n```\nclient-home/            \u2190 pass this to --config-dir\n\u2514\u2500\u2500 client/\n    \u251c\u2500\u2500 config.yaml     \u2190 the dial spec, written by `client config set`\n    \u2514\u2500\u2500 auto.json       \u2190 the auth token referenced by token_file\n```"}, {"execs": [{"cmd": "mkdir -p ./client-home/client\ncp ./daemon-home/client/auto.json ./client-home/client/auto.json\n", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 3.1 Copy the daemon's auth token\n\nAt boot the daemon emits its own token to\n`client/auto.json` under its config dir. Copy that into the client's\n`client/` directory \u2014 it's the credential the client will present:\n\n```bash\nmkdir -p ./client-home/client\ncp ./daemon-home/client/auto.json ./client-home/client/auto.json\n\n```\n\n> On a real remote host you'd `scp` this file across instead of\n> copying it locally. Treat it as a secret: anything holding it can\n> drive the daemon."}, {"execs": [{"cmd": "cat > ./client.yaml <<'YAML'\nversion: 2\ntoken_file: auto.json\ndaemon:\n  core_service:      { transport: tcp, host: 127.0.0.1, port: 6000 }\n  capability_module: { transport: tcp, host: 127.0.0.1, port: 6001 }\nYAML\n./logos/bin/logosctl --config-dir ./client-home client config set ./client.yaml\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"path\":\"/home/runner/work/_temp/doctest-test-w4p9q7fl/./client-home/client/config.yaml\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.2 Write the dial spec\n\nThe client schema is version `2`. `token_file` names the file you just\ncopied, and the `daemon` block lists one entry per module with its\ntransport, host, and port \u2014 matching the listeners the daemon bound.\nBoth `core_service` and `capability_module` are required.\n\nNote the client says `transport:` where the daemon config said\n`protocol:`. The two documents describe opposite ends of the same\nconnection and their key names were never unified; `config set`\nvalidates up front and names the key it expected, so a mix-up fails\nhere rather than at connect time.\n\n```bash\nlogosctl --config-dir ./client-home client config set ./client.yaml\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./client-home status", "exit_code": 0, "kind": "run", "note": "", "output": "{\"daemon\":{\"pid\":36385,\"status\":\"running\",\"version\":\"1.0.0\"},\"modules\":[{\"name\":\"test_basic_module\",\"status\":\"not_loaded\",\"version\":\"1.0.0\"},{\"name\":\"package_manager\",\"status\":\"loaded\",\"uptime_seconds\":4,\"version\":\"1.0.0\"},{\"name\":\"package_downloader\",\"status\":\"loaded\",\"uptime_seconds\":4,\"version\":\"1.0.0\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":4,\"version\":\"1.0.0\"}],\"modules_summary\":{\"crashed\":0,\"loaded\":3,\"not_loaded\":1}}\n", "status": "pass"}], "md": "### 3.3 Check daemon status over TCP\n\nWith the dial spec in place, every client command works against\n`--config-dir ./client-home` \u2014 the traffic now goes over TCP:\n\n```bash\nlogosctl --config-dir ./client-home status\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./client-home module ls", "exit_code": 0, "kind": "run", "note": "", "output": "[{\"name\":\"test_basic_module\",\"status\":\"not_loaded\",\"version\":\"1.0.0\"},{\"name\":\"package_manager\",\"status\":\"loaded\",\"uptime_seconds\":4,\"version\":\"1.0.0\"},{\"name\":\"package_downloader\",\"status\":\"loaded\",\"uptime_seconds\":4,\"version\":\"1.0.0\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":4,\"version\":\"1.0.0\"}]\n", "status": "pass"}], "md": "### 3.4 List, load, and call over TCP\n\nDrive the module lifecycle exactly as you would locally:\n\n```bash\nlogosctl --config-dir ./client-home module ls\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./client-home module load test_basic_module", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[],\"module\":\"test_basic_module\",\"status\":\"ok\",\"version\":\"1.0.0\"}\n", "status": "pass"}], "md": "```bash\nlogosctl --config-dir ./client-home module load test_basic_module\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./client-home call test_basic_module addInts 2 3", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"addInts\",\"module\":\"test_basic_module\",\"result\":5,\"status\":\"ok\"}\n", "status": "pass"}], "md": "```bash\nlogosctl --config-dir ./client-home call test_basic_module addInts 2 3\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./client-home stop", "exit_code": 0, "kind": "run", "note": "", "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.5 Stop the daemon\n\nShut the TCP daemon down before moving on to the TLS variant:\n\n```bash\nlogosctl --config-dir ./client-home stop\n```"}, {"execs": [{"cmd": "sleep 2", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 2\n```"}, {"execs": [], "md": "## Step 4: Encrypt the wire with tcp_ssl\n\n`tcp` is fine on loopback, but across any untrusted network you want the\nwire encrypted. The `tcp_ssl` protocol wraps the same TCP listener in TLS.\nThe daemon side adds `cert:` and `key:` (the server's certificate and\nprivate key); the client side adds a `ca:` to verify that certificate\nagainst, plus `verify_peer`.\n\nTLS verifies the certificate's host name against the address the client\ndialed, so the certificate must cover `127.0.0.1`. We generate a throwaway\nself-signed certificate whose Subject Alternative Name includes it, and\nuse that same certificate as the client's CA."}, {"execs": [{"cmd": "mkdir -p tls\nopenssl req -x509 -newkey rsa:2048 -nodes \\\n  -keyout tls/key.pem -out tls/cert.pem -days 365 \\\n  -subj \"/CN=logosctl-test\" \\\n  -addext \"subjectAltName=IP:127.0.0.1,DNS:localhost\"\ncp tls/cert.pem tls/ca.pem\n", "exit_code": 0, "kind": "run", "note": "", "output": ".....+.....+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++*.+............+.+...........+...+............+.+..+......+.......+...+.........+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++*...............+....+......+.........+......+...........+....+......+........+.......+..+..........+............+......+..+............+.........+......+...+.+.....+.........+...+..........+...+.................+.......+..+....+......+..............+.+...............+.........+...........+...............+......+...+....+..+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++\n.....+....+...+...+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++*.........+.....+......+.............+......+..+.........+......+.............+..+...+....+...+..+......+....+...+........+.+.....+...+...+...+.......+..................+..+.........+...............+...+.+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++*...........................+....................+.............+......+...+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++\n-----\n", "status": "pass"}], "md": "### 4.1 Generate a self-signed certificate\n\nCreate a key + certificate with `subjectAltName=IP:127.0.0.1`. Because\nit's self-signed, the certificate is also its own CA \u2014 so we copy it to\n`ca.pem` for the client to trust:\n\n```bash\nmkdir -p tls\nopenssl req -x509 -newkey rsa:2048 -nodes \\\n  -keyout tls/key.pem -out tls/cert.pem -days 365 \\\n  -subj \"/CN=logosctl-test\" \\\n  -addext \"subjectAltName=IP:127.0.0.1,DNS:localhost\"\ncp tls/cert.pem tls/ca.pem\n\n```"}, {"execs": [{"cmd": "mkdir -p ./tls-daemon-home\ncat > ./tls-node.yaml <<YAML\nversion: 2\nmodules_dirs:\n  - ./modules\nmodules:\n  core_service:\n    - protocol: tcp_ssl\n      host: 127.0.0.1\n      port: 6443\n      cert: $PWD/tls/cert.pem\n      key: $PWD/tls/key.pem\n  capability_module:\n    - protocol: tcp_ssl\n      host: 127.0.0.1\n      port: 6444\n      cert: $PWD/tls/cert.pem\n      key: $PWD/tls/key.pem\nYAML\n./logos/bin/logosctl --config-dir ./tls-daemon-home daemon config set ./tls-node.yaml\n./logos/bin/logosctl --config-dir ./tls-daemon-home daemon start --detach\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"path\":\"/home/runner/work/_temp/doctest-test-w4p9q7fl/./tls-daemon-home/daemon/config.yaml\",\"status\":\"ok\"}\nDaemon started (pid 36423)\nLogs: /home/runner/work/_temp/doctest-test-w4p9q7fl/./tls-daemon-home/logs/daemon.log\n", "status": "pass"}], "md": "### 4.2 Start the daemon with tcp_ssl listeners\n\nBind both well-known modules over `tcp_ssl`, giving each the cert and\nkey. `insecure_tcp` never enters into it \u2014 TLS is not plaintext:\n\n```bash\nlogosctl daemon config set ./tls-node.yaml\nlogosctl daemon start --detach\n```"}, {"execs": [{"cmd": "sleep 4", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 4\n```"}, {"execs": [{"cmd": "mkdir -p ./tls-client-home/client\ncp ./tls-daemon-home/client/auto.json ./tls-client-home/client/auto.json\ncat > ./tls-client.yaml <<YAML\nversion: 2\ntoken_file: auto.json\ndaemon:\n  core_service:      { transport: tcp_ssl, host: 127.0.0.1, port: 6443, ca: $PWD/tls/ca.pem, verify_peer: true }\n  capability_module: { transport: tcp_ssl, host: 127.0.0.1, port: 6444, ca: $PWD/tls/ca.pem, verify_peer: true }\nYAML\n./logos/bin/logosctl --config-dir ./tls-client-home client config set ./tls-client.yaml\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"path\":\"/home/runner/work/_temp/doctest-test-w4p9q7fl/./tls-client-home/client/config.yaml\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 4.3 Write the TLS dial spec\n\nThe client config is the same shape as before, but `transport` becomes\n`tcp_ssl` and each module entry gains `ca` (the certificate to trust)\nand `verify_peer: true`:\n\n```bash\nlogosctl --config-dir ./tls-client-home client config set ./tls-client.yaml\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./tls-client-home status", "exit_code": 0, "kind": "run", "note": "", "output": "{\"daemon\":{\"pid\":36423,\"status\":\"running\",\"version\":\"1.0.0\"},\"modules\":[{\"name\":\"test_basic_module\",\"status\":\"not_loaded\",\"version\":\"1.0.0\"},{\"name\":\"package_manager\",\"status\":\"loaded\",\"uptime_seconds\":4,\"version\":\"1.0.0\"},{\"name\":\"package_downloader\",\"status\":\"loaded\",\"uptime_seconds\":4,\"version\":\"1.0.0\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":5,\"version\":\"1.0.0\"}],\"modules_summary\":{\"crashed\":0,\"loaded\":3,\"not_loaded\":1}}\n", "status": "pass"}], "md": "### 4.4 Drive the daemon over TLS\n\nStatus, load, and call now travel over an encrypted connection:\n\n```bash\nlogosctl --config-dir ./tls-client-home status\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./tls-client-home module load test_basic_module", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[],\"module\":\"test_basic_module\",\"status\":\"ok\",\"version\":\"1.0.0\"}\n", "status": "pass"}], "md": "```bash\nlogosctl --config-dir ./tls-client-home module load test_basic_module\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./tls-client-home call test_basic_module addInts 40 2", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"addInts\",\"module\":\"test_basic_module\",\"result\":42,\"status\":\"ok\"}\n", "status": "pass"}], "md": "```bash\nlogosctl --config-dir ./tls-client-home call test_basic_module addInts 40 2\n```"}, {"execs": [{"cmd": "cat > ./tls-client-noca.yaml <<'YAML'\nversion: 2\ntoken_file: auto.json\ndaemon:\n  core_service:      { transport: tcp_ssl, host: 127.0.0.1, port: 6443, verify_peer: true }\n  capability_module: { transport: tcp_ssl, host: 127.0.0.1, port: 6444, verify_peer: true }\nYAML\n./logos/bin/logosctl --config-dir ./tls-client-home client config set ./tls-client-noca.yaml\n./logos/bin/logosctl --config-dir ./tls-client-home status || true\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"path\":\"/home/runner/work/_temp/doctest-test-w4p9q7fl/./tls-client-home/client/config.yaml\",\"status\":\"ok\"}\n{\"daemon\":{\"status\":\"not_running\",\"version\":\"pre-release-5200623\"},\"modules\":[],\"rpc_error\":\"core_service not reachable\"}\n", "status": "pass"}], "md": "### 4.5 Verification fails closed without the CA\n\nTLS is only as good as the verification behind it. Re-point the client\nat the same `tcp_ssl` endpoint but drop the `ca` while keeping\n`verify_peer: true` \u2014 the client has nothing to anchor the daemon's\nself-signed certificate to, so the handshake is rejected and the\ndaemon is reported unreachable (the `|| true` lets the doc-test assert\non the failure):\n\n```bash\nlogosctl --config-dir ./tls-client-home status   # no ca \u2192 rejected\n```\n\n> To intentionally skip verification in a dev setup, set\n> `verify_peer: false` instead of omitting the CA \u2014 but never do that\n> against a real network."}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./tls-daemon-home stop", "exit_code": 0, "kind": "run", "note": "", "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 4.6 Stop the TLS daemon\n\n```bash\nlogosctl --config-dir ./tls-daemon-home stop\n```"}, {"execs": [{"cmd": "sleep 2", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 2\n```"}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>

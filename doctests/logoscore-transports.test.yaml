name: "Qt-free logoscore transport boundary"
output: logoscore-transports.md
release: ""

intro: |
  The Qt-free logoscore process uses qt_remote_plain for local RPC. It keeps
  compatibility with current qt_remote modules while Qt stays in logos_host_qt.
  TCP and TLS are intentionally rejected until the plain C ABI implements them.

what_you_learn:
  - The active transport is local qt_remote_plain
  - Old network configuration fails explicitly

prerequisites:
  - "Nix with flakes enabled."

sections:
  - title: "Build logoscore"
    step: true
    steps:
      - title: "Build the CLI"
        run: "nix build 'github:logos-co/logos-logoscore-cli{release}' --out-link ./logos"
        check_file: "logos/bin/logoscore"

  - title: "Reject a network listener"
    step: true
    text: |
      The parser still recognizes the old tcp name so the daemon can report a
      useful migration error. It does not silently fall back to local IPC.
    steps:
      - title: "Request TCP"
        run: "./logos/bin/logoscore --config-dir ./session -D --module-transport core_service=tcp,host=127.0.0.1,port=6000 2>&1 || true"
        code_block: "logoscore -D --module-transport core_service=tcp,host=127.0.0.1,port=6000"
        expect_contains:
          - "not available in the Qt-free logoscore runtime"
          - "use local/qt_remote_plain"

name: "Qt-free logosctl transport boundary"
output: logosctl-transports.md
release: ""

intro: |
  The Qt-free logosctl process uses qt_remote_plain for local RPC. It keeps
  compatibility with current qt_remote modules while Qt stays in logos_host_qt.
  TCP and TLS are intentionally rejected until the plain C ABI implements them.

what_you_learn:
  - The active transport is local qt_remote_plain
  - Old network configuration fails explicitly

prerequisites:
  - "Nix with flakes enabled."

sections:
  - title: "Build logosctl"
    step: true
    steps:
      - title: "Build the CLI"
        run: "nix build 'github:logos-co/logos-logoscore-cli{release}#ctl' --out-link ./logos"
        check_file: "logos/bin/logosctl"

  - title: "Reject a network listener"
    step: true
    text: |
      Configuration validation still accepts the old schema, then daemon
      startup reports that the runtime cannot bind the requested listener.
    steps:
      - title: "Install an old network-shaped config"
        run: |
          cat > node.yaml <<'YAML'
          version: 2
          modules:
            core_service:
              - protocol: tcp
                host: 127.0.0.1
                port: 6000
          YAML
          ./logos/bin/logosctl --config-dir ./session daemon config set ./node.yaml
        check_file: "session/daemon/config.yaml"

      - title: "Start the daemon"
        run: "./logos/bin/logosctl --config-dir ./session daemon start 2>&1 || true"
        code_block: "logosctl daemon start"
        expect_contains:
          - "not available in the Qt-free logoscore runtime"
          - "use local/qt_remote_plain"
